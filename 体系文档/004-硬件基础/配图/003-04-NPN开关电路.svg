<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>NPN 开关电路：负载在上、E 接地、B 经 Rb 接 GPIO 的低边开关骨架</title>
  <rect x="0" y="0" width="1200" height="750" fill="#ffffff"/>

  <text x="60" y="48" font-size="20" font-weight="bold" fill="#0d2f5c">NPN 开关电路：低边开关的通用骨架</text>
  <text x="60" y="72" font-size="11" fill="#616161">来源：003 §3.4 · 负载在 VCC 与 C 之间，E 接地，B 经 Rb 接 GPIO —— 驱动 LED、蜂鸣器、继电器线圈都是这一张</text>

  <!-- ===== 左：完整接线 ===== -->
  <rect x="60" y="92" width="540" height="440" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="80" y="118" font-size="14" font-weight="bold" fill="#37474f">接线拓扑</text>

  <!-- 电源 -->
  <text x="426" y="134" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">VCC</text>
  <text x="446" y="134" font-size="11.5" fill="#616161">3.3V / 5V</text>
  <line x1="426" y1="142" x2="426" y2="160" stroke="#263238" stroke-width="2.5"/>

  <!-- 负载 -->
  <rect x="326" y="160" width="200" height="76" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="426" y="188" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">负载</text>
  <text x="426" y="209" font-size="11.5" fill="#1b3d1e" text-anchor="middle">LED + 限流电阻</text>
  <text x="426" y="227" font-size="11.5" fill="#2e5230" text-anchor="middle">蜂鸣器 / 继电器线圈</text>

  <!-- C 引出 -->
  <path d="M 426 236 L 426 286 L 390 316" fill="none" stroke="#263238" stroke-width="2.5"/>
  <text x="436" y="254" font-size="12" font-weight="bold" fill="#263238">C</text>

  <!-- 三极管符号 -->
  <line x1="390" y1="300" x2="390" y2="360" stroke="#263238" stroke-width="3"/>
  <text x="376" y="322" font-size="12" font-weight="bold" fill="#263238" text-anchor="end">B</text>
  <text x="444" y="338" font-size="12" font-weight="bold" fill="#263238">NPN</text>

  <!-- E 引出 -->
  <path d="M 390 344 L 426 374 L 426 398" fill="none" stroke="#263238" stroke-width="2.5"/>
  <polygon points="418.1,367.4 403.2,363.4 411.6,353.4" fill="#263238"/>
  <text x="436" y="390" font-size="12" font-weight="bold" fill="#263238">E</text>

  <!-- 控制端 -->
  <rect x="90" y="306" width="136" height="48" rx="24" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="158" y="326" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">GPIO</text>
  <text x="158" y="346" font-size="11.5" fill="#0d2f5c" text-anchor="middle">控制端</text>
  <line x1="226" y1="330" x2="246" y2="330" stroke="#263238" stroke-width="2.5"/>

  <!-- 基极电阻 -->
  <rect x="246" y="316" width="64" height="28" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="278" y="337" font-size="12" font-weight="bold" fill="#7f3f00" text-anchor="middle">Rb</text>
  <text x="278" y="303" font-size="11.5" fill="#7f3f00" text-anchor="middle">必加，按 IB 算</text>
  <line x1="310" y1="330" x2="390" y2="330" stroke="#263238" stroke-width="2.5"/>

  <!-- 地 -->
  <line x1="411" y1="400" x2="441" y2="400" stroke="#263238" stroke-width="2.5"/>
  <line x1="417" y1="407" x2="435" y2="407" stroke="#263238" stroke-width="2.5"/>
  <line x1="422" y1="414" x2="430" y2="414" stroke="#263238" stroke-width="2.5"/>
  <text x="426" y="436" font-size="12" font-weight="bold" fill="#37474f" text-anchor="middle">GND</text>

  <text x="80" y="472" font-size="12" fill="#37474f">电流路径：VCC → 负载 → C → E → GND，负载电流不走 GPIO</text>
  <text x="80" y="496" font-size="11.5" fill="#616161">控制路径：GPIO → Rb → B，只走 mA 级基极电流</text>

  <!-- ===== 右：两种状态 + Rb 计算 ===== -->
  <rect x="620" y="92" width="520" height="138" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="644" y="122" font-size="15" font-weight="bold" fill="#123314">GPIO 输出高电平 → 通</text>
  <text x="644" y="152" font-size="12.5" fill="#1b3d1e">1. B-E 正偏，基极有电流流入</text>
  <text x="644" y="176" font-size="12.5" fill="#1b3d1e">2. C-E 导通，近似短路（压降约 0.2V）</text>
  <text x="644" y="204" font-size="14" font-weight="bold" fill="#1b5e20">→ 负载得电：LED 亮 / 蜂鸣器响 / 继电器吸合</text>

  <rect x="620" y="242" width="520" height="138" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="644" y="272" font-size="15" font-weight="bold" fill="#546e7a">GPIO 输出低电平 → 断</text>
  <text x="644" y="302" font-size="12.5" fill="#546e7a">1. 基极电流为 0，C-E 近似断开</text>
  <text x="644" y="326" font-size="12.5" fill="#546e7a">2. 负载无电流，回路不通</text>
  <text x="644" y="354" font-size="14" font-weight="bold" fill="#37474f">→ 负载断电：LED 灭 / 蜂鸣器停</text>

  <rect x="620" y="392" width="520" height="140" rx="6" fill="#fff8e1" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="644" y="420" font-size="15" font-weight="bold" fill="#5d4037">Rb 怎么算：保证饱和，不留放大区</text>
  <text x="644" y="448" font-size="12.5" fill="#7f3f00" font-family="ui-monospace,Menlo,Consolas,monospace">IB = 100mA / 10 = 10mA</text>
  <text x="644" y="470" font-size="12.5" fill="#7f3f00" font-family="ui-monospace,Menlo,Consolas,monospace">Rb = (3.3 - 0.7) / 0.01 = 260Ω</text>
  <text x="644" y="492" font-size="12.5" fill="#5d4037">→ 取 220Ω（驱动强）或 1kΩ（省功耗）</text>
  <text x="644" y="514" font-size="11.5" fill="#616161">β 取 10 是饱和时的保守值，不是放大倍数</text>

  <!-- ===== 底部：三铁律 ===== -->
  <rect x="60" y="548" width="1080" height="100" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="84" y="576" font-size="14" font-weight="bold" fill="#7f3f00">低边开关三铁律（接错任何一条，现象都像"管子坏了"）</text>

  <rect x="84" y="588" width="333" height="46" rx="4" fill="#ffffff" stroke="#e65100" stroke-width="1"/>
  <text x="100" y="617" font-size="12.5" fill="#7f3f00">① 负载必在 VCC 与 C 之间</text>

  <rect x="433" y="588" width="333" height="46" rx="4" fill="#ffffff" stroke="#e65100" stroke-width="1"/>
  <text x="449" y="617" font-size="12.5" fill="#7f3f00">② E 必须接 GND（不是负载侧）</text>

  <rect x="782" y="588" width="333" height="46" rx="4" fill="#ffffff" stroke="#e65100" stroke-width="1"/>
  <text x="798" y="617" font-size="12.5" fill="#7f3f00">③ B 必须串 Rb（否则烧引脚）</text>

  <!-- ===== 图例 ===== -->
  <rect x="60" y="668" width="1080" height="62" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="60" y="683" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="92" y="694" font-size="12" fill="#37474f">负载与导通态</text>
  <rect x="284" y="683" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="316" y="694" font-size="12" fill="#37474f">GPIO 控制输入</text>
  <rect x="508" y="683" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="540" y="694" font-size="12" fill="#37474f">基极电阻 Rb</text>
  <rect x="732" y="683" width="22" height="14" rx="3" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="764" y="694" font-size="12" fill="#37474f">截止态（GPIO 低）</text>
  <rect x="956" y="683" width="22" height="14" rx="3" fill="#fff8e1" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="988" y="694" font-size="12" fill="#37474f">计算说明</text>
</svg>
