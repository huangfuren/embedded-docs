<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>三极管开关：NPN 高电平通、PNP 低电平通</title>
  <rect x="0" y="0" width="1200" height="540" fill="#ffffff"/>

  <text x="60" y="46" font-size="20" font-weight="bold" fill="#0d2f5c">三极管开关：NPN 高电平通、PNP 低电平通</text>
  <text x="60" y="70" font-size="11" fill="#616161">来源：003 §3.4 · 箭头朝外是 NPN、朝内是 PNP；箭头方向就是电流方向，这是判断类型的唯一视觉抓手</text>

  <!-- 左：NPN -->
  <rect x="60" y="92" width="520" height="244" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
  <text x="80" y="118" font-size="13" font-weight="bold" fill="#0d2f5c">NPN：基极给高电平就通</text>

  <!-- 基极竖线与引线 -->
  <line x1="290" y1="142" x2="290" y2="222" stroke="#0d2f5c" stroke-width="3"/>
  <line x1="228" y1="182" x2="290" y2="182" stroke="#0d2f5c" stroke-width="2"/>
  <!-- 集电极 -->
  <path d="M 290 158 L 326 128 L 326 114" fill="none" stroke="#0d2f5c" stroke-width="2"/>
  <!-- 发射极 -->
  <path d="M 290 206 L 326 236 L 326 252" fill="none" stroke="#0d2f5c" stroke-width="2"/>
  <!-- 发射极箭头（朝外） -->
  <path d="M 308 220 L 322 232 L 304 234 z" fill="#0d2f5c"/>

  <text x="332" y="112" font-size="12" font-weight="bold" fill="#0d2f5c">C</text>
  <text x="216" y="176" font-size="12" font-weight="bold" fill="#0d2f5c" text-anchor="end">B</text>
  <text x="332" y="258" font-size="12" font-weight="bold" fill="#0d2f5c">E</text>

  <text x="376" y="132" font-size="11.5" fill="#37474f">C：接负载到 VCC</text>
  <text x="376" y="160" font-size="11.5" fill="#37474f">B：经 Rb 接 GPIO</text>
  <text x="376" y="188" font-size="11.5" fill="#37474f">E：接 GND</text>
  <text x="376" y="216" font-size="11.5" font-weight="bold" fill="#2e7d32">GPIO 高 → 导通</text>
  <text x="376" y="242" font-size="11.5" fill="#616161">GPIO 低 → 截止</text>

  <text x="80" y="286" font-size="11.5" fill="#0d2f5c">电流方向：C → E（基极电流从 B 流入）</text>
  <text x="80" y="308" font-size="11.5" fill="#7f0000">导通条件：Vb 比 E 高约 0.7V（一个 PN 结压降）</text>
  <text x="80" y="328" font-size="11" fill="#616161">Rb 必加：B-E 是正偏 PN 结，直连等于把 3.3V 短路到地</text>

  <!-- 右：PNP -->
  <rect x="620" y="92" width="520" height="244" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
  <text x="640" y="118" font-size="13" font-weight="bold" fill="#7f0000">PNP：基极给低电平就通</text>

  <line x1="850" y1="142" x2="850" y2="222" stroke="#7f0000" stroke-width="3"/>
  <line x1="786" y1="182" x2="850" y2="182" stroke="#7f0000" stroke-width="2"/>
  <path d="M 850 158 L 886 128 L 886 114" fill="none" stroke="#7f0000" stroke-width="2"/>
  <path d="M 850 206 L 886 236 L 886 252" fill="none" stroke="#7f0000" stroke-width="2"/>
  <!-- 箭头朝内（指向基极） -->
  <path d="M 866 214 L 846 220 L 858 232 z" fill="#7f0000"/>

  <text x="892" y="112" font-size="12" font-weight="bold" fill="#7f0000">C</text>
  <text x="774" y="176" font-size="12" font-weight="bold" fill="#7f0000" text-anchor="end">B</text>
  <text x="892" y="258" font-size="12" font-weight="bold" fill="#7f0000">E</text>

  <text x="936" y="132" font-size="11.5" fill="#37474f">E：接 VCC</text>
  <text x="936" y="160" font-size="11.5" fill="#37474f">B：经 Rb 接 GPIO</text>
  <text x="936" y="188" font-size="11.5" fill="#37474f">C：接负载到 GND</text>
  <text x="936" y="216" font-size="11.5" font-weight="bold" fill="#2e7d32">GPIO 低 → 导通</text>
  <text x="936" y="242" font-size="11.5" fill="#616161">GPIO 高 → 截止</text>

  <text x="640" y="286" font-size="11.5" fill="#7f0000">电流方向：E → C（基极电流从 B 流出）</text>
  <text x="640" y="308" font-size="11.5" fill="#7f0000">导通条件：Vb 比 E 低约 0.7V</text>
  <text x="640" y="328" font-size="11" fill="#616161">用途：高边开关（负载靠地一侧），与 NPN 正好互补</text>

  <!-- 下：三态 -->
  <rect x="60" y="352" width="1080" height="112" rx="6" fill="#fafafa" stroke="#cfd8dc" stroke-width="1"/>
  <text x="80" y="376" font-size="12.5" font-weight="bold" fill="#37474f">三个工作状态：嵌入式只用两端</text>

  <rect x="80" y="388" width="330" height="62" rx="5" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="98" y="410" font-size="11.5" font-weight="bold" fill="#37474f">截止（开关的"关"）</text>
  <text x="98" y="430" font-size="11" fill="#616161">IB = 0，C-E 近似断开，无电流</text>
  <text x="98" y="446" font-size="11" fill="#616161">GPIO 低电平时的状态（NPN）</text>

  <rect x="435" y="388" width="330" height="62" rx="5" fill="#ffffff" stroke="#f9a825" stroke-width="1.5"/>
  <text x="453" y="410" font-size="11.5" font-weight="bold" fill="#5d4700">放大（模拟电路用）</text>
  <text x="453" y="430" font-size="11" fill="#616161">IC = β × IB，β 常为几十到几百</text>
  <text x="453" y="446" font-size="11" fill="#616161">本库只用原理，不做偏置设计</text>

  <rect x="790" y="388" width="330" height="62" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="808" y="410" font-size="11.5" font-weight="bold" fill="#123314">饱和（开关的"开"）</text>
  <text x="808" y="430" font-size="11" fill="#1b3d1e">IB 足够大，C-E 近似短路</text>
  <text x="808" y="446" font-size="11" fill="#1b3d1e">压降约 0.2V，负载拿到全部电压</text>

  <!-- 图例 -->
  <rect x="60" y="500" width="22" height="12" rx="3" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="90" y="510" font-size="11" fill="#37474f">NPN（高电平通）</text>
  <rect x="250" y="500" width="22" height="12" rx="3" fill="#ffffff" stroke="#c62828" stroke-width="1.5"/>
  <text x="280" y="510" font-size="11" fill="#37474f">PNP（低电平通）</text>
  <rect x="440" y="500" width="22" height="12" rx="3" fill="#fafafa" stroke="#cfd8dc" stroke-width="1"/>
  <text x="470" y="510" font-size="11" fill="#37474f">状态说明区</text>
</svg>
