<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>电容与电感：一对镜像</title>
  <defs>
    <marker id="arwAx" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#616161"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="500" fill="#ffffff"/>

  <text x="60" y="46" font-size="20" font-weight="bold" fill="#0d2f5c">电容与电感：一对镜像</text>
  <text x="60" y="70" font-size="11" fill="#616161">来源：002 §2.4~2.5 · 一句话：电容通交流隔直流，电感通直流隔交流——两条曲线正好交叉</text>

  <!-- 电容卡 -->
  <rect x="60" y="92" width="520" height="126" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="2"/>
  <text x="80" y="118" font-size="14" font-weight="bold" fill="#5d4700">电容器 C：通交流、隔直流</text>
  <text x="80" y="140" font-size="11.5" fill="#5d4700">两片极板夹绝缘层，中间不导通——直流过不去，所以隔直。</text>
  <text x="80" y="160" font-size="11.5" fill="#5d4700">交变电压让极板反复充放电，回路里就有电流——所以通交。</text>
  <text x="80" y="182" font-size="12" font-weight="bold" fill="#5d4700">容抗 Xc = 1 / (2πfC)</text>
  <text x="80" y="202" font-size="11" fill="#5d4700">容量越小、频率越低，阻碍越大 → 高频容易通过，低频被挡</text>

  <!-- 电感卡 -->
  <rect x="620" y="92" width="520" height="126" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="2"/>
  <text x="640" y="118" font-size="14" font-weight="bold" fill="#5e35b1">电感器 L：通直流、隔交流</text>
  <text x="640" y="140" font-size="11.5" fill="#5e35b1">线圈通电生磁、断电释磁，储能完毕后对直流几乎不阻碍。</text>
  <text x="640" y="160" font-size="11.5" fill="#5e35b1">交流让磁场反复建立与崩塌，感应电动势反过来抵制——所以隔交。</text>
  <text x="640" y="182" font-size="12" font-weight="bold" fill="#5e35b1">感抗 XL = 2πfL</text>
  <text x="640" y="202" font-size="11" fill="#5e35b1">感量越大、频率越高，阻碍越大 → 直流能过，高频被挡</text>

  <!-- 曲线面板 -->
  <rect x="60" y="238" width="720" height="216" rx="6" fill="#fafafa" stroke="#cfd8dc" stroke-width="1"/>
  <text x="80" y="262" font-size="12.5" font-weight="bold" fill="#37474f">同一条横轴上看两条曲线：一个往下走，一个往上走</text>

  <!-- 坐标轴 -->
  <line x1="130" y1="420" x2="606" y2="420" stroke="#616161" stroke-width="1.2" marker-end="url(#arwAx)"/>
  <line x1="130" y1="420" x2="130" y2="292" stroke="#616161" stroke-width="1.2" marker-end="url(#arwAx)"/>
  <text x="560" y="440" font-size="11" fill="#616161">频率 f →</text>
  <text x="130" y="286" font-size="11" fill="#616161" text-anchor="middle">阻抗 Z ↑</text>
  <text x="126" y="438" font-size="11" fill="#616161">0</text>

  <!-- 容抗曲线：高频降到低 -->
  <path d="M 140 288 C 220 302 300 366 380 396 C 460 414 540 420 598 421" fill="none" stroke="#e65100" stroke-width="2.5"/>
  <!-- 感抗曲线：高频升到高 -->
  <path d="M 140 421 C 200 420 280 414 340 396 C 420 366 500 302 598 288" fill="none" stroke="#5e35b1" stroke-width="2.5"/>

  <text x="392" y="440" font-size="11" font-weight="bold" fill="#e65100">容抗：频率越高，阻碍越小</text>
  <text x="404" y="300" font-size="11" font-weight="bold" fill="#5e35b1">感抗：频率越高，阻碍越大</text>

  <!-- 交叉点 -->
  <circle cx="360" cy="396" r="4" fill="#ffffff" stroke="#37474f" stroke-width="1.5"/>
  <text x="386" y="362" font-size="11" fill="#37474f">两曲线相交处 Xc = XL</text>

  <!-- 右侧要点 -->
  <text x="800" y="266" font-size="12.5" font-weight="bold" fill="#37474f">嵌入式里的三处用法</text>

  <text x="800" y="296" font-size="11.5" font-weight="bold" fill="#5d4700">① 去耦与旁路用小的</text>
  <text x="800" y="316" font-size="11" fill="#616161">0.1μF 容抗小，高频噪声被它</text>
  <text x="800" y="333" font-size="11" fill="#616161">短路入地（004 §4.1）</text>

  <text x="800" y="361" font-size="11.5" font-weight="bold" fill="#5d4700">② 滤波用大的</text>
  <text x="800" y="381" font-size="11" fill="#616161">几十~几百 μF 存得住电，</text>
  <text x="800" y="398" font-size="11" fill="#616161">把整流后的波浪抹平</text>

  <text x="800" y="426" font-size="11.5" font-weight="bold" fill="#5e35b1">③ 电感在电源线上</text>
  <text x="800" y="446" font-size="11" fill="#616161">直流通、高频挡——与电容相反</text>

  <!-- 图例 -->
  <rect x="60" y="470" width="22" height="12" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="90" y="480" font-size="11" fill="#37474f">电容器</text>
  <rect x="180" y="470" width="22" height="12" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1"/>
  <text x="210" y="480" font-size="11" fill="#37474f">电感器</text>
</svg>
