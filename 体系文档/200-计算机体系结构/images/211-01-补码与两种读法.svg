  <rect x="160" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <rect x="185" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <rect x="210" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <rect x="235" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="72" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="97" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="122" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="147" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="172" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="197" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="222" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="247" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="160" y="172" font-size="11" fill="#2e5230" text-anchor="middle">0xFF</text>

  <!-- 第 2 组 -->
  <rect x="272" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <rect x="297" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
