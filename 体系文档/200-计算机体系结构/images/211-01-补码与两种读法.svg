  <rect x="347" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <rect x="372" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <rect x="397" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <rect x="422" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <rect x="447" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="284" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="309" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="334" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="359" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="384" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="409" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="434" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="459" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="372" y="172" font-size="11" fill="#2e5230" text-anchor="middle">0xFF</text>

  <!-- 第 3 组 -->
  <rect x="484" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <rect x="509" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <rect x="534" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <rect x="559" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <rect x="584" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <rect x="609" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <rect x="634" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <rect x="659" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="496" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="521" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="546" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="571" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
