  <text x="621" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="646" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="671" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="584" y="172" font-size="11" fill="#2e5230" text-anchor="middle">0xFF</text>

  <!-- 第 4 组 -->
  <rect x="696" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <rect x="721" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <rect x="746" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <rect x="771" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <rect x="796" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <rect x="821" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <rect x="846" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <rect x="871" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="708" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="733" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="758" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="783" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="808" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="833" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="858" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="883" y="142" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <text x="796" y="172" font-size="11" fill="#2e5230" text-anchor="middle">0xFF</text>

  <text x="920" y="142" font-size="12" fill="#37474f">32 位、4 字节</text>
  <text x="920" y="162" font-size="11" fill="#616161">写 0x 时 1 位 hex = 4 位 bin</text>

  <!-- 两种读法 -->
  <rect x="60" y="200" width="520" height="86" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="80" y="224" font-size="12.5" font-weight="bold" fill="#0d2f5c">按 %u 读（无符号）：这 32 位就是数值本身</text>
  <text x="80" y="256" font-size="17" font-weight="bold" fill="#0d2f5c" font-family="ui-monospace,Menlo,Consolas,monospace">4294967295</text>
  <text x="80" y="276" font-size="11" fill="#0d2f5c">2³² − 1 —— 硬件原样吐出，不做任何符号解释</text>

  <rect x="620" y="200" width="520" height="86" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="640" y="224" font-size="12.5" font-weight="bold" fill="#7f3f00">按 %d 读（有符号）：最高位当符号位，走补码</text>
  <text x="640" y="256" font-size="17" font-weight="bold" fill="#7f3f00" font-family="ui-monospace,Menlo,Consolas,monospace">-1</text>
  <text x="640" y="276" font-size="11" fill="#7f3f00">全 1 = −1；补码让加法电路不必为负数另做一套</text>

  <text x="60" y="306" font-size="11.5" fill="#37474f">同一块内存、同一串位 —— 差别只在「用什么类型去解释」，这就是 类型 = 宽度 + 解释（C 语言 121 §121.1）</text>

  <!-- ============ 下：0x1F 与左移 ============ -->
  <text x="60" y="344" font-size="13" font-weight="bold" fill="#37474f">换成小数字看对译：0x1F = 0001 1111 = 31</text>

  <rect x="60" y="358" width="34" height="34" rx="3" fill="#ffffff" stroke="#90a4ae" stroke-width="1"/>
  <text x="77" y="380" font-size="12" fill="#37474f" text-anchor="middle">0</text>
  <rect x="96" y="358" width="34" height="34" rx="3" fill="#ffffff" stroke="#90a4ae" stroke-width="1"/>
  <text x="113" y="380" font-size="12" fill="#37474f" text-anchor="middle">0</text>
  <rect x="132" y="358" width="34" height="34" rx="3" fill="#ffffff" stroke="#90a4ae" stroke-width="1"/>
  <text x="149" y="380" font-size="12" fill="#37474f" text-anchor="middle">0</text>
  <rect x="168" y="358" width="34" height="34" rx="3" fill="#ffffff" stroke="#90a4ae" stroke-width="1"/>
  <text x="185" y="380" font-size="12" fill="#37474f" text-anchor="middle">1</text>
  <rect x="204" y="358" width="34" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="221" y="380" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <rect x="240" y="358" width="34" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="257" y="380" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <rect x="276" y="358" width="34" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="293" y="380" font-size="12" fill="#123314" text-anchor="middle">1</text>
  <rect x="312" y="358" width="34" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="329" y="380" font-size="12" fill="#123314" text-anchor="middle">1</text>

  <text x="60" y="416" font-size="11.5" fill="#37474f">16 + 8 + 4 + 2 + 1 = 31；绿色四位就是 0x1F 里那个 F（F = 15 = 1111）</text>

  <!-- 左移链 -->
  <text x="620" y="344" font-size="13" font-weight="bold" fill="#37474f">左移一位 = 乘 2（硬件捷径）</text>
  <rect x="620" y="358" width="96" height="52" rx="4" fill="#ffffff" stroke="#90a4ae" stroke-width="1"/>
  <text x="668" y="378" font-size="11" fill="#37474f" text-anchor="middle">1 &lt;&lt; 0</text>
  <text x="668" y="398" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">1</text>
  <rect x="726" y="358" width="96" height="52" rx="4" fill="#ffffff" stroke="#90a4ae" stroke-width="1"/>
  <text x="774" y="378" font-size="11" fill="#37474f" text-anchor="middle">1 &lt;&lt; 1</text>
  <text x="774" y="398" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">2</text>
  <rect x="832" y="358" width="96" height="52" rx="4" fill="#ffffff" stroke="#90a4ae" stroke-width="1"/>
  <text x="880" y="378" font-size="11" fill="#37474f" text-anchor="middle">1 &lt;&lt; 2</text>
  <text x="880" y="398" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">4</text>
  <rect x="938" y="358" width="96" height="52" rx="4" fill="#ffffff" stroke="#90a4ae" stroke-width="1"/>
  <text x="986" y="378" font-size="11" fill="#37474f" text-anchor="middle">1 &lt;&lt; 3</text>
  <text x="986" y="398" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">8</text>
  <rect x="1044" y="358" width="96" height="52" rx="4" fill="#ffffff" stroke="#90a4ae" stroke-width="1"/>
  <text x="1092" y="378" font-size="11" fill="#37474f" text-anchor="middle">1 &lt;&lt; 4</text>
  <text x="1092" y="398" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">16</text>

  <line x1="716" y1="384" x2="726" y2="384" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="822" y1="384" x2="832" y2="384" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="928" y1="384" x2="938" y2="384" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1034" y1="384" x2="1044" y2="384" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="620" y="428" font-size="11" fill="#616161">移位是乘除 2 的硬件捷径 —— 位运算比乘法便宜，指令层就是一条移位指令</text>

  <!-- 结论 -->
  <rect x="60" y="448" width="1080" height="44" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="80" y="476" font-size="13" fill="#7f3f00">记住一条：C 里没有「负数的二进制」这回事 —— 只有一串位，和读它时选的类型</text>

  <!-- 图例 -->
  <rect x="60" y="504" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="90" y="516" font-size="11" fill="#37474f">位格（1 = 该位为高）</text>
  <rect x="290" y="504" width="22" height="14" rx="3" fill="#ffffff" stroke="#90a4ae" stroke-width="1"/>
  <text x="320" y="516" font-size="11" fill="#37474f">位格（0）</text>
  <rect x="450" y="504" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="480" y="516" font-size="11" fill="#37474f">无符号读法</text>
  <rect x="610" y="504" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="640" y="516" font-size="11" fill="#37474f">有符号读法（补码）</text>
</svg>
