<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>补码：同一串二进制，两种读法</title>
  <rect x="0" y="0" width="1200" height="520" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#90a4ae"/>
    </marker>
  </defs>

  <text x="60" y="46" font-size="20" font-weight="bold" fill="#0d2f5c">补码：同一串二进制，读法不同结果就不同</text>
  <text x="60" y="70" font-size="11" fill="#616161">来源：200 板块 211 §211.3 binary.c 本机实录（C17 / gcc）· 32 位 int · 2026-11-23</text>

  <!-- ============ 上：0xFFFFFFFF 的 32 位 ============ -->
  <text x="60" y="106" font-size="13" font-weight="bold" fill="#37474f">unsigned u = 0xFFFFFFFF —— 32 位全是 1（4 个字节，每个 0xFF）</text>

  <!-- 第 1 组 -->
  <rect x="60" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <rect x="85" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <rect x="110" y="120" width="24" height="34" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
