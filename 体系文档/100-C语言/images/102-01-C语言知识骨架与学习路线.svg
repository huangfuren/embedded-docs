  <text x="700" y="610" font-size="15" fill="#37474f" text-anchor="middle">程序怎么接外部输入</text>
  <text x="700" y="632" font-size="11.5" fill="#616161" text-anchor="middle">argc/argv · sprintf/sscanf · 变参</text>

  <rect x="864" y="552" width="296" height="100" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="1012" y="584" font-size="15" font-weight="bold" fill="#1b5e20" text-anchor="middle">153 时间 · 随机 · 数学</text>
  <text x="1012" y="610" font-size="15" fill="#37474f" text-anchor="middle">三个最易用错的标准库</text>
  <text x="1012" y="632" font-size="11.5" fill="#616161" text-anchor="middle">时钟精度 · 种子 · 浮点比较</text>

  <!-- ===== 160 数据结构与算法 ===== -->
  <rect x="40" y="668" width="180" height="100" rx="8" fill="#d1c4e9" stroke="#5e35b1" stroke-width="2"/>
  <text x="130" y="712" font-size="17" font-weight="bold" fill="#311b92" text-anchor="middle">160 数据结构</text>
  <text x="130" y="738" font-size="11.5" fill="#37474f" text-anchor="middle">不是语言，是工具箱</text>

  <rect x="240" y="668" width="171" height="100" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="325" y="700" font-size="13" font-weight="bold" fill="#311b92" text-anchor="middle">161 复杂度</text>
  <text x="325" y="726" font-size="13" fill="#37474f" text-anchor="middle">成本的尺子</text>
  <text x="325" y="748" font-size="11" fill="#616161" text-anchor="middle">大 O · 七种阶</text>

  <rect x="427" y="668" width="171" height="100" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="512" y="700" font-size="13" font-weight="bold" fill="#311b92" text-anchor="middle">162 数组与链表</text>
  <text x="512" y="726" font-size="13" fill="#37474f" text-anchor="middle">顺序 vs 链式</text>
  <text x="512" y="748" font-size="11" fill="#616161" text-anchor="middle">扩容 · 头插 · 选型</text>

  <rect x="614" y="668" width="171" height="100" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="699" y="700" font-size="13" font-weight="bold" fill="#311b92" text-anchor="middle">163 栈与队列</text>
  <text x="699" y="726" font-size="13" fill="#37474f" text-anchor="middle">受限访问</text>
  <text x="699" y="748" font-size="11" fill="#616161" text-anchor="middle">LIFO · 假溢出</text>

  <rect x="801" y="668" width="171" height="100" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="886" y="700" font-size="13" font-weight="bold" fill="#311b92" text-anchor="middle">164 查找与排序</text>
