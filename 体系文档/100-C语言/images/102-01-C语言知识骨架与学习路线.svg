  <text x="886" y="748" font-size="11" fill="#616161" text-anchor="middle">二分 · 冒泡 · 快排</text>

  <rect x="988" y="668" width="171" height="100" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="1073" y="700" font-size="13" font-weight="bold" fill="#311b92" text-anchor="middle">165 散列与树</text>
  <text x="1073" y="726" font-size="13" fill="#37474f" text-anchor="middle">查找加速结构</text>
  <text x="1073" y="748" font-size="11" fill="#616161" text-anchor="middle">桶链 · 红黑树</text>

  <!-- ===== 结论块 ===== -->
  <rect x="40" y="784" width="1120" height="52" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="806" font-size="12.5" fill="#5d4037">读法：自上而下是一条依赖链——131 的数组遍历要用 122 的循环，133 的指针要用 131 的 sizeof，141 的四区把指针落地，142 的 malloc 建立在 141 之上。</text>
  <text x="60" y="828" font-size="12.5" font-weight="bold" fill="#bf360c">跳过任何一站，后面都会退化成背结论。</text>

  <!-- ===== 图例 ===== -->
  <rect x="40" y="850" width="12" height="12" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="60" y="860" font-size="12" fill="#616161">入口（工具链）</text>
  <rect x="200" y="850" width="12" height="12" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="220" y="860" font-size="12" fill="#616161">语言本体（核心 / 数据 / 内存 / 标准库）</text>
  <rect x="560" y="850" width="12" height="12" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1"/>
  <text x="580" y="860" font-size="12" fill="#616161">工具箱（数据结构与算法，不是语言本身）</text>
