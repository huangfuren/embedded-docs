  <text x="388" y="400" font-size="11.5" fill="#616161" text-anchor="middle">sizeof 长度 · \0 · string.h 四函数</text>

  <rect x="552" y="320" width="296" height="100" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="700" y="352" font-size="15" font-weight="bold" fill="#1b5e20" text-anchor="middle">132 结构体 · 联合 · 位域</text>
  <text x="700" y="378" font-size="15" fill="#37474f" text-anchor="middle">把字段捆成一个整体</text>
  <text x="700" y="400" font-size="11.5" fill="#616161" text-anchor="middle">padding 入门 · 小端序 · 位域打包</text>

  <rect x="864" y="320" width="296" height="100" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
