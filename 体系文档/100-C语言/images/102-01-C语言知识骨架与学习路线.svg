  <text x="817" y="284" font-size="11" fill="#616161" text-anchor="middle">多文件 · 递归</text>

  <rect x="942" y="204" width="218" height="100" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
