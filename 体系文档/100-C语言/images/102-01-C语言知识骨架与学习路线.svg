  <text x="388" y="632" font-size="11.5" fill="#616161" text-anchor="middle">流 · scanf 缓冲 · fopen/mode · fclose</text>

  <rect x="552" y="552" width="296" height="100" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
