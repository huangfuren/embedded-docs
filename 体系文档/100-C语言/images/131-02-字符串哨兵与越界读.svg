<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="1200" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="20" font-weight="bold" fill="#0d47a1">131 · 字符串 = 以 \0 结尾的字符数组</text>
  <text x="1160" y="46" font-size="12" fill="#616161" text-anchor="end">来源：131 §131.3 str_demo 本机实录 · C17 · 2026-11-23</text>

  <text x="40" y="96" font-size="17" font-weight="bold" fill="#1b5e20">有哨兵：char e[] = &quot;lily&quot; —— 编译器自动补 \0</text>

  <rect x="80" y="120" width="100" height="60" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="190" y="120" width="100" height="60" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="300" y="120" width="100" height="60" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="410" y="120" width="100" height="60" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="520" y="120" width="100" height="60" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <text x="130" y="158" font-size="20" font-weight="bold" fill="#123314" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">l</text>
  <text x="240" y="158" font-size="20" font-weight="bold" fill="#123314" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">i</text>
  <text x="350" y="158" font-size="20" font-weight="bold" fill="#123314" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">l</text>
  <text x="460" y="158" font-size="20" font-weight="bold" fill="#123314" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">y</text>
  <text x="570" y="158" font-size="17" font-weight="bold" fill="#7f3f00" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">\0</text>
  <text x="570" y="200" font-size="11.5" fill="#7f3f00" text-anchor="middle">哨兵</text>

  <rect x="660" y="120" width="500" height="96" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="682" y="146" font-size="13" font-weight="bold" fill="#123314">%s 从头逐字符读，撞上哨兵就收工</text>
  <text x="682" y="172" font-size="12.5" fill="#1b3d1e">sizeof e = 5（含哨兵）　strlen(e) = 4（数到哨兵为止）</text>
  <text x="682" y="198" font-size="12.5" fill="#1b3d1e">终端输出：lily</text>

  <text x="40" y="262" font-size="17" font-weight="bold" fill="#7f0000">没有哨兵：char c[] = {'j','a','c','k'}，紧跟 char b[] = &quot;tom&quot;</text>

  <rect x="80" y="286" width="100" height="60" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="190" y="286" width="100" height="60" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="300" y="286" width="100" height="60" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="410" y="286" width="100" height="60" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="530" y="286" width="100" height="60" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <rect x="640" y="286" width="100" height="60" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <rect x="750" y="286" width="100" height="60" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <rect x="860" y="286" width="100" height="60" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <text x="130" y="324" font-size="20" font-weight="bold" fill="#123314" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">j</text>
  <text x="240" y="324" font-size="20" font-weight="bold" fill="#123314" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">a</text>
  <text x="350" y="324" font-size="20" font-weight="bold" fill="#123314" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">c</text>
  <text x="460" y="324" font-size="20" font-weight="bold" fill="#123314" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">k</text>
  <text x="580" y="324" font-size="20" font-weight="bold" fill="#0d2f5c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">t</text>
  <text x="690" y="324" font-size="20" font-weight="bold" fill="#0d2f5c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">o</text>
  <text x="800" y="324" font-size="20" font-weight="bold" fill="#0d2f5c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">m</text>
  <text x="910" y="324" font-size="17" font-weight="bold" fill="#7f3f00" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">\0</text>

  <line x1="520" y1="278" x2="520" y2="352" stroke="#c62828" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="330" y="370" font-size="11.5" fill="#c62828" text-anchor="middle">c 的地盘（4 格，无哨兵）</text>
  <text x="795" y="370" font-size="11.5" fill="#1565c0" text-anchor="middle">b 的地盘（有哨兵）</text>

  <rect x="40" y="386" width="1120" height="76" rx="8" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="62" y="412" font-size="13" font-weight="bold" fill="#7f0000">%s 停不下来：c 的第 5 格不在 c 里，而是邻居 b 的第 1 格</text>
  <text x="62" y="438" font-size="12.5" fill="#7f0000">一路读进 b 的地盘，撞见 b 的 \0 才收工　→　终端输出 jacktom（c 的 4 字 + b 的 3 字）</text>
  <text x="62" y="458" font-size="12" fill="#7f0000">换一台机器、换一次编译，邻居可能是别的残留值——输出就是另一串乱码</text>

  <rect x="40" y="476" width="1120" height="52" rx="8" fill="#fff8e1" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="62" y="508" font-size="13" font-weight="bold" fill="#5d4037">结论：手写字符数组必补 '\0'；最推荐字面量写法 char s[] = &quot;lily&quot;，哨兵自动带上</text>

  <rect x="40" y="552" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="72" y="564" font-size="12" fill="#37474f">本数组字符</text>
  <rect x="170" y="552" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="202" y="564" font-size="12" fill="#37474f">邻居数组（不该被读到）</text>
  <rect x="372" y="552" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <text x="404" y="564" font-size="12" fill="#37474f">\0 哨兵（%s 的停止符）</text>
  <rect x="572" y="552" width="22" height="14" rx="3" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="604" y="564" font-size="12" fill="#37474f">哨兵齐全时的正常输出</text>
  <rect x="766" y="552" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="798" y="564" font-size="12" fill="#37474f">缺哨兵的后果</text>
</svg>
