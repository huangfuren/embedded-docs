<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="1200" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="20" font-weight="bold" fill="#0d47a1">133 · 指针 +1 走多远：由指向的类型决定</text>
  <text x="1160" y="46" font-size="12" fill="#616161" text-anchor="end">来源：133 §133.2 步长实测 · C17 · 2026-11-23</text>

  <text x="40" y="86" font-size="12" fill="#37474f">同一句 p + 1，四种指针落点不同——指针算术的单位是「元素」，不是「字节」</text>

  <text x="140" y="118" font-size="11.5" fill="#616161" text-anchor="middle">0</text>
  <text x="230" y="118" font-size="11.5" fill="#616161" text-anchor="middle">1</text>
  <text x="320" y="118" font-size="11.5" fill="#616161" text-anchor="middle">2</text>
  <text x="410" y="118" font-size="11.5" fill="#616161" text-anchor="middle">3</text>
  <text x="500" y="118" font-size="11.5" fill="#616161" text-anchor="middle">4</text>
  <text x="590" y="118" font-size="11.5" fill="#616161" text-anchor="middle">5</text>
  <text x="680" y="118" font-size="11.5" fill="#616161" text-anchor="middle">6</text>
  <text x="770" y="118" font-size="11.5" fill="#616161" text-anchor="middle">7</text>
  <text x="860" y="118" font-size="11.5" fill="#616161" text-anchor="middle">8</text>
  <text x="950" y="118" font-size="11.5" fill="#616161" text-anchor="middle">9</text>
  <text x="985" y="118" font-size="11.5" fill="#616161">字节</text>
  <line x1="140" y1="128" x2="950" y2="128" stroke="#cfd8dc" stroke-width="1"/>
  <line x1="140" y1="122" x2="140" y2="134" stroke="#90a4ae" stroke-width="1"/>
  <line x1="230" y1="122" x2="230" y2="134" stroke="#90a4ae" stroke-width="1"/>
  <line x1="320" y1="122" x2="320" y2="134" stroke="#90a4ae" stroke-width="1"/>
  <line x1="410" y1="122" x2="410" y2="134" stroke="#90a4ae" stroke-width="1"/>
  <line x1="500" y1="122" x2="500" y2="134" stroke="#90a4ae" stroke-width="1"/>
  <line x1="590" y1="122" x2="590" y2="134" stroke="#90a4ae" stroke-width="1"/>
  <line x1="680" y1="122" x2="680" y2="134" stroke="#90a4ae" stroke-width="1"/>
  <line x1="770" y1="122" x2="770" y2="134" stroke="#90a4ae" stroke-width="1"/>
  <line x1="860" y1="122" x2="860" y2="134" stroke="#90a4ae" stroke-width="1"/>
  <line x1="950" y1="122" x2="950" y2="134" stroke="#90a4ae" stroke-width="1"/>

  <text x="40" y="176" font-size="13" font-weight="bold" fill="#0d2f5c" font-family="ui-monospace,Menlo,Consolas,monospace">char *p</text>
  <line x1="140" y1="170" x2="230" y2="170" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="985" y="176" font-size="15" font-weight="bold" fill="#0d2f5c" text-anchor="end">1 字节</text>

  <text x="40" y="236" font-size="13" font-weight="bold" fill="#0d2f5c" font-family="ui-monospace,Menlo,Consolas,monospace">short *p</text>
  <line x1="140" y1="230" x2="320" y2="230" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="985" y="236" font-size="15" font-weight="bold" fill="#0d2f5c" text-anchor="end">2 字节</text>

  <text x="40" y="296" font-size="13" font-weight="bold" fill="#0d2f5c" font-family="ui-monospace,Menlo,Consolas,monospace">int *p</text>
  <line x1="140" y1="290" x2="500" y2="290" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="985" y="296" font-size="15" font-weight="bold" fill="#0d2f5c" text-anchor="end">4 字节</text>

  <text x="40" y="356" font-size="13" font-weight="bold" fill="#0d2f5c" font-family="ui-monospace,Menlo,Consolas,monospace">double *p</text>
  <line x1="140" y1="350" x2="860" y2="350" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="985" y="356" font-size="15" font-weight="bold" fill="#0d2f5c" text-anchor="end">8 字节</text>

  <rect x="40" y="382" width="1120" height="56" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="62" y="406" font-size="13" font-weight="bold" fill="#5d4037">编译器把 p + 1 翻译成「地址 + sizeof(*p)」——指针自己不知道长度，靠类型算</text>
  <text x="62" y="428" font-size="12" fill="#5d4037">所以 int* 加 1 跳 4 字节；这也是数组下标能退化成地址运算的原因（133 §133.3）</text>

  <line x1="40" y1="452" x2="82" y2="452" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="94" y="456" font-size="12" fill="#37474f">p + 1 后的落点（长度 = sizeof(*p)）</text>
</svg>
