<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="1200" height="550" fill="#ffffff"/>
  <defs>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="20" font-weight="bold" fill="#1b5e20">162 · 动态数组：length 是已用格数，capacity 是已买下的格数</text>
  <text x="1160" y="46" font-size="12" fill="#616161" text-anchor="end">来源：162 §162.1 ds_array 本机实测 · C17 · 2026-11-23</text>

  <text x="40" y="86" font-size="12" fill="#37474f">两个数分开记：写满 length == capacity 时才扩容，扩容一次翻倍并且要搬全部已有元素</text>

  <text x="40" y="118" font-size="17" font-weight="bold" fill="#1b5e20">扩容前：length = 3，capacity = 5</text>

  <rect x="100" y="140" width="100" height="64" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="210" y="140" width="100" height="64" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="320" y="140" width="100" height="64" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="430" y="140" width="100" height="64" rx="6" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="540" y="140" width="100" height="64" rx="6" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="150" y="180" font-size="17" font-weight="bold" fill="#123314" text-anchor="middle">10</text>
  <text x="260" y="180" font-size="17" font-weight="bold" fill="#123314" text-anchor="middle">20</text>
  <text x="370" y="180" font-size="17" font-weight="bold" fill="#123314" text-anchor="middle">30</text>
  <text x="480" y="180" font-size="11.5" fill="#616161" text-anchor="middle">空</text>
  <text x="590" y="180" font-size="11.5" fill="#616161" text-anchor="middle">空</text>

  <line x1="430" y1="216" x2="430" y2="228" stroke="#388e3c" stroke-width="2"/>
  <text x="430" y="242" font-size="11.5" fill="#388e3c" text-anchor="middle">length = 3（下一个该写这里）</text>

  <line x1="640" y1="134" x2="640" y2="210" stroke="#c62828" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="648" y="234" font-size="11.5" fill="#c62828">capacity = 5（已买下的边界）</text>

  <rect x="820" y="134" width="340" height="96" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="840" y="160" font-size="13" font-weight="bold" fill="#263238">为什么要两个数</text>
  <text x="840" y="184" font-size="11.5" fill="#37474f">只有 length，每次插入都得扩容</text>
  <text x="840" y="206" font-size="11.5" fill="#37474f">只有 capacity，不知道写到哪停</text>

  <rect x="40" y="258" width="1120" height="44" rx="8" fill="#fff8e1" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="62" y="286" font-size="13" font-weight="bold" fill="#5d4037">先插到 5 个（此时 length == capacity）→ 再插第 6 个才触发 realloc：5 格变 10 格，旧元素原样复制</text>

  <text x="40" y="330" font-size="17" font-weight="bold" fill="#0d47a1">扩容后：length = 6，capacity = 10（格子变多、每格变窄，总宽不变）</text>

  <rect x="100" y="352" width="48" height="64" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="155" y="352" width="48" height="64" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="210" y="352" width="48" height="64" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="265" y="352" width="48" height="64" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="320" y="352" width="48" height="64" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="375" y="352" width="48" height="64" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="430" y="352" width="48" height="64" rx="6" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="485" y="352" width="48" height="64" rx="6" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="540" y="352" width="48" height="64" rx="6" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="595" y="352" width="48" height="64" rx="6" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="124" y="390" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">10</text>
  <text x="179" y="390" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">20</text>
  <text x="234" y="390" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">30</text>
  <text x="289" y="390" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">40</text>
  <text x="344" y="390" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">50</text>
  <text x="399" y="390" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">60</text>

  <line x1="430" y1="424" x2="430" y2="436" stroke="#388e3c" stroke-width="2"/>
  <text x="430" y="450" font-size="11.5" fill="#388e3c" text-anchor="middle">length = 6</text>
  <line x1="643" y1="346" x2="643" y2="420" stroke="#c62828" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="651" y="450" font-size="11.5" fill="#c62828">capacity = 10</text>

  <rect x="820" y="346" width="340" height="96" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="840" y="372" font-size="13" font-weight="bold" fill="#263238">翻倍而不是 +1</text>
  <text x="840" y="396" font-size="11.5" fill="#37474f">每次搬 n 个元素，均摊到每次插入</text>
  <text x="840" y="418" font-size="11.5" fill="#37474f">是 O(1)，所以扩容取倍数不取加数</text>

  <rect x="40" y="466" width="1120" height="52" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="62" y="498" font-size="13" font-weight="bold" fill="#5d4037">扩容会搬内存：旧指针全部失效——扩容后只能继续用 realloc 返回的新地址</text>

  <rect x="40" y="530" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="72" y="542" font-size="12" fill="#37474f">已用（length 以内）</text>
  <rect x="240" y="530" width="22" height="14" rx="3" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="272" y="542" font-size="12" fill="#37474f">有容量没数据</text>
  <line x1="440" y1="537" x2="482" y2="537" stroke="#c62828" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="494" y="542" font-size="12" fill="#37474f">capacity 边界</text>
</svg>
