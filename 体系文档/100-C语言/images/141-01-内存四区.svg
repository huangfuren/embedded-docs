<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="1200" height="580" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="20" font-weight="bold" fill="#263238">141 · 内存四区：变量住哪、谁负责释放</text>
  <text x="1160" y="46" font-size="12" fill="#616161" text-anchor="end">来源：141 §141.1 memzones.c 本机实测 · C17 · 2026-11-23</text>

  <text x="40" y="86" font-size="12" fill="#37474f">分界线是「谁管释放」：编译器自动回收的那一半，和必须自己 free 的那一半</text>

  <rect x="40" y="104" width="660" height="272" rx="12" fill="#f1f8e9" fill-opacity="0.55" stroke="#2e7d32" stroke-width="2"/>
  <text x="60" y="134" font-size="17" font-weight="bold" fill="#1b5e20">自动区 · 编译器管，出作用域就回收</text>

  <rect x="60" y="148" width="620" height="64" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="78" y="174" font-size="15" font-weight="bold" fill="#123314">代码段</text>
  <text x="78" y="198" font-size="11.5" fill="#1b3d1e">机器码 + 字符串字面量 &quot;hi&quot;（只读，改它就是崩溃）</text>

  <rect x="60" y="222" width="620" height="64" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="78" y="248" font-size="15" font-weight="bold" fill="#123314">数据段（全局静态区）</text>
  <text x="78" y="272" font-size="11.5" fill="#1b3d1e">全局 g · static s / sl —— 有默认零值，随程序生死</text>

  <rect x="60" y="296" width="620" height="64" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="78" y="322" font-size="15" font-weight="bold" fill="#123314">栈</text>
  <text x="78" y="346" font-size="11.5" fill="#1b3d1e">局部 l · 函数帧 —— 先进后出，出栈即销毁，无默认值</text>

  <rect x="720" y="104" width="440" height="272" rx="12" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
  <text x="740" y="134" font-size="17" font-weight="bold" fill="#0d47a1">手动区 · 你申请，你负责 free</text>

  <rect x="740" y="148" width="400" height="64" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="758" y="174" font-size="15" font-weight="bold" fill="#0d2f5c">堆</text>
  <text x="758" y="198" font-size="11.5" fill="#0d2f5c">malloc / calloc 开辟 —— 凌乱无序，free 才归还</text>

  <rect x="740" y="230" width="118" height="60" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="799" y="256" font-size="11.5" fill="#7f3f00" text-anchor="middle">malloc 申请</text>
  <text x="799" y="276" font-size="11" fill="#5d4700" text-anchor="middle">拿到地址</text>

  <line x1="862" y1="260" x2="872" y2="260" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="876" y="230" width="118" height="60" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="935" y="256" font-size="11.5" fill="#7f3f00" text-anchor="middle">使用 *h</text>
  <text x="935" y="276" font-size="11" fill="#5d4700" text-anchor="middle">读写内容</text>

  <line x1="998" y1="260" x2="1008" y2="260" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1012" y="230" width="128" height="60" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="1076" y="256" font-size="11.5" fill="#7f3f00" text-anchor="middle">free + 置 NULL</text>
  <text x="1076" y="276" font-size="11" fill="#5d4700" text-anchor="middle">漏了就是泄漏</text>

  <rect x="740" y="306" width="400" height="54" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="758" y="328" font-size="11.5" fill="#37474f">四区里只有堆需要你动手回收</text>
  <text x="758" y="348" font-size="11.5" fill="#37474f">栈和全局都由编译器安排，free 它们是错误</text>

  <rect x="40" y="396" width="1120" height="76" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="62" y="422" font-size="13" font-weight="bold" fill="#263238">memzones.c 实测：只看分区归属，地址每次运行都在变</text>
  <text x="62" y="446" font-size="12" fill="#37474f">数据段 g / s / sl 三个地址相邻（差 4）；栈上局部 l 与数据段相距很远；堆上的 *h 又是另一段</text>
  <text x="62" y="466" font-size="12" fill="#37474f">段内连续、段间跳远——这正是「四区」在地址上留下的形状</text>

  <rect x="40" y="488" width="1120" height="56" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="62" y="512" font-size="13" font-weight="bold" fill="#5d4037">判据只有一句：这块内存是谁申请的？谁申请谁释放</text>
  <text x="62" y="534" font-size="12" fill="#5d4037">malloc 出来的必须 free；局部变量和全局变量交给编译器，不要碰</text>

  <rect x="40" y="556" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="72" y="568" font-size="12" fill="#37474f">编译器自动管理</text>
  <rect x="230" y="556" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="262" y="568" font-size="12" fill="#37474f">程序员手动管理</text>
  <rect x="420" y="556" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="452" y="568" font-size="12" fill="#37474f">堆的使用三步</text>
</svg>
