<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>续流二极管：断电瞬间给线圈电流留一条回路</title>
  <rect x="0" y="0" width="1200" height="660" fill="#ffffff"/>

  <!-- 坐标表：左区 40,96,560,384；右区 640,96,520,384；结论 40,496,1120,76；图例 40,592,1120,44；高 660 -->

  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="20" font-weight="bold" fill="#263238">续流二极管：断电瞬间给线圈电流留一条回路</text>
  <text x="40" y="70" font-size="11" fill="#616161">来源：400 板块 433 §433.3 · 口径：低压直流，线圈两端反向并联一只开关二极管（1N4148 / 1N4007）· 2026-11-23</text>

  <!-- 左区：通电时 -->
  <rect x="40" y="96" width="560" height="384" rx="6" fill="#fafafa" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="126" font-size="13" font-weight="bold" fill="#37474f">通电时：D 反偏截止，电流走驱动管</text>
  <text x="60" y="148" font-size="11" fill="#616161">阴极朝 VCC、阳极朝驱动管，被反着加压，不导通</text>

  <text x="96" y="188" font-size="11" fill="#0d2f5c">VCC 5V</text>
  <circle cx="96" cy="200" r="3.5" fill="#616161"/>
  <line x1="96" y1="200" x2="160" y2="200" stroke="#616161" stroke-width="1.5"/>

  <rect x="160" y="176" width="150" height="48" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="235" y="196" font-size="12.5" font-weight="bold" fill="#5d4700" text-anchor="middle">线圈 L</text>
  <text x="235" y="214" font-size="11" fill="#5d4700" text-anchor="middle">继电器 / 电磁阀</text>

  <line x1="310" y1="200" x2="500" y2="200" stroke="#616161" stroke-width="1.5"/>
  <line x1="500" y1="200" x2="500" y2="300" stroke="#616161" stroke-width="1.5"/>
  <line x1="500" y1="212" x2="500" y2="276" stroke="#2e7d32" stroke-width="2" marker-end="url(#ag)"/>
  <text x="512" y="248" font-size="11" fill="#2e7d32">I</text>

  <rect x="430" y="300" width="140" height="60" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="500" y="326" font-size="12.5" font-weight="bold" fill="#123314" text-anchor="middle">驱动管 Q</text>
  <text x="500" y="346" font-size="11" fill="#123314" text-anchor="middle">三极管 / MOS</text>

  <line x1="500" y1="360" x2="500" y2="402" stroke="#616161" stroke-width="1.5"/>
  <line x1="474" y1="402" x2="526" y2="402" stroke="#616161" stroke-width="1.5"/>
  <line x1="484" y1="409" x2="516" y2="409" stroke="#616161" stroke-width="1.5"/>
  <line x1="494" y1="416" x2="506" y2="416" stroke="#616161" stroke-width="1.5"/>
  <text x="500" y="438" font-size="11" fill="#616161" text-anchor="middle">GND</text>

  <line x1="96" y1="200" x2="96" y2="272" stroke="#616161" stroke-width="1.5"/>
  <line x1="96" y1="272" x2="170" y2="272" stroke="#616161" stroke-width="1.5"/>
  <line x1="266" y1="272" x2="500" y2="272" stroke="#616161" stroke-width="1.5"/>
  <circle cx="500" cy="272" r="3.5" fill="#616161"/>

  <rect x="170" y="240" width="96" height="80" rx="6" fill="#bbdefb" stroke="#0d2f5c" stroke-width="1.5"/>
  <line x1="196" y1="254" x2="196" y2="290" stroke="#0d2f5c" stroke-width="2.5"/>
  <path d="M 240 254 L 240 290 L 196 272 z" fill="#ffffff" stroke="#0d2f5c" stroke-width="1.5"/>
  <text x="218" y="310" font-size="11.5" font-weight="bold" fill="#0d2f5c" text-anchor="middle">D</text>

  <text x="60" y="404" font-size="11.5" fill="#1b3d1e">二极管方向：阴极接 VCC、阳极接驱动管</text>
  <text x="60" y="436" font-size="11.5" fill="#1b3d1e">通电电流：VCC → 线圈 → 驱动管 → GND，D 不参与</text>
  <text x="60" y="464" font-size="11" fill="#5d4037">线圈是感性负载：能量存在磁场里，断电那一刻要还回来</text>

  <!-- 右区：断电瞬间 -->
  <rect x="640" y="96" width="520" height="384" rx="6" fill="#fafafa" stroke="#cfd8dc" stroke-width="1"/>
  <text x="660" y="126" font-size="13" font-weight="bold" fill="#37474f">断电瞬间：D 正偏，把反冲高压短路掉</text>
  <text x="660" y="148" font-size="11" fill="#616161">线圈电流不能突变，只能经 D 泄放；不泄放就顶穿驱动管</text>

  <line x1="706" y1="180" x2="706" y2="420" stroke="#616161" stroke-width="1.2"/>
  <line x1="706" y1="420" x2="1132" y2="420" stroke="#616161" stroke-width="1.2"/>
  <text x="674" y="178" font-size="11" fill="#616161">Vce</text>
  <text x="1128" y="440" font-size="11" fill="#616161" text-anchor="middle">t</text>

  <line x1="706" y1="246" x2="1120" y2="246" stroke="#c62828" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1120" y="238" font-size="11" fill="#c62828" text-anchor="end">驱动管耐压量级（几十 V）</text>

  <path d="M 754 412 L 790 412 L 802 200 L 816 330 L 830 404 L 900 412" fill="none" stroke="#c62828" stroke-width="2"/>
  <circle cx="802" cy="200" r="3" fill="#c62828"/>
  <text x="884" y="196" font-size="11.5" font-weight="bold" fill="#bf360c">不并 D：尖峰顶穿耐压</text>
  <text x="884" y="214" font-size="11" fill="#bf360c">PN 结雪崩，一次就坏</text>

  <line x1="960" y1="392" x2="1100" y2="392" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="6 4"/>
  <path d="M 960 412 L 990 412 L 1000 392 L 1012 398 L 1024 406 L 1090 412" fill="none" stroke="#2e7d32" stroke-width="2"/>
  <text x="1130" y="372" font-size="11" fill="#1b5e20" text-anchor="end">并了 D：被钳在 VCC + 0.7V</text>

  <text x="660" y="450" font-size="11.5" fill="#5d4037">泄放回路：线圈 → D → 回线圈，能量在线圈内阻与 D 上变成热</text>
  <text x="660" y="472" font-size="11.5" fill="#5d4037">耐压与电流都要够：小电流用 1N4148，几十 mA 以上换 1N4007</text>

  <!-- 结论 -->
  <rect x="40" y="496" width="1120" height="76" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="524" font-size="13" font-weight="bold" fill="#bf360c">这只二极管不是可选配件：省掉它的结果是「能工作，但每隔一段时间烧一次驱动管」</text>
  <text x="60" y="550" font-size="11.5" fill="#7f3f00">接反的后果更直接——正偏时把电源短路，一上电就出事。它并联在线圈两端，不是串在回路里。</text>

  <!-- 图例 -->
  <rect x="40" y="592" width="1120" height="44" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="56" y="607" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="88" y="618" font-size="12" fill="#37474f">线圈 / 电感负载</text>
  <rect x="336" y="607" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="368" y="618" font-size="12" fill="#37474f">驱动管（三极管 / MOS）</text>
  <rect x="616" y="607" width="22" height="14" rx="3" fill="#bbdefb" stroke="#0d2f5c" stroke-width="1"/>
  <text x="648" y="618" font-size="12" fill="#37474f">续流二极管</text>
</svg>
