  <text x="878" y="180" font-size="12" font-weight="bold" fill="#37474f" text-anchor="middle">A||B</text>
  <text x="967" y="180" font-size="12" font-weight="bold" fill="#37474f" text-anchor="middle">!A</text>
  <text x="1067" y="180" font-size="12" font-weight="bold" fill="#37474f" text-anchor="middle">A^B</text>
