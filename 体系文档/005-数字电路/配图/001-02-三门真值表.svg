  <text x="80" y="382" font-size="12" font-weight="bold" fill="#0d2f5c">A &amp;&amp; B　与门</text>
  <text x="80" y="406" font-size="11.5" fill="#37474f">全 1 才是 1</text>
  <text x="80" y="426" font-size="11" fill="#616161">两只开关串联：都要按下</text>
  <rect x="330" y="356" width="250" height="84" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
  <text x="350" y="382" font-size="12" font-weight="bold" fill="#0d2f5c">A || B　或门</text>
  <text x="350" y="406" font-size="11.5" fill="#37474f">有 1 就是 1</text>
  <text x="350" y="426" font-size="11" fill="#616161">两只开关并联：按一只就行</text>
  <rect x="600" y="356" width="250" height="84" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
  <text x="620" y="382" font-size="12" font-weight="bold" fill="#0d2f5c">! A　非门</text>
  <text x="620" y="406" font-size="11.5" fill="#37474f">输入取反</text>
  <text x="620" y="426" font-size="11" fill="#616161">硬件里就是一个反相器</text>
  <rect x="870" y="356" width="250" height="84" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
  <text x="890" y="382" font-size="12" font-weight="bold" fill="#0d2f5c">A ^ B　异或</text>
  <text x="890" y="406" font-size="11.5" fill="#37474f">不同才是 1</text>
  <text x="890" y="426" font-size="11" fill="#616161">不进位加法：1+1=0 进 1</text>

