<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>计算机体系结构 · 抽象塔与硬件形态地图</title>
  <rect x="0" y="0" width="1200" height="740" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="60" y="46" font-size="20" font-weight="bold" fill="#0d2f5c">计算机体系结构 · 抽象塔与硬件形态地图</text>
  <text x="60" y="70" font-size="11" fill="#616161">来源：本库建库批 · 口径：概念通用，ARM Cortex-M 与 x86/ARM64 双线对照，数字给量级不绑型号 · 2026-11-14</text>

  <!-- ============ 左：抽象塔七层 ============ -->
  <text x="60" y="102" font-size="14" font-weight="bold" fill="#37474f">抽象塔七层（自底向上）</text>
  <text x="300" y="102" font-size="11" fill="#616161">下层提供服务，上层只管用（001 §1.1）</text>

  <!-- 应用 -->
  <rect x="80" y="112" width="480" height="56" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="96" y="136" font-size="14" font-weight="bold" fill="#123314">应用</text>
  <text x="96" y="156" font-size="11.5" fill="#1b3d1e">你写的程序 —— 只调库函数，不问硬件</text>
  <text x="544" y="136" font-size="11" fill="#2e5230" text-anchor="end">C 语言 001~014</text>

  <!-- 操作系统 -->
  <rect x="80" y="178" width="480" height="56" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="96" y="202" font-size="14" font-weight="bold" fill="#123314">操作系统</text>
  <text x="96" y="222" font-size="11.5" fill="#1b3d1e">硬件资源的总管家 —— 分配时间、内存、设备</text>
  <text x="544" y="202" font-size="11" fill="#2e5230" text-anchor="end">操作系统原理 全板块</text>

  <!-- 固件/驱动 -->
  <rect x="80" y="244" width="480" height="56" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="96" y="268" font-size="14" font-weight="bold" fill="#5d4700">固件 / 驱动</text>
  <text x="96" y="288" font-size="11.5" fill="#5d4700">面向硬件的第一层软件 —— 写寄存器、供上层调用</text>
  <text x="544" y="268" font-size="11" fill="#5d4700" text-anchor="end">C 005 §5.6 · 规划 006/008</text>

  <!-- ISA -->
  <rect x="80" y="310" width="480" height="56" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="96" y="334" font-size="14" font-weight="bold" fill="#7f3f00">指令集 ISA —— 本板块核心层</text>
  <text x="96" y="354" font-size="11.5" fill="#7f3f00">软件与硬件的契约 —— 编译器按它译，芯片按它实现</text>
  <text x="544" y="334" font-size="11" fill="#7f3f00" text-anchor="end">002 §2.3</text>

  <!-- 部件 -->
  <rect x="80" y="376" width="480" height="56" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="96" y="400" font-size="14" font-weight="bold" fill="#123314">部件：CPU · 存储 · 外设</text>
  <text x="96" y="420" font-size="11.5" fill="#1b3d1e">执行机制与数据放置 —— 指令循环、金字塔、总线</text>
  <text x="544" y="400" font-size="11" fill="#2e5230" text-anchor="end">002 / 003</text>

  <!-- 逻辑门 -->
  <rect x="80" y="442" width="480" height="56" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="96" y="466" font-size="14" font-weight="bold" fill="#0d2f5c">逻辑门</text>
  <text x="96" y="486" font-size="11.5" fill="#0d2f5c">与 / 或 / 非 / 触发器的组合 —— 芯片内部的原子</text>
  <text x="544" y="466" font-size="11" fill="#0d2f5c" text-anchor="end">数字电路 001</text>

  <!-- 晶体管 -->
  <rect x="80" y="508" width="480" height="56" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="96" y="532" font-size="14" font-weight="bold" fill="#0d2f5c">晶体管</text>
  <text x="96" y="552" font-size="11.5" fill="#0d2f5c">最小开关单元 —— 导通 / 截止，只有两态故用二进制</text>
  <text x="544" y="532" font-size="11" fill="#0d2f5c" text-anchor="end">硬件基础 003</text>

  <!-- 塔右侧方向箭头 -->
  <line x1="600" y1="548" x2="600" y2="150" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ 右：两条硬件线 ============ -->
  <rect x="650" y="112" width="490" height="196" rx="8" fill="#fafafa" stroke="#cfd8dc" stroke-width="1"/>
  <text x="670" y="136" font-size="14" font-weight="bold" fill="#1b5e20">线一 · MCU 微控制器</text>
  <text x="670" y="162" font-size="11.5" fill="#37474f">内存 KB 级：程序放 Flash、变量放 SRAM（两个独立数字）</text>
  <text x="670" y="186" font-size="11.5" fill="#37474f">跑裸机或 RTOS，单地址空间，没有 MMU</text>
  <text x="670" y="210" font-size="11.5" fill="#37474f">典型：STM32 类 · 电机控制 / 温度采集 / 实时响应</text>
  <text x="670" y="240" font-size="11" fill="#616161">选它的理由：微秒级确定性、低功耗、几元钱一颗</text>
  <text x="670" y="262" font-size="11" fill="#616161">带你的第一块板：Flash 64KB / SRAM 20KB（F103C8T6）</text>
  <text x="670" y="288" font-size="11" fill="#e65100">开发方式：交叉编译 + 烧录（001 §1.3）</text>

  <rect x="650" y="324" width="490" height="196" rx="8" fill="#fafafa" stroke="#cfd8dc" stroke-width="1"/>
  <text x="670" y="348" font-size="14" font-weight="bold" fill="#0d2f5c">线二 · SoC / PC 应用处理器</text>
  <text x="670" y="374" font-size="11.5" fill="#37474f">内存 MB~GB 级，配 MMU 做虚拟内存</text>
  <text x="670" y="398" font-size="11.5" fill="#37474f">跑嵌入式 Linux、Android 或桌面 OS</text>
  <text x="670" y="422" font-size="11.5" fill="#37474f">典型：树莓派类 · 网关 / 智能设备 / 手机主控</text>
  <text x="670" y="452" font-size="11" fill="#616161">选它的理由：要协议栈、GUI、文件系统、大量算力</text>
  <text x="670" y="474" font-size="11" fill="#616161">本机实测锚点：Ryzen 7 7840H / 16GB / L2 8MB / L3 16MB</text>
  <text x="670" y="500" font-size="11" fill="#e65100">开发方式：交叉编译 + 系统构建（001 §1.3）</text>

  <!-- ============ 底部：拿到陌生芯片先问三句 ============ -->
  <text x="60" y="600" font-size="14" font-weight="bold" fill="#37474f">拿到陌生芯片，先问三句（001 §1.3 的选型判定）</text>

  <rect x="60" y="612" width="340" height="62" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="78" y="636" font-size="12.5" font-weight="bold" fill="#0d2f5c">① 字长多少</text>
  <text x="78" y="658" font-size="11.5" fill="#37474f">决定一次运算的宽度与地址空间上限</text>

  <rect x="420" y="612" width="340" height="62" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="438" y="636" font-size="12.5" font-weight="bold" fill="#0d2f5c">② 内存多大，程序与变量放哪</text>
  <text x="438" y="658" font-size="11.5" fill="#37474f">KB 级走线一，MB~GB 级走线二</text>

  <rect x="780" y="612" width="360" height="62" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="798" y="636" font-size="12.5" font-weight="bold" fill="#0d2f5c">③ 有没有 OS</text>
  <text x="798" y="658" font-size="11.5" fill="#37474f">决定走裸机 / RTOS 还是 Linux 开发线</text>

  <!-- 学习路径 -->
  <text x="60" y="700" font-size="12" fill="#37474f">学习路径：001 抽象塔 → 002 CPU 与指令集 → 003 存储层次；「下层提供服务、上层只管用」的分层视角贯穿全库</text>

  <!-- 图例 -->
  <rect x="60" y="712" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="90" y="724" font-size="11" fill="#37474f">主体层（应用 / OS / 部件）</text>
  <rect x="290" y="712" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="320" y="724" font-size="11" fill="#37474f">本板块核心层 ISA</text>
  <rect x="480" y="712" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="510" y="724" font-size="11" fill="#37474f">过渡层（固件/驱动）</text>
  <rect x="680" y="712" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="710" y="724" font-size="11" fill="#37474f">电学底层（门 / 晶体管）</text>
  <rect x="900" y="712" width="22" height="14" rx="3" fill="#fafafa" stroke="#cfd8dc" stroke-width="1"/>
  <text x="930" y="724" font-size="11" fill="#37474f">硬件形态对照卡</text>
</svg>
