<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="741.18" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>抽象层级与计算机组成地图</title>
  <desc>002-计算机体系结构 板块全貌图：七层抽象塔 + MCU/SoC 两线硬件形态 + 陌生芯片三问（680 内部坐标系 x 1.764706）</desc>
  <rect x="0" y="0" width="680" height="420" fill="#FFFFFF"/>
  <defs>
    <marker id="a0Blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA6D0"/>
    </marker>
  </defs>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">计算机体系结构 · 抽象塔与硬件形态地图</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">来源：本库建库批 · 2026-11-14</text>

  <!-- 左：抽象塔 -->
  <rect x="18" y="44" width="336" height="292" rx="3" fill="#F4F2EC" stroke="#CFCCC2"/>
  <text x="26" y="58" font-size="9" fill="#4A4945">抽象塔 —— 下层提供服务，上层只管用（001 §1.1）</text>
  <rect x="26" y="66" width="320" height="36" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="38" y="81" font-size="9" font-weight="600" fill="#1F4468">应用</text>
  <text x="38" y="94" font-size="8" fill="#4A4945">你写的程序（C 语言 001~003）</text>
  <rect x="26" y="108" width="320" height="36" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="38" y="123" font-size="9" font-weight="600" fill="#1F4468">操作系统</text>
  <text x="38" y="136" font-size="8" fill="#4A4945">资源总管家（操作系统原理 001~003）</text>
  <rect x="26" y="150" width="320" height="36" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="38" y="165" font-size="9" font-weight="600" fill="#1F4468">固件与驱动</text>
  <text x="38" y="178" font-size="8" fill="#4A4945">贴着硬件的软件（规划 005 / 007）</text>
  <rect x="26" y="192" width="320" height="36" rx="3" fill="#7FA6D0" stroke="#1F4468"/>
  <text x="38" y="207" font-size="9" font-weight="600" fill="#FFFFFF">指令集 ISA —— 本板块核心层</text>
  <text x="38" y="220" font-size="8" fill="#E4EEF9">软件与硬件的契约（002 §2.3）</text>
  <rect x="26" y="234" width="320" height="36" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="38" y="249" font-size="9" font-weight="600" fill="#1F4468">部件：CPU · 存储 · 外设</text>
  <text x="38" y="262" font-size="8" fill="#4A4945">执行机制与数据放置（002 / 003）</text>
  <rect x="26" y="276" width="320" height="36" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="38" y="291" font-size="9" font-weight="600" fill="#1F4468">逻辑门与晶体管</text>
  <text x="38" y="304" font-size="8" fill="#4A4945">电子电路的世界（规划 004）</text>

  <!-- 右：硬件形态两线 + 三问 -->
  <rect x="372" y="44" width="290" height="104" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="384" y="62" font-size="9.5" font-weight="600" fill="#1F4468">MCU 微控制器（线一）</text>
  <text x="384" y="82" font-size="8.5" fill="#4A4945">内存 KB 级：程序放 Flash，变量放 SRAM</text>
  <text x="384" y="100" font-size="8.5" fill="#4A4945">跑裸机或 RTOS；单地址空间</text>
  <text x="384" y="118" font-size="8.5" fill="#4A4945">典型：STM32 类 · 电机/采集实时控制</text>
  <rect x="372" y="156" width="290" height="104" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="384" y="174" font-size="9.5" font-weight="600" fill="#1F4468">SoC / PC 应用处理器（线二）</text>
  <text x="384" y="194" font-size="8.5" fill="#4A4945">内存 MB~GB 级 + MMU 虚拟内存</text>
  <text x="384" y="212" font-size="8.5" fill="#4A4945">跑嵌入式 Linux 或桌面 OS</text>
  <text x="384" y="230" font-size="8.5" fill="#4A4945">典型：树莓派类 · 网关/智能设备</text>
  <rect x="372" y="268" width="290" height="68" rx="3" fill="#ECE7F7" stroke="#9C8ACB"/>
  <text x="384" y="286" font-size="9" font-weight="600" fill="#46337A">拿到陌生芯片，先问三句（001 §1.3）</text>
  <text x="384" y="306" font-size="8.5" fill="#4A4945">① 字长多少 ② 内存多大、程序和变量放哪</text>
  <text x="384" y="322" font-size="8.5" fill="#4A4945">③ 有没有 OS —— 决定走哪条开发线</text>

  <!-- 总结 -->
  <rect x="18" y="344" width="644" height="40" rx="3" fill="#FBEEDA" stroke="#D9A458"/>
  <text x="32" y="369" font-size="9.5" font-weight="600" fill="#7A4A12">学习路径：001 抽象塔 → 002 CPU 指令集 → 003 存储层次；"下层提供服务、上层只管用"的分层视角贯穿全库</text>
  <text x="32" y="402" font-size="8" fill="#8C8980">口径：概念通用 · ARM Cortex-M 与 x86/ARM64 双线对照 · 数字给量级不绑型号 — 2026-11-14</text>
</svg>
