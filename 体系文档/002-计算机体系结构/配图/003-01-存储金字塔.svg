<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>存储金字塔：越快越小越贵（本机实数版）</title>
  <rect x="0" y="0" width="1200" height="500" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#90a4ae"/>
    </marker>
  </defs>

  <text x="60" y="46" font-size="20" font-weight="bold" fill="#0d2f5c">存储金字塔：越快越小越贵，本机实测数字</text>
  <text x="60" y="70" font-size="11" fill="#616161">来源：002 板块 003 §3.1 wmic 本机实录（AMD Ryzen 7 7840H / 16GB / NVMe 1TB）· 2026-11-14</text>

  <!-- 金字塔 -->
  <path d="M 300 112 L 500 112 L 545 182 L 255 182 Z" fill="#a5d6a7" stroke="#1b5e20" stroke-width="1.5"/>
  <text x="400" y="142" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">寄存器</text>
  <text x="400" y="164" font-size="11.5" fill="#1b3d1e" text-anchor="middle">数十个 × 64 位 · 速度基准 1</text>

  <path d="M 255 182 L 545 182 L 595 252 L 205 252 Z" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="400" y="212" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">缓存 L2 / L3</text>
  <text x="400" y="234" font-size="11.5" fill="#1b3d1e" text-anchor="middle">本机 8 MB / 16 MB · 快 10 倍以上量级</text>

  <path d="M 205 252 L 595 252 L 655 322 L 145 322 Z" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="400" y="282" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">内存 DRAM</text>
  <text x="400" y="304" font-size="11.5" fill="#0d2f5c" text-anchor="middle">本机 16 GB · 慢数十倍量级</text>

  <path d="M 145 322 L 655 322 L 715 392 L 85 392 Z" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="400" y="352" font-size="13" font-weight="bold" fill="#37474f" text-anchor="middle">磁盘 NVMe</text>
  <text x="400" y="374" font-size="11.5" fill="#37474f" text-anchor="middle">本机 1 TB · 慢千倍量级</text>

  <text x="60" y="410" font-size="11" fill="#616161">越往上：越快、越小、越贵 —— 三者不能兼得，所以必须分层</text>

  <!-- 右侧取数路径 -->
  <text x="760" y="104" font-size="13" font-weight="bold" fill="#37474f">CPU 要一个数，从顶层往下找</text>

  <rect x="760" y="112" width="380" height="46" rx="6" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="778" y="132" font-size="12" font-weight="bold" fill="#37474f">① 要 4 个字节</text>
  <text x="778" y="150" font-size="11" fill="#616161">但硬件搬上来的是一整块（64B 一行）</text>

  <rect x="760" y="174" width="380" height="52" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="778" y="196" font-size="12" font-weight="bold" fill="#123314">② 缓存命中 → 直接给</text>
  <text x="778" y="216" font-size="11" fill="#1b3d1e">L2 8MB / L3 16MB：这一层最快，命中就赚到</text>

  <rect x="760" y="242" width="380" height="52" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="778" y="264" font-size="12" font-weight="bold" fill="#0d2f5c">③ 没命中 → 去 DRAM 取</text>
  <text x="778" y="284" font-size="11" fill="#0d2f5c">16GB，慢数十倍 —— 这就是「等内存」的代价</text>

  <rect x="760" y="310" width="380" height="52" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="778" y="332" font-size="12" font-weight="bold" fill="#37474f">④ 还不在内存 → 读磁盘</text>
  <text x="778" y="352" font-size="11" fill="#37474f">1TB，慢千倍 —— 换页、加载程序都在这一层</text>

  <line x1="950" y1="158" x2="950" y2="172" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="950" y1="226" x2="950" y2="240" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="950" y1="294" x2="950" y2="308" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="760" y="386" font-size="11" fill="#616161">每一级命中，就省掉下面所有层的等待</text>

  <!-- 结论 -->
  <rect x="60" y="424" width="1080" height="42" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="80" y="451" font-size="13" fill="#7f3f00">主频决定上限，存储层次决定你离上限多远 —— 下一张的四种访问模式，就是把这句量成数字</text>

  <!-- 图例 -->
  <rect x="60" y="478" width="22" height="12" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="90" y="488" font-size="11" fill="#37474f">缓存</text>
  <rect x="170" y="478" width="22" height="12" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="200" y="488" font-size="11" fill="#37474f">内存 DRAM</text>
  <rect x="320" y="478" width="22" height="12" rx="3" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
  <text x="350" y="488" font-size="11" fill="#37474f">磁盘 NVMe</text>
  <text x="470" y="488" font-size="11" fill="#616161">顶层寄存器：数十个 × 64 位，速度基准</text>
</svg>
