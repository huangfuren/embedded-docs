  <rect x="26" y="114" width="384" height="34" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="34" y="127" font-size="9" fill="#1F4468">005 MCU 与外设（STM32F103）★</text>
  <text x="34" y="141" font-size="8" fill="#4A4945">GPIO → 中断 → 定时器 → UART → I2C/SPI → ADC → DMA</text>
  <rect x="26" y="152" width="384" height="34" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
