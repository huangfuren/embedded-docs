  <line x1="218" y1="394" x2="218" y2="406" stroke="#7FA6D0" marker-end="url(#aRBlue)"/>

  <!-- 阶段三 -->
  <rect x="18" y="406" width="400" height="48" rx="3" fill="#F4F2EC" stroke="#CFCCC2"/>
