  <text x="442" y="162" font-size="8.5" fill="#4A4945">⑥ 电源/BMS　26%</text>
  <text x="442" y="178" font-size="8.5" fill="#4A4945">⑦ 汽车电子　25%</text>
  <text x="442" y="194" font-size="8.5" fill="#4A4945">⑧ 传感器/ADC　24%</text>
  <rect x="430" y="214" width="232" height="88" rx="3" fill="#ECE7F7" stroke="#9C8ACB"/>
  <text x="442" y="232" font-size="9" font-weight="600" fill="#46337A">求职动作（27 届应届）</text>
  <text x="442" y="252" font-size="8.5" fill="#4A4945">① 校招 = 主战场（2027 春招）</text>
  <text x="442" y="270" font-size="8.5" fill="#4A4945">② 秋招补录：现在就投</text>
  <text x="442" y="288" font-size="8.5" fill="#4A4945">③ 可投池 406（工业类 135）</text>
  <rect x="430" y="310" width="232" height="52" rx="3" fill="#F4F2EC" stroke="#CFCCC2"/>
  <text x="442" y="330" font-size="8.5" fill="#4A4945">知识库进度：001~004 已建成（17 册）</text>
  <text x="442" y="348" font-size="8.5" fill="#4A4945">下一批：005 MCU（买 F103C8T6+ST-Link）</text>

  <!-- 总结 -->
  <rect x="18" y="424" width="644" height="40" rx="3" fill="#FBEEDA" stroke="#D9A458"/>
  <text x="32" y="449" font-size="9" font-weight="600" fill="#7A4A12">底座三件套不变：单片机 37% · C 35% · 驱动 35%；差异化 = PCB 读图 + 工控深耕；RTOS(11%)/Linux(15%) 低频，别提前卷</text>
  <text x="32" y="478" font-size="8" fill="#8C8980">数据源：Boss直聘 苏锡常 846 份 JD 全文（7 关键词，2026-11）· 频率为样本估计 · 27 届应届视角</text>
