  <text x="34" y="179" font-size="8" fill="#4A4945">40% 全榜第一 · 应届生最容易被刷的点</text>
  <rect x="26" y="190" width="384" height="30" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="34" y="203" font-size="9" fill="#1F4468">RTOS 最小版 ○ · 驱动分层思维 ★</text>
  <text x="34" y="216" font-size="8" fill="#4A4945">11% —— 顺手学，别深入</text>
  <rect x="26" y="224" width="384" height="20" rx="3" fill="#FBEEDA" stroke="#D9A458"/>
  <text x="34" y="238" font-size="8.5" fill="#7A4A12">产出：2~3 个完整 STM32 项目（面试作品集）</text>
