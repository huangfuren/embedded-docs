<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>嵌入式技术学习路线（泳道顺序图）</title>
  <defs>
    <marker id="arwSeq" markerWidth="7" markerHeight="7" refX="3.5" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,0 L3.5,7 z" fill="#90a4ae"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="680" fill="#ffffff"/>

  <text x="60" y="46" font-size="20" font-weight="bold" fill="#0d2f5c">嵌入式技术学习路线 · 泳道顺序图（自上而下 = 学习顺序）</text>
  <text x="60" y="70" font-size="11" fill="#616161">来源：体系文档 README 学习路线 · 口径：册数为当前已完稿数量，标注「规划」的板块尚未成册 · 2026-11-14</text>


  <!-- 泳道 ① -->
  <rect x="60" y="96" width="1080" height="86" rx="6" fill="#fafafa" stroke="#cfd8dc" stroke-width="1"/>
  <text x="80" y="118" font-size="11" font-weight="bold" fill="#37474f">泳道 ① · 语言基础 —— 先能用 C 把想法写成程序</text>
  <rect x="80" y="128" width="1040" height="40" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="100" y="153" font-size="12" fill="#0d2f5c">环境与编译 → 语法与位运算 → 指针与内存 → 结构体 / 位域 / 预处理</text>
  <text x="1100" y="153" font-size="11" fill="#1565c0" text-anchor="end">001-C语言　共 14 册</text>

  <!-- 泳道 ② -->
  <rect x="60" y="202" width="1080" height="86" rx="6" fill="#fafafa" stroke="#cfd8dc" stroke-width="1"/>
  <text x="80" y="224" font-size="11" font-weight="bold" fill="#37474f">泳道 ② · 硬件基础 —— 与 ① 并行，摸板之前完成</text>
  <rect x="80" y="234" width="1040" height="40" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="100" y="259" font-size="12" fill="#5d4700">电压 / 电流 / 欧姆定律 → 逻辑门与数字信号 → 元器件与 MCU 最小系统</text>
  <text x="1100" y="259" font-size="11" fill="#5d4700" text-anchor="end">004-电子电路　共 3 册</text>

  <!-- 泳道 ③ -->
  <rect x="60" y="308" width="1080" height="86" rx="6" fill="#fafafa" stroke="#cfd8dc" stroke-width="1"/>
  <text x="80" y="330" font-size="11" font-weight="bold" fill="#37474f">泳道 ③ · 理论 —— 知道机器和系统在底下替你做了什么</text>
  <rect x="80" y="340" width="500" height="40" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="100" y="365" font-size="12" fill="#1b3d1e">计算机体系结构（3 册）：抽象塔 → CPU/指令集 → 存储层次</text>
  <rect x="600" y="340" width="520" height="40" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="620" y="365" font-size="12" fill="#1b3d1e">操作系统原理（3 册）：职责与启动 → 进程线程 → 中断与系统调用</text>

  <!-- 泳道 ④ -->
  <rect x="60" y="414" width="1080" height="86" rx="6" fill="#fafafa" stroke="#cfd8dc" stroke-width="1"/>
  <text x="80" y="436" font-size="11" font-weight="bold" fill="#37474f">泳道 ④ · 实战主线 —— 软硬结合真正落地的地方</text>
  <rect x="80" y="446" width="500" height="40" rx="4" fill="#ffcc80" stroke="#e65100" stroke-width="1.5"/>
  <text x="100" y="471" font-size="12" fill="#7f3f00">STM32 外设实战（规划）：点灯 → 串口 → I2C/SPI → 中断 → DMA</text>
  <line x1="582" y1="466" x2="598" y2="466" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arwSeq)"/>
  <rect x="600" y="446" width="520" height="40" rx="4" fill="#ffcc80" stroke="#e65100" stroke-width="1.5"/>
  <text x="620" y="471" font-size="12" fill="#7f3f00">RTOS（FreeRTOS，规划）：任务 → 队列 → 信号量</text>

  <!-- 泳道 ⑤ -->
  <rect x="60" y="520" width="1080" height="86" rx="6" fill="#fafafa" stroke="#cfd8dc" stroke-width="1"/>
  <text x="80" y="542" font-size="11" font-weight="bold" fill="#37474f">泳道 ⑤ · 进阶与收口 —— 从会写代码到能交付作品</text>
  <rect x="80" y="552" width="500" height="40" rx="4" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="100" y="577" font-size="12" fill="#5e35b1">嵌入式 Linux（规划）：交叉编译 → 内核 → 驱动</text>
  <line x1="582" y1="572" x2="598" y2="572" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arwSeq)"/>
  <rect x="600" y="552" width="520" height="40" rx="4" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="620" y="577" font-size="12" fill="#5e35b1">项目作品集（2~3 个 STM32 项目）+ 求职</text>

  <!-- 图例 -->
  <rect x="60" y="640" width="22" height="12" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="90" y="650" font-size="11" fill="#37474f">语言基础</text>
  <rect x="180" y="640" width="22" height="12" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="210" y="650" font-size="11" fill="#37474f">硬件基础</text>
  <rect x="300" y="640" width="22" height="12" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="330" y="650" font-size="11" fill="#37474f">理论</text>
  <rect x="400" y="640" width="22" height="12" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="430" y="650" font-size="11" fill="#37474f">实战主线</text>
  <rect x="520" y="640" width="22" height="12" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1"/>
  <text x="550" y="650" font-size="11" fill="#37474f">进阶与收口</text>
</svg>
