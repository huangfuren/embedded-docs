<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="758.82" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>嵌入式技术学习路线（泳道顺序图）</title>
  <desc>技术学习路线泳道图：自上而下即学习顺序——语言基础 → 硬件基础 → 理论 → 实战主线 → 进阶与收口；①②可并行（680 内部坐标系 x 1.764706）</desc>
  <rect x="0" y="0" width="680" height="430" fill="#FFFFFF"/>
  <defs>
    <marker id="aRBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA6D0"/>
    </marker>
  </defs>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">嵌入式技术学习路线 · 泳道顺序图（自上而下 = 学习顺序）</text>

  <!-- 泳道 ① 语言基础 -->
  <rect x="18" y="44" width="644" height="56" rx="3" fill="#F4F2EC" stroke="#CFCCC2"/>
  <text x="26" y="60" font-size="9" font-weight="600" fill="#2B2A27">泳道 ① · 语言基础</text>
  <rect x="26" y="68" width="628" height="26" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="34" y="85" font-size="9" fill="#1F4468">C 语言：环境与编译 → 语法与位运算 → 指针与内存 → 结构体/位域/预处理</text>
  <line x1="340" y1="100" x2="340" y2="116" stroke="#7FA6D0" marker-end="url(#aRBlue)"/>

  <!-- 泳道 ② 硬件基础 -->
  <rect x="18" y="116" width="644" height="56" rx="3" fill="#F4F2EC" stroke="#CFCCC2"/>
  <text x="26" y="132" font-size="9" font-weight="600" fill="#2B2A27">泳道 ② · 硬件基础（与 ① 并行，摸板前完成）</text>
  <rect x="26" y="140" width="628" height="26" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="34" y="157" font-size="9" fill="#1F4468">电子电路：电压/电流/欧姆定律 → 逻辑门 → 元器件与 MCU 最小系统</text>
  <line x1="340" y1="172" x2="340" y2="188" stroke="#7FA6D0" marker-end="url(#aRBlue)"/>

  <!-- 泳道 ③ 理论 -->
  <rect x="18" y="188" width="644" height="64" rx="3" fill="#F4F2EC" stroke="#CFCCC2"/>
  <text x="26" y="204" font-size="9" font-weight="600" fill="#2B2A27">泳道 ③ · 理论（机器与系统）</text>
  <rect x="26" y="212" width="300" height="30" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="34" y="231" font-size="9" fill="#1F4468">计算机体系结构：抽象塔 → CPU/指令集 → 存储</text>
  <line x1="326" y1="227" x2="346" y2="227" stroke="#7FA6D0" marker-end="url(#aRBlue)"/>
  <rect x="346" y="212" width="296" height="30" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="354" y="231" font-size="9" fill="#1F4468">操作系统原理：职责/启动 → 进程线程 → 中断</text>
  <line x1="340" y1="252" x2="340" y2="268" stroke="#7FA6D0" marker-end="url(#aRBlue)"/>

  <!-- 泳道 ④ 实战主线 -->
  <rect x="18" y="268" width="644" height="64" rx="3" fill="#F4F2EC" stroke="#CFCCC2"/>
  <text x="26" y="284" font-size="9" font-weight="600" fill="#2B2A27">泳道 ④ · 实战主线（软硬结合落地点）</text>
  <rect x="26" y="292" width="330" height="30" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="34" y="311" font-size="9" fill="#1F4468">STM32 外设实战：点灯→串口→I2C/SPI→中断→DMA</text>
  <line x1="356" y1="307" x2="376" y2="307" stroke="#7FA6D0" marker-end="url(#aRBlue)"/>
  <rect x="376" y="292" width="268" height="30" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="384" y="311" font-size="9" fill="#1F4468">RTOS（FreeRTOS）：任务/队列/信号量</text>
  <line x1="340" y1="332" x2="340" y2="348" stroke="#7FA6D0" marker-end="url(#aRBlue)"/>

  <!-- 泳道 ⑤ 进阶与收口 -->
  <rect x="18" y="348" width="644" height="64" rx="3" fill="#F4F2EC" stroke="#CFCCC2"/>
  <text x="26" y="364" font-size="9" font-weight="600" fill="#2B2A27">泳道 ⑤ · 进阶与收口</text>
  <rect x="26" y="372" width="330" height="30" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="34" y="391" font-size="9" fill="#1F4468">嵌入式 Linux：交叉编译 → 内核 → 驱动</text>
  <line x1="356" y1="387" x2="376" y2="387" stroke="#7FA6D0" marker-end="url(#aRBlue)"/>
  <rect x="376" y="372" width="268" height="30" rx="3" fill="#FBEEDA" stroke="#D9A458"/>
  <text x="384" y="391" font-size="9" fill="#7A4A12">项目作品集（2~3 个 STM32 项目）+ 求职</text>
  <text x="26" y="418" font-size="8" fill="#8C8980">① 与 ② 可并行 · 自上而下即学习顺序 · 编号对应知识库板块：①=001-C语言 ②=004-电子电路 ③=002-体系结构+003-OS ④⑤=005/006/007（规划）</text>
</svg>
