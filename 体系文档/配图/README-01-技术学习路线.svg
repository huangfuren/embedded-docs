  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">技术学习路线 · 数据校准版（软硬结合方向）</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">数据源：Boss直聘 846 份 JD（苏锡常）· 2026-11</text>

  <!-- 已完成地基 -->
  <rect x="18" y="44" width="400" height="34" rx="3" fill="#F4F2EC" stroke="#CFCCC2"/>
  <text x="26" y="66" font-size="8.5" fill="#1D5A45">已完成地基（知识库 001~004，17 册）：C 语言 · 计算机体系结构 · 操作系统原理 · 电子电路</text>
  <line x1="218" y1="78" x2="218" y2="92" stroke="#7FA6D0" marker-end="url(#aRBlue)"/>

