<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="875.30" viewBox="0 0 680 496" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>技术学习路线（数据校准版）</title>
  <desc>基于 Boss直聘 苏锡常 846 份嵌入式 JD 频率实测的三阶段学习路线：底座已完成、春招冲刺、差异化加深、入职补充（680 内部坐标系 x 1.764706）</desc>
  <rect x="0" y="0" width="680" height="496" fill="#FFFFFF"/>
  <defs>
