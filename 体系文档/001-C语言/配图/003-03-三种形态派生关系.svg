<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="1200" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="20" font-weight="bold" fill="#263238">003 · 一种结构派生三种形态：一维 / 二维 / 字符数组</text>
  <text x="1160" y="46" font-size="12" fill="#616161" text-anchor="end">来源：003 全册结构 · C17 · 2026-11-19</text>

  <rect x="420" y="72" width="360" height="56" rx="28" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <text x="600" y="106" font-size="17" font-weight="bold" fill="#7f3f00" text-anchor="middle">数组：同类型元素的连续存储</text>

  <path d="M 600 128 L 600 196" fill="none" stroke="#607d8b" stroke-width="2"/>
  <path d="M 600 196 L 210 196 L 210 240" fill="none" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 600 196 L 990 196 L 990 240" fill="none" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 600 196 L 600 240" fill="none" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="250" width="340" height="152" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="60" y="282" font-size="15" font-weight="bold" fill="#123314">一维数组</text>
  <text x="60" y="308" font-size="13" fill="#1b3d1e" font-family="ui-monospace,Menlo,Consolas,monospace">int arr[5];</text>
  <text x="60" y="334" font-size="11.5" fill="#1b3d1e">元素同类型，相邻地址差 = sizeof</text>
  <text x="60" y="356" font-size="11.5" fill="#1b3d1e">随机访问 O(1)，越界不报错</text>
  <text x="60" y="384" font-size="11" fill="#616161">派生条件：不加任何修饰</text>

  <rect x="430" y="250" width="340" height="152" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="450" y="282" font-size="15" font-weight="bold" fill="#123314">二维数组</text>
  <text x="450" y="308" font-size="13" fill="#1b3d1e" font-family="ui-monospace,Menlo,Consolas,monospace">int m[2][3];</text>
  <text x="450" y="334" font-size="11.5" fill="#1b3d1e">元素本身是一维数组，行优先铺平</text>
  <text x="450" y="356" font-size="11.5" fill="#1b3d1e">三个身份落在同一地址</text>
  <text x="450" y="384" font-size="11" fill="#616161">派生条件：元素又是一维数组</text>

  <rect x="820" y="250" width="340" height="152" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="840" y="282" font-size="15" font-weight="bold" fill="#123314">字符数组</text>
  <text x="840" y="308" font-size="13" fill="#1b3d1e" font-family="ui-monospace,Menlo,Consolas,monospace">char s[] = &quot;lily&quot;;</text>
  <text x="840" y="334" font-size="11.5" fill="#1b3d1e">元素是 char，靠 \0 收尾</text>
  <text x="840" y="356" font-size="11.5" fill="#1b3d1e">退化后就是 char*（005 §5.3）</text>
  <text x="840" y="384" font-size="11" fill="#616161">派生条件：元素是 char + 哨兵</text>

  <rect x="40" y="424" width="1120" height="56" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="62" y="448" font-size="13" font-weight="bold" fill="#5d4037">三种形态共用一套内存模型：一段连续字节 + 一个起始地址 + 元素宽度</text>
  <text x="62" y="470" font-size="12" fill="#5d4037">所谓「维」只是编译器替你算偏移的方式，内存里始终是一条线</text>

  <rect x="40" y="494" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="72" y="506" font-size="12" fill="#37474f">派生出的形态</text>
  <rect x="200" y="494" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <text x="232" y="506" font-size="12" fill="#37474f">共同的根结构</text>
  <line x1="360" y1="501" x2="400" y2="501" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="506" font-size="12" fill="#37474f">派生（箭头方向）</text>
</svg>
