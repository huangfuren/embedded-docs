<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="1200" height="460" fill="#ffffff"/>
  <defs>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#388e3c"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="20" font-weight="bold" fill="#263238">002 · 三种控制流：顺序、分支、循环的执行路径</text>
  <text x="1160" y="46" font-size="12" fill="#616161" text-anchor="end">来源：002 §2.4/§2.5 · C17 · 2026-11-19</text>

  <rect x="40" y="76" width="360" height="336" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="106" font-size="17" font-weight="bold" fill="#1b5e20">顺序</text>
  <text x="116" y="106" font-size="11.5" fill="#616161">从上到下逐句执行</text>

  <rect x="120" y="126" width="200" height="44" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="220" y="154" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">语句 A</text>
  <line x1="220" y1="172" x2="220" y2="186" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="120" y="190" width="200" height="44" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="220" y="218" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">语句 B</text>
  <line x1="220" y1="236" x2="220" y2="250" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="120" y="254" width="200" height="44" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="220" y="282" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">语句 C</text>

  <text x="60" y="336" font-size="11.5" fill="#37474f">绝大多数代码就是这条直线</text>
  <text x="60" y="358" font-size="11.5" fill="#616161">没有判断，也没有回边</text>

  <rect x="420" y="76" width="360" height="336" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="440" y="106" font-size="17" font-weight="bold" fill="#8d6e00">分支</text>
  <text x="496" y="106" font-size="11.5" fill="#616161">条件决定走哪条路</text>

  <rect x="520" y="126" width="180" height="44" rx="22" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="610" y="154" font-size="15" font-weight="bold" fill="#5d4700" text-anchor="middle">条件 ?</text>

  <path d="M 610 172 L 610 196 L 510 196 L 510 212" fill="none" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 610 196 L 685 196 L 685 212" fill="none" stroke="#e65100" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowOrange)"/>
  <text x="502" y="190" font-size="11" fill="#388e3c" text-anchor="end">true</text>
  <text x="692" y="190" font-size="11" fill="#e65100">false</text>

  <rect x="440" y="216" width="150" height="44" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="510" y="244" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">语句体 1</text>

  <rect x="610" y="216" width="150" height="44" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="685" y="244" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">语句体 2（else）</text>

  <path d="M 510 262 L 510 286 L 610 286 L 610 296" fill="none" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 685 262 L 685 286 L 610 286" fill="none" stroke="#388e3c" stroke-width="2"/>

  <rect x="510" y="300" width="200" height="44" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="610" y="328" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">继续往下</text>

  <text x="440" y="372" font-size="11.5" fill="#37474f">switch 与 if 同族；漏 break 会穿落到下一个分支</text>

  <rect x="800" y="76" width="360" height="336" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="820" y="106" font-size="17" font-weight="bold" fill="#0d47a1">循环</text>
  <text x="876" y="106" font-size="11.5" fill="#616161">条件不满足才出来</text>

  <rect x="880" y="126" width="180" height="44" rx="22" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="970" y="154" font-size="15" font-weight="bold" fill="#5d4700" text-anchor="middle">条件 ?</text>

  <line x1="970" y1="172" x2="970" y2="212" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="980" y="196" font-size="11" fill="#388e3c">true</text>

  <rect x="880" y="216" width="180" height="44" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="970" y="238" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">循环体</text>
  <text x="970" y="254" font-size="11" fill="#2e5230" text-anchor="middle">+ 步进</text>

  <path d="M 880 238 L 852 238 L 852 148 L 876 148" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="838" y="200" font-size="11" fill="#1565c0" text-anchor="end">回边</text>

  <path d="M 1062 148 L 1092 148 L 1092 296" fill="none" stroke="#e65100" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowOrange)"/>
  <text x="1100" y="142" font-size="11" fill="#e65100">false</text>
  <rect x="1036" y="300" width="112" height="34" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="1092" y="322" font-size="12" font-weight="bold" fill="#123314" text-anchor="middle">退出循环</text>

  <text x="820" y="336" font-size="11.5" fill="#37474f">三要素：初始化 / 条件 / 步进</text>
  <text x="820" y="358" font-size="11.5" fill="#616161">步进忘了写就是死循环</text>

  <rect x="40" y="438" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="72" y="450" font-size="12" fill="#37474f">顺序执行的语句块</text>
  <rect x="240" y="438" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="272" y="450" font-size="12" fill="#37474f">判断点</text>
  <line x1="360" y1="445" x2="402" y2="445" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="414" y="450" font-size="12" fill="#37474f">条件成立，继续</text>
  <line x1="560" y1="445" x2="602" y2="445" stroke="#e65100" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowOrange)"/>
  <text x="614" y="450" font-size="12" fill="#37474f">条件不成立，走另一条路</text>
  <rect x="820" y="438" width="22" height="14" rx="3" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="852" y="450" font-size="12" fill="#37474f">两路汇合后的出口</text>
</svg>
