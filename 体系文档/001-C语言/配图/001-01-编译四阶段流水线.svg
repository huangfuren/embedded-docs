<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="1200" height="370" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="20" font-weight="bold" fill="#263238">001 · 编译四阶段：一条 gcc 背后发生了什么</text>
  <text x="1160" y="46" font-size="12" fill="#616161" text-anchor="end">来源：001 §1.5 本机实测 · C17 · 2026-11-19</text>

  <text x="40" y="86" font-size="12" fill="#37474f">四个阶段各自产出一个中间文件；报错发生在哪个阶段，问题就在哪一层</text>

  <rect x="40" y="110" width="200" height="64" rx="6" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <text x="140" y="138" font-size="15" font-weight="bold" fill="#37474f" text-anchor="middle">源码</text>
  <text x="140" y="160" font-size="12" fill="#546e7a" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">hello.c</text>
  <line x1="248" y1="142" x2="262" y2="142" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="270" y="110" width="200" height="64" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="370" y="138" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">① 预处理</text>
  <text x="370" y="160" font-size="12" fill="#2e5230" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">hello.i</text>
  <line x1="478" y1="142" x2="492" y2="142" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="500" y="110" width="200" height="64" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="600" y="138" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">② 编译</text>
  <text x="600" y="160" font-size="12" fill="#2e5230" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">hello.s</text>
  <line x1="708" y1="142" x2="722" y2="142" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="730" y="110" width="200" height="64" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="830" y="138" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">③ 汇编</text>
  <text x="830" y="160" font-size="12" fill="#2e5230" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">hello.o</text>
  <line x1="938" y1="142" x2="952" y2="142" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="960" y="110" width="200" height="64" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <text x="1060" y="138" font-size="15" font-weight="bold" fill="#7f3f00" text-anchor="middle">④ 链接</text>
  <text x="1060" y="160" font-size="12" fill="#7f3f00" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">hello.exe</text>

  <text x="140" y="196" font-size="11.5" fill="#616161" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">手写保存</text>
  <text x="370" y="196" font-size="11.5" fill="#37474f" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">gcc -E</text>
  <text x="600" y="196" font-size="11.5" fill="#37474f" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">gcc -S</text>
  <text x="830" y="196" font-size="11.5" fill="#37474f" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">gcc -c</text>
  <text x="1060" y="196" font-size="11.5" fill="#37474f" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">gcc hello.o</text>

  <rect x="40" y="214" width="1120" height="42" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="60" y="240" font-size="12.5" fill="#123314">一条命令 <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5">gcc -Wall hello.c -o hello.exe</tspan> = 四阶段自动连跑；.i / .s / .o 只是中间产物，可删</text>

  <rect x="40" y="272" width="1120" height="56" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="62" y="296" font-size="13" font-weight="bold" fill="#5d4037">看报错定位：.i 出问题查宏、.s 出问题查语法与优化、链接错查函数名与库</text>
  <text x="62" y="318" font-size="12" fill="#5d4037">预处理只做文本替换，编译才检查语法，链接才检查「这个函数到底有没有定义」</text>

  <rect x="40" y="348" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="72" y="360" font-size="12" fill="#37474f">中间阶段</text>
  <rect x="200" y="348" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <text x="232" y="360" font-size="12" fill="#37474f">最终产物（可执行）</text>
  <rect x="400" y="348" width="22" height="14" rx="3" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="432" y="360" font-size="12" fill="#37474f">单条命令等效四步</text>
  <line x1="600" y1="355" x2="642" y2="355" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="654" y="360" font-size="12" fill="#37474f">阶段推进（从左到右）</text>
</svg>
