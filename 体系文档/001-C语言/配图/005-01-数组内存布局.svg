<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="582.35" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>数组内存布局</title>
  <desc>005-数组与字符串：一维数组的连续格子与索引、二维数组按一维连续存放的实证（680 内部坐标系 x 1.764706）</desc>
  <rect x="0" y="0" width="680" height="330" fill="#FFFFFF"/>
  <defs>
    <marker id="a5Blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA6D0"/>
    </marker>
  </defs>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">005 · 数组内存布局：连续存放，索引从 0 起</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">来源：005 §5.1/§5.2 本机实测 · 2026-11-15</text>

  <rect x="18" y="44" width="644" height="104" rx="3" fill="#F4F2EC" stroke="#CFCCC2"/>
  <text x="26" y="60" font-size="9" fill="#4A4945">一维 int arr[5] = {10, 20, 30, 40, 50}</text>
  <rect x="26" y="68" width="72" height="34" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="62" y="90" font-size="9.5" fill="#1F4468" text-anchor="middle">10</text>
  <rect x="104" y="68" width="72" height="34" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="140" y="90" font-size="9.5" fill="#1F4468" text-anchor="middle">20</text>
  <rect x="182" y="68" width="72" height="34" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="218" y="90" font-size="9.5" fill="#1F4468" text-anchor="middle">30</text>
  <rect x="260" y="68" width="72" height="34" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="296" y="90" font-size="9.5" fill="#1F4468" text-anchor="middle">40</text>
  <rect x="338" y="68" width="72" height="34" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="374" y="90" font-size="9.5" fill="#1F4468" text-anchor="middle">50</text>
  <text x="62" y="118" font-size="8" fill="#8C8980" text-anchor="middle">[0]</text>
  <text x="140" y="118" font-size="8" fill="#8C8980" text-anchor="middle">[1]</text>
  <text x="218" y="118" font-size="8" fill="#8C8980" text-anchor="middle">[2]</text>
  <text x="296" y="118" font-size="8" fill="#8C8980" text-anchor="middle">[3]</text>
  <text x="374" y="118" font-size="8" fill="#8C8980" text-anchor="middle">[4]</text>
  <text x="440" y="80" font-size="8" fill="#1D5A45">相邻元素地址差 = sizeof(int) = 4 字节</text>
  <text x="440" y="96" font-size="8" fill="#1D5A45">最大索引 = 长度 - 1（arr[5] 已越界）</text>
  <text x="440" y="112" font-size="8" fill="#4A4945">长度公式只在定义处有效（003 §3.3）</text>

  <rect x="18" y="156" width="644" height="112" rx="3" fill="#F4F2EC" stroke="#CFCCC2"/>
  <text x="26" y="172" font-size="9" fill="#4A4945">二维 int arr[2][3] = {{1, 2, 3}, {4, 5, 6}} —— 内存里仍是一条线</text>
  <rect x="26" y="182" width="72" height="30" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="62" y="202" font-size="9.5" fill="#1F4468" text-anchor="middle">1</text>
  <rect x="104" y="182" width="72" height="30" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="140" y="202" font-size="9.5" fill="#1F4468" text-anchor="middle">2</text>
  <rect x="182" y="182" width="72" height="30" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="218" y="202" font-size="9.5" fill="#1F4468" text-anchor="middle">3</text>
  <rect x="26" y="218" width="72" height="30" rx="3" fill="#ECE7F7" stroke="#9C8ACB"/>
  <text x="62" y="238" font-size="9.5" fill="#46337A" text-anchor="middle">4</text>
  <rect x="104" y="218" width="72" height="30" rx="3" fill="#ECE7F7" stroke="#9C8ACB"/>
  <text x="140" y="238" font-size="9.5" fill="#46337A" text-anchor="middle">5</text>
  <rect x="182" y="218" width="72" height="30" rx="3" fill="#ECE7F7" stroke="#9C8ACB"/>
  <text x="218" y="238" font-size="9.5" fill="#46337A" text-anchor="middle">6</text>
  <text x="272" y="192" font-size="8" fill="#1D5A45">&amp;arr[0] 与 &amp;arr[1] 差 12 字节 = 一行（无空隙）</text>
  <text x="272" y="208" font-size="8" fill="#1D5A45">拿元素指针 p2 连续读 6 个：1 2 3 4 5 6（arr2d_flat 实测）</text>
  <text x="272" y="224" font-size="8" fill="#4A4945">三种指针同址：&amp;arr、&amp;arr[0]、&amp;arr[0][0]</text>
  <text x="272" y="240" font-size="8" fill="#4A4945">蓝 = 第 0 行 · 紫 = 第 1 行；拍平初始化 {1,2,3,4,5,6} 本就按此顺序存</text>

  <rect x="18" y="276" width="644" height="36" rx="3" fill="#FBEEDA" stroke="#D9A458"/>
  <text x="32" y="299" font-size="9.5" font-weight="600" fill="#7A4A12">数组装得下就放，放不下别硬塞：越界不报错，边界只能自己管（最大索引 = 长度 - 1）</text>
  <text x="32" y="326" font-size="8" fill="#8C8980">口径 C17 · 地址为本机实录 · 二维证明与长度公式见 005 §5.1/§5.2 — 2026-11-15</text>
</svg>
