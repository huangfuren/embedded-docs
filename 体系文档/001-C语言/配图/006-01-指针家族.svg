<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="698.82" viewBox="0 0 680 396" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>指针家族：指向关系一图认全</title>
  <desc>006-指针进阶与动态内存：二级指针链、数组指针、指针数组、函数指针的内存指向关系 + 五种声明对照（680 内部坐标系 x 1.764706）</desc>
  <rect x="0" y="0" width="680" height="396" fill="#FFFFFF"/>
  <defs>
    <marker id="a6Blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA6D0"/>
    </marker>
    <marker id="a6Purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9C8ACB"/>
    </marker>
  </defs>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">006 · 指针家族：箭头 = "存的是谁的地址"</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">来源：006 §6.3/§6.4/§6.6 · 2026-11-19</text>

  <!-- 左半：四段指向关系 -->
  <rect x="18" y="44" width="310" height="272" rx="3" fill="#F4F2EC" stroke="#CFCCC2"/>
  <text x="26" y="60" font-size="8.5" fill="#4A4945">二级指针：p2 存 p1 的地址，p1 存 num 的地址</text>
  <rect x="30" y="68" width="72" height="28" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="66" y="86" font-size="8.5" fill="#1F4468" text-anchor="middle">num=100</text>
  <rect x="146" y="68" width="76" height="28" rx="3" fill="#ECE7F7" stroke="#9C8ACB"/>
  <text x="184" y="86" font-size="8.5" fill="#46337A" text-anchor="middle">p1=&amp;num</text>
  <rect x="266" y="68" width="52" height="28" rx="3" fill="#ECE7F7" stroke="#9C8ACB"/>
  <text x="292" y="86" font-size="8.5" fill="#46337A" text-anchor="middle">p2</text>
  <line x1="146" y1="82" x2="106" y2="82" stroke="#7FA6D0" marker-end="url(#a6Blue)"/>
  <line x1="266" y1="82" x2="226" y2="82" stroke="#9C8ACB" marker-end="url(#a6Purple)"/>

  <text x="26" y="118" font-size="8.5" fill="#4A4945">数组指针：p 存整个数组的地址，p+1 跨 20 字节</text>
  <rect x="30" y="124" width="216" height="34" rx="3" fill="none" stroke="#7FA6D0" stroke-dasharray="3,2"/>
  <rect x="34" y="128" width="38" height="26" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="53" y="145" font-size="8" fill="#1F4468" text-anchor="middle">1</text>
  <rect x="76" y="128" width="38" height="26" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="95" y="145" font-size="8" fill="#1F4468" text-anchor="middle">2</text>
  <rect x="118" y="128" width="38" height="26" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="137" y="145" font-size="8" fill="#1F4468" text-anchor="middle">3</text>
  <rect x="160" y="128" width="38" height="26" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="179" y="145" font-size="8" fill="#1F4468" text-anchor="middle">4</text>
  <rect x="202" y="128" width="38" height="26" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="221" y="145" font-size="8" fill="#1F4468" text-anchor="middle">5</text>
  <rect x="276" y="128" width="42" height="26" rx="3" fill="#ECE7F7" stroke="#9C8ACB"/>
  <text x="297" y="145" font-size="8.5" fill="#46337A" text-anchor="middle">p</text>
  <line x1="276" y1="141" x2="252" y2="141" stroke="#7FA6D0" marker-end="url(#a6Blue)"/>

  <text x="26" y="176" font-size="8.5" fill="#4A4945">指针数组：每个元素垂直对应一个字符串（三个格子三个地址）</text>
  <rect x="30" y="184" width="48" height="26" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="54" y="201" font-size="7.5" fill="#1F4468" text-anchor="middle">names[0]</text>
  <rect x="86" y="184" width="48" height="26" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="110" y="201" font-size="7.5" fill="#1F4468" text-anchor="middle">names[1]</text>
  <rect x="142" y="184" width="48" height="26" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="166" y="201" font-size="7.5" fill="#1F4468" text-anchor="middle">names[2]</text>
  <line x1="54" y1="212" x2="54" y2="224" stroke="#7FA6D0" marker-end="url(#a6Blue)"/>
  <line x1="110" y1="212" x2="110" y2="224" stroke="#7FA6D0" marker-end="url(#a6Blue)"/>
  <line x1="166" y1="212" x2="166" y2="224" stroke="#7FA6D0" marker-end="url(#a6Blue)"/>
  <rect x="30" y="228" width="48" height="26" rx="3" fill="#FFFFFF" stroke="#CFCCC2"/>
  <text x="54" y="245" font-size="7.5" fill="#4A4945" text-anchor="middle">zhang</text>
  <rect x="86" y="228" width="48" height="26" rx="3" fill="#FFFFFF" stroke="#CFCCC2"/>
  <text x="110" y="245" font-size="7.5" fill="#4A4945" text-anchor="middle">wang</text>
  <rect x="142" y="228" width="48" height="26" rx="3" fill="#FFFFFF" stroke="#CFCCC2"/>
  <text x="166" y="245" font-size="7.5" fill="#4A4945" text-anchor="middle">li</text>

  <text x="26" y="274" font-size="8.5" fill="#4A4945">函数指针：op 存函数入口地址，op(2,3) 就是调 add</text>
  <rect x="30" y="282" width="76" height="28" rx="3" fill="#ECE7F7" stroke="#9C8ACB"/>
  <text x="68" y="300" font-size="8.5" fill="#46337A" text-anchor="middle">op = add</text>
  <rect x="150" y="282" width="110" height="28" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="205" y="300" font-size="8" fill="#1F4468" text-anchor="middle">int add(int, int) {…}</text>
  <line x1="106" y1="296" x2="146" y2="296" stroke="#9C8ACB" marker-end="url(#a6Purple)"/>

  <!-- 右半：五种声明对照 -->
  <rect x="352" y="44" width="310" height="272" rx="3" fill="#F4F2EC" stroke="#CFCCC2"/>
  <text x="360" y="60" font-size="8.5" fill="#4A4945">五种声明对照（[] 优先级高于 *，括号定身份）</text>
  <rect x="360" y="70" width="294" height="44" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="370" y="88" font-size="8.5" fill="#1F4468">int **p —— 二级指针</text>
  <text x="370" y="104" font-size="7.5" fill="#4A4945">存一级指针的地址；解两次星星才到数据</text>
  <rect x="360" y="120" width="294" height="44" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="370" y="138" font-size="8.5" fill="#1F4468">int (*p)[5] —— 数组指针</text>
  <text x="370" y="154" font-size="7.5" fill="#4A4945">指向数组整体；必须 &amp;arr；p+1 跨整个数组</text>
  <rect x="360" y="170" width="294" height="44" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="370" y="188" font-size="8.5" fill="#1F4468">int *p[3] —— 指针数组</text>
  <text x="370" y="204" font-size="7.5" fill="#4A4945">是数组，装 3 个指针；典型用途字符串数组</text>
  <rect x="360" y="220" width="294" height="44" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="370" y="238" font-size="8.5" fill="#1F4468">int (*p)() —— 函数指针</text>
  <text x="370" y="254" font-size="7.5" fill="#4A4945">指向函数；回调的载体（§6.4）</text>
  <rect x="360" y="270" width="294" height="44" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="370" y="288" font-size="8.5" fill="#1F4468">int *f() —— 指针函数</text>
  <text x="370" y="304" font-size="7.5" fill="#4A4945">是函数，返回指针；别返回局部变量地址</text>

  <rect x="18" y="328" width="644" height="36" rx="3" fill="#FBEEDA" stroke="#D9A458"/>
  <text x="32" y="351" font-size="9.5" font-weight="600" fill="#7A4A12">步长铁律：指针 +1 走"指向类型"的宽度——int* 走 4 字节、char* 走 1 字节、数组指针走整个数组（§6.1 实测）</text>
  <text x="32" y="382" font-size="8" fill="#8C8980">口径 C17 · 全部声明可由 §6.3 实测程序验证 · 2026-11-19</text>
</svg>
