<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 574"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="1200" height="574" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="20" font-weight="bold" fill="#263238">006 · 指针家族：箭头 = 「存的是谁的地址」</text>
  <text x="1160" y="46" font-size="12" fill="#616161" text-anchor="end">来源：006 §6.3/§6.4/§6.6 · C17 · 2026-11-19</text>

  <rect x="40" y="70" width="540" height="196" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="98" font-size="15" font-weight="bold" fill="#1b5e20">二级指针：p2 存 p1 的地址</text>
  <text x="60" y="120" font-size="11.5" fill="#37474f" font-family="ui-monospace,Menlo,Consolas,monospace">int num = 100; int *p1 = &amp;num; int **p2 = &amp;p1;</text>

  <rect x="60" y="140" width="120" height="56" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="120" y="164" font-size="11" fill="#2e5230" text-anchor="middle">num</text>
  <text x="120" y="186" font-size="17" font-weight="bold" fill="#123314" text-anchor="middle">100</text>

  <rect x="250" y="140" width="120" height="56" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <text x="310" y="164" font-size="11" fill="#7f3f00" text-anchor="middle">p1</text>
  <text x="310" y="186" font-size="12" fill="#7f3f00" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">&amp;num</text>

  <rect x="440" y="140" width="120" height="56" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <text x="500" y="164" font-size="11" fill="#7f3f00" text-anchor="middle">p2</text>
  <text x="500" y="186" font-size="12" fill="#7f3f00" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">&amp;p1</text>

  <line x1="246" y1="168" x2="184" y2="168" stroke="#e65100" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="436" y1="168" x2="374" y2="168" stroke="#e65100" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="60" y="228" font-size="11.5" fill="#616161">解引用两次才拿到 100：**p2；每多一级就多解一层</text>
  <text x="60" y="250" font-size="11.5" fill="#616161">典型用途：函数里要改「指针本身」时才需要它</text>

  <rect x="620" y="70" width="540" height="196" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="640" y="98" font-size="15" font-weight="bold" fill="#0d47a1">数组指针：p 存整个数组的地址</text>
  <text x="640" y="120" font-size="11.5" fill="#37474f" font-family="ui-monospace,Menlo,Consolas,monospace">int arr[5]; int (*p)[5] = &amp;arr;</text>

  <rect x="640" y="140" width="92" height="56" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="742" y="140" width="92" height="56" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="844" y="140" width="92" height="56" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="946" y="140" width="92" height="56" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="1048" y="140" width="92" height="56" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="686" y="174" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">1</text>
  <text x="788" y="174" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">2</text>
  <text x="890" y="174" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">3</text>
  <text x="992" y="174" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">4</text>
  <text x="1094" y="174" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">5</text>

  <path d="M 640 202 L 640 230 L 1126 230" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="890" y="220" font-size="11.5" fill="#1565c0" text-anchor="middle">p 指向整块 20 字节</text>
  <text x="640" y="250" font-size="11.5" fill="#616161">p + 1 跨越整个数组（20 字节），不是 4 字节——这是与 int* 的关键差别</text>

  <rect x="40" y="286" width="540" height="196" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="314" font-size="15" font-weight="bold" fill="#1b5e20">指针数组：每个元素存一个字符串地址</text>
  <text x="60" y="336" font-size="11.5" fill="#37474f" font-family="ui-monospace,Menlo,Consolas,monospace">const char *names[3] = {&quot;zhang&quot;,&quot;wang&quot;,&quot;li&quot;};</text>

  <rect x="60" y="356" width="160" height="48" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <rect x="230" y="356" width="160" height="48" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <rect x="400" y="356" width="160" height="48" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="140" y="386" font-size="11.5" fill="#5d4700" text-anchor="middle">names[0]</text>
  <text x="310" y="386" font-size="11.5" fill="#5d4700" text-anchor="middle">names[1]</text>
  <text x="480" y="386" font-size="11.5" fill="#5d4700" text-anchor="middle">names[2]</text>

  <line x1="140" y1="406" x2="140" y2="422" stroke="#607d8b" stroke-width="2"/>
  <line x1="310" y1="406" x2="310" y2="422" stroke="#607d8b" stroke-width="2"/>
  <line x1="480" y1="406" x2="480" y2="422" stroke="#607d8b" stroke-width="2"/>
  <text x="140" y="442" font-size="13" fill="#123314" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">zhang</text>
  <text x="310" y="442" font-size="13" fill="#123314" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">wang</text>
  <text x="480" y="442" font-size="13" fill="#123314" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">li</text>
  <text x="60" y="470" font-size="11.5" fill="#616161">数组本身占 24 字节（3 × 8），字符串另存在只读区</text>

  <rect x="620" y="286" width="540" height="196" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="640" y="314" font-size="15" font-weight="bold" fill="#0d47a1">函数指针：op 存函数的入口地址</text>
  <text x="640" y="336" font-size="11.5" fill="#37474f" font-family="ui-monospace,Menlo,Consolas,monospace">int (*op)(int,int) = add;   op(2,3);</text>

  <rect x="640" y="356" width="180" height="56" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <text x="730" y="380" font-size="13" font-weight="bold" fill="#7f3f00" text-anchor="middle">op</text>
  <text x="730" y="400" font-size="11.5" fill="#7f3f00" text-anchor="middle">= add</text>

  <line x1="824" y1="384" x2="876" y2="384" stroke="#e65100" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <rect x="880" y="350" width="260" height="68" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="898" y="374" font-size="12" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">int add(int a,int b)</text>
  <text x="898" y="396" font-size="11.5" fill="#1b3d1e">编译后这段机器码的入口</text>
  <text x="640" y="446" font-size="11.5" fill="#616161">op(2,3) 与 add(2,3) 完全等价——回调函数就是这么传的</text>

  <rect x="40" y="502" width="1120" height="44" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="62" y="530" font-size="13" font-weight="bold" fill="#5d4037">四种写法拆的是「谁指向谁」：多一级、指向整块、装地址的数组、指向代码——语法长相不同，本质都是存地址</text>

  <rect x="40" y="552" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="72" y="564" font-size="12" fill="#37474f">被指向的数据</text>
  <rect x="200" y="552" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <text x="232" y="564" font-size="12" fill="#37474f">指针变量</text>
  <rect x="360" y="552" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="392" y="564" font-size="12" fill="#37474f">指针数组的元素</text>
  <line x1="560" y1="559" x2="602" y2="559" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="614" y="564" font-size="12" fill="#37474f">指向关系</text>
</svg>
