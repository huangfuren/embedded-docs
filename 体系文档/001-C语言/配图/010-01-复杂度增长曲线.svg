<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 472"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="1200" height="472" fill="#ffffff"/>

  <text x="40" y="46" font-size="20" font-weight="bold" fill="#263238">010 · 六种阶的增长曲线：规模变大时谁先撑不住</text>
  <text x="1160" y="46" font-size="12" fill="#616161" text-anchor="end">来源：010 §10.1 ds_complexity 实测 n=1000 · C17 · 2026-11-19</text>

  <text x="40" y="86" font-size="12" fill="#37474f">曲线是示意（非等比例尺），重点看形状：谁在 n 变大时陡得最快</text>

  <text x="92" y="112" font-size="12" fill="#616161" text-anchor="end">操作次数</text>
  <line x1="100" y1="105" x2="100" y2="330" stroke="#607d8b" stroke-width="2"/>
  <line x1="100" y1="330" x2="870" y2="330" stroke="#607d8b" stroke-width="2"/>
  <text x="880" y="336" font-size="12" fill="#616161">问题规模 n</text>

  <path d="M 100 318 L 860 318" fill="none" stroke="#90a4ae" stroke-width="2"/>
  <path d="M 100 318 Q 400 304 860 288" fill="none" stroke="#388e3c" stroke-width="2"/>
  <path d="M 100 318 Q 400 286 860 256" fill="none" stroke="#1565c0" stroke-width="2"/>
  <path d="M 100 318 L 860 222" fill="none" stroke="#f9a825" stroke-width="2"/>
  <path d="M 100 318 Q 600 272 860 160" fill="none" stroke="#5e35b1" stroke-width="2"/>
  <path d="M 100 318 Q 700 306 862 118" fill="none" stroke="#c62828" stroke-width="2"/>

  <text x="700" y="308" font-size="11.5" fill="#546e7a">O(1) 常数</text>
  <text x="700" y="280" font-size="11.5" fill="#388e3c">O(log n)</text>
  <text x="640" y="244" font-size="11.5" fill="#1565c0">O(√n)</text>
  <text x="500" y="228" font-size="11.5" fill="#8d6e00">O(n)</text>
  <text x="742" y="196" font-size="11.5" fill="#5e35b1">O(n log n)</text>
  <text x="770" y="146" font-size="11.5" fill="#c62828">O(n²)</text>

  <rect x="640" y="330" width="240" height="46" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="658" y="350" font-size="11" fill="#37474f">n 翻倍：O(n) 翻倍</text>
  <text x="658" y="368" font-size="11" fill="#37474f">O(n²) 变 4 倍，O(n³) 变 8 倍</text>

  <rect x="40" y="390" width="1120" height="34" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="62" y="412" font-size="13" font-weight="bold" fill="#5d4037">选算法先看阶：n 小的时候差不多，n 一大就只剩低阶的还跑得动</text>

  <line x1="40" y1="457" x2="82" y2="457" stroke="#90a4ae" stroke-width="2"/>
  <text x="94" y="462" font-size="12" fill="#37474f">O(1)</text>
  <line x1="180" y1="457" x2="222" y2="457" stroke="#388e3c" stroke-width="2"/>
  <text x="234" y="462" font-size="12" fill="#37474f">O(log n)</text>
  <line x1="340" y1="457" x2="382" y2="457" stroke="#1565c0" stroke-width="2"/>
  <text x="394" y="462" font-size="12" fill="#37474f">O(√n)</text>
  <line x1="490" y1="457" x2="532" y2="457" stroke="#f9a825" stroke-width="2"/>
  <text x="544" y="462" font-size="12" fill="#37474f">O(n)</text>
  <line x1="640" y1="457" x2="682" y2="457" stroke="#5e35b1" stroke-width="2"/>
  <text x="694" y="462" font-size="12" fill="#37474f">O(n log n)</text>
  <line x1="830" y1="457" x2="872" y2="457" stroke="#c62828" stroke-width="2"/>
  <text x="884" y="462" font-size="12" fill="#37474f">O(n²)</text>
</svg>
