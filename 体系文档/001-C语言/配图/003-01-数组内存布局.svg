<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>

  <text x="40" y="46" font-size="20" font-weight="bold" fill="#1b5e20">003 · 数组内存布局：一段连续内存 + 从 0 起的下标</text>
  <text x="1160" y="46" font-size="12" fill="#616161" text-anchor="end">来源：003 §3.1/§3.2 本机实测 · C17 · 2026-11-19</text>

  <text x="40" y="98" font-size="17" font-weight="bold" fill="#1b5e20">一维：int arr[5] = {10, 20, 30, 40, 50}</text>

  <text x="155" y="122" font-size="12" fill="#616161" text-anchor="middle">[0]</text>
  <text x="315" y="122" font-size="12" fill="#616161" text-anchor="middle">[1]</text>
  <text x="475" y="122" font-size="12" fill="#616161" text-anchor="middle">[2]</text>
  <text x="635" y="122" font-size="12" fill="#616161" text-anchor="middle">[3]</text>
  <text x="795" y="122" font-size="12" fill="#616161" text-anchor="middle">[4]</text>

  <rect x="80" y="130" width="150" height="72" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="240" y="130" width="150" height="72" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="400" y="130" width="150" height="72" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="560" y="130" width="150" height="72" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="720" y="130" width="150" height="72" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="155" y="174" font-size="20" font-weight="bold" fill="#123314" text-anchor="middle">10</text>
  <text x="315" y="174" font-size="20" font-weight="bold" fill="#123314" text-anchor="middle">20</text>
  <text x="475" y="174" font-size="20" font-weight="bold" fill="#123314" text-anchor="middle">30</text>
  <text x="635" y="174" font-size="20" font-weight="bold" fill="#123314" text-anchor="middle">40</text>
  <text x="795" y="174" font-size="20" font-weight="bold" fill="#123314" text-anchor="middle">50</text>

  <text x="230" y="222" font-size="11.5" fill="#388e3c" text-anchor="middle">+4</text>
  <text x="390" y="222" font-size="11.5" fill="#388e3c" text-anchor="middle">+4</text>
  <text x="550" y="222" font-size="11.5" fill="#388e3c" text-anchor="middle">+4</text>
  <text x="710" y="222" font-size="11.5" fill="#388e3c" text-anchor="middle">+4</text>
  <text x="100" y="222" font-size="11.5" fill="#616161" text-anchor="middle">首地址</text>

  <rect x="900" y="130" width="260" height="92" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="920" y="156" font-size="13" font-weight="bold" fill="#263238">为什么地址差恒为 4</text>
  <text x="920" y="180" font-size="11.5" fill="#37474f">int 占 4 字节，元素等距紧排</text>
  <text x="920" y="200" font-size="11.5" fill="#37474f">下标 × 4 = 字节偏移</text>

  <text x="40" y="292" font-size="17" font-weight="bold" fill="#1b5e20">二维：int arr[2][3] = {{1,2,3},{4,5,6}} —— 内存里仍是一条线</text>

  <text x="155" y="336" font-size="11.5" fill="#616161" text-anchor="middle">[0][0]</text>
  <text x="315" y="336" font-size="11.5" fill="#616161" text-anchor="middle">[0][1]</text>
  <text x="475" y="336" font-size="11.5" fill="#616161" text-anchor="middle">[0][2]</text>
  <text x="155" y="420" font-size="11.5" fill="#616161" text-anchor="middle">[1][0]</text>
  <text x="315" y="420" font-size="11.5" fill="#616161" text-anchor="middle">[1][1]</text>
  <text x="475" y="420" font-size="11.5" fill="#616161" text-anchor="middle">[1][2]</text>

  <rect x="80" y="344" width="150" height="62" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="240" y="344" width="150" height="62" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="400" y="344" width="150" height="62" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="80" y="430" width="150" height="62" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="240" y="430" width="150" height="62" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="400" y="430" width="150" height="62" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="155" y="384" font-size="20" font-weight="bold" fill="#123314" text-anchor="middle">1</text>
  <text x="315" y="384" font-size="20" font-weight="bold" fill="#123314" text-anchor="middle">2</text>
  <text x="475" y="384" font-size="20" font-weight="bold" fill="#123314" text-anchor="middle">3</text>
  <text x="155" y="470" font-size="20" font-weight="bold" fill="#123314" text-anchor="middle">4</text>
  <text x="315" y="470" font-size="20" font-weight="bold" fill="#123314" text-anchor="middle">5</text>
  <text x="475" y="470" font-size="20" font-weight="bold" fill="#123314" text-anchor="middle">6</text>

  <rect x="600" y="344" width="560" height="150" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="620" y="372" font-size="13" font-weight="bold" fill="#263238">行优先：第 0 行铺完，紧接着铺第 1 行</text>
  <text x="620" y="398" font-size="12" fill="#37474f">内存里没有「二维」——只有 6 个连续格子</text>
  <text x="620" y="422" font-size="12" fill="#37474f">首元素地址 == 整个数组地址 == 第 0 行地址</text>
  <text x="620" y="446" font-size="12" fill="#37474f">三个身份不同，值是同一个数（005 §5.3）</text>
  <text x="620" y="470" font-size="12" fill="#37474f">用元素指针连续走 6 步，正好按行铺完</text>

  <rect x="40" y="516" width="1120" height="58" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="62" y="540" font-size="13" font-weight="bold" fill="#5d4037">两条判据：最大索引 = 长度 − 1（arr[5] 已越界） ｜ arr[2] ≡ *(arr + 2)，下标就是地址运算</text>
  <text x="62" y="562" font-size="12" fill="#5d4037">长度公式 sizeof(arr)/sizeof(arr[0]) 只在定义处有效——传参后 arr 退化为指针，算出来是 2</text>

  <rect x="40" y="594" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="72" y="606" font-size="12" fill="#37474f">数组元素（连续存放）</text>
  <text x="240" y="606" font-size="12" fill="#37474f">+4 = 相邻元素的字节偏移，不是「加 4 个元素」</text>
</svg>
