<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="529.41" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>结构体对齐与重排</title>
  <desc>007-结构体位域与预处理：成员偏移、padding 与重排收益（12→8 本机实测）（680 内部坐标系 x 1.764706）</desc>
  <rect x="0" y="0" width="680" height="300" fill="#FFFFFF"/>
  <defs>
    <marker id="a7Blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA6D0"/>
    </marker>
  </defs>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">007 · 内存对齐：padding 从哪来、重排省多少</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">来源：007 §7.1/§7.5 本机实测 · 2026-11-19</text>

  <!-- 声明顺序：12 字节 -->
  <text x="26" y="58" font-size="9" fill="#4A4945">按声明顺序 {char c1; int n; char c2} —— 本机 sizeof = 12 字节（偏移：c1@0 n@4 c2@8）</text>
  <rect x="26" y="66" width="24" height="32" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="38" y="86" font-size="7.5" fill="#1F4468" text-anchor="middle">c1</text>
  <rect x="50" y="66" width="72" height="32" fill="#FAE6E4" stroke="#D2948C"/>
  <text x="86" y="86" font-size="7.5" fill="#7A322B" text-anchor="middle">pad×3</text>
  <rect x="122" y="66" width="96" height="32" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="170" y="86" font-size="7.5" fill="#1F4468" text-anchor="middle">n@4</text>
  <rect x="218" y="66" width="24" height="32" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="230" y="86" font-size="7.5" fill="#1F4468" text-anchor="middle">c2</text>
  <rect x="242" y="66" width="72" height="32" fill="#FAE6E4" stroke="#D2948C"/>
  <text x="278" y="86" font-size="7.5" fill="#7A322B" text-anchor="middle">pad×3</text>
  <text x="330" y="72" font-size="8" fill="#4A4945">n 是 int（4 字节），必须住在 4 的倍数地址上</text>
  <text x="330" y="90" font-size="8" fill="#7A322B">两段 padding 共 6 字节——浪费了整整一半</text>

  <!-- 重排箭头 -->
  <line x1="170" y1="104" x2="170" y2="134" stroke="#7FA6D0" marker-end="url(#a7Blue)"/>
  <text x="182" y="124" font-size="8.5" fill="#1F4468">成员从大到小重排 —— 不改任何逻辑，白捡的优化</text>

  <!-- 重排后：8 字节 -->
  <text x="26" y="152" font-size="9" fill="#4A4945">重排后 {int n; char c1; char c2} —— 本机 sizeof = 8 字节</text>
  <rect x="26" y="160" width="96" height="32" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="74" y="180" font-size="7.5" fill="#1F4468" text-anchor="middle">n@0</text>
  <rect x="122" y="160" width="24" height="32" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="134" y="180" font-size="7.5" fill="#1F4468" text-anchor="middle">c1@4</text>
  <rect x="146" y="160" width="24" height="32" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="158" y="180" font-size="7.5" fill="#1F4468" text-anchor="middle">c2@5</text>
  <rect x="170" y="160" width="48" height="32" fill="#FAE6E4" stroke="#D2948C"/>
  <text x="194" y="180" font-size="7.5" fill="#7A322B" text-anchor="middle">padding×2</text>
  <text x="330" y="172" font-size="8" fill="#1D5A45">12 → 8：同样三个成员，只换声明顺序</text>
  <text x="330" y="188" font-size="8" fill="#1D5A45">通信协议报文才用 pack(1)=6，代价是跨边界访问慢</text>

  <!-- 本机实录对照 -->
  <rect x="26" y="208" width="636" height="46" rx="3" fill="#F4F2EC" stroke="#CFCCC2"/>
  <text x="36" y="226" font-size="8.5" fill="#4A4945">本机实录：offsetof(Student1{char,char,int}) = 0/1/4，sizeof=8 | Student2{char,int,char} = 0/4/8，sizeof=12 | pack(4) 的 {int,double,char} = 16（默认 24）</text>
  <text x="36" y="244" font-size="8" fill="#8C8980">两准则：① 成员偏移量是其自身大小的整数倍 ② 结构体总大小是最大成员大小的整数倍——两准则 + 偏移量公式，任何 struct 的 sizeof 都能纸上算出</text>

  <rect x="18" y="264" width="644" height="36" rx="3" fill="#FBEEDA" stroke="#D9A458"/>
  <text x="32" y="287" font-size="9.5" font-weight="600" fill="#7A4A12">嵌入式内存紧张时：成员按"从大到小"重排是白捡的优化；pack(1) 只留给通信报文解析</text>
</svg>
