<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="1200" height="590" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="20" font-weight="bold" fill="#263238">011 · 链表三种操作：改的永远只有两个指针</text>
  <text x="1160" y="46" font-size="12" fill="#616161" text-anchor="end">来源：011 §11.2 ds_list.c 本机实测 · C17 · 2026-11-19</text>

  <text x="40" y="86" font-size="12" fill="#37474f">橙色 = 本次新建的节点，红色 = 本次要摘除的节点；每个操作只动两个指针，赋值顺序不能颠倒</text>

  <rect x="40" y="110" width="140" height="96" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="110" y="146" font-size="15" font-weight="bold" fill="#7f3f00" text-anchor="middle">① 头插</text>
  <text x="110" y="170" font-size="11.5" fill="#5d4700" text-anchor="middle">index = 0</text>
  <text x="110" y="190" font-size="11.5" fill="#5d4700" text-anchor="middle">改 header</text>

  <rect x="200" y="132" width="110" height="52" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <line x1="255" y1="132" x2="255" y2="184" stroke="#e65100" stroke-width="1"/>
  <text x="227" y="164" font-size="15" font-weight="bold" fill="#7f3f00" text-anchor="middle">5</text>
  <text x="282" y="164" font-size="11.5" fill="#7f3f00" text-anchor="middle">·</text>
  <text x="227" y="202" font-size="11" fill="#7f3f00" text-anchor="middle">新节点 N</text>
  <line x1="312" y1="158" x2="326" y2="158" stroke="#e65100" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <rect x="330" y="132" width="110" height="52" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <line x1="385" y1="132" x2="385" y2="184" stroke="#2e7d32" stroke-width="1"/>
  <text x="357" y="164" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">10</text>
  <text x="412" y="164" font-size="11.5" fill="#2e5230" text-anchor="middle">·</text>
  <line x1="442" y1="158" x2="476" y2="158" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="480" y="132" width="110" height="52" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <line x1="535" y1="132" x2="535" y2="184" stroke="#2e7d32" stroke-width="1"/>
  <text x="507" y="164" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">20</text>
  <line x1="592" y1="158" x2="626" y2="158" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="636" y="164" font-size="12" fill="#616161" font-family="ui-monospace,Menlo,Consolas,monospace">NULL</text>

  <text x="780" y="150" font-size="12" fill="#263238" font-family="ui-monospace,Menlo,Consolas,monospace">① N-&gt;next = list-&gt;header</text>
  <text x="780" y="176" font-size="12" fill="#263238" font-family="ui-monospace,Menlo,Consolas,monospace">② list-&gt;header = N</text>
  <text x="780" y="200" font-size="11.5" fill="#616161">先接旧头，再改头——顺序反了新头就断了</text>

  <rect x="40" y="240" width="140" height="96" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="110" y="276" font-size="15" font-weight="bold" fill="#7f3f00" text-anchor="middle">② 中插</text>
  <text x="110" y="300" font-size="11.5" fill="#5d4700" text-anchor="middle">A 之后</text>
  <text x="110" y="320" font-size="11.5" fill="#5d4700" text-anchor="middle">改 A 的 next</text>

  <rect x="200" y="262" width="110" height="52" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <line x1="255" y1="262" x2="255" y2="314" stroke="#2e7d32" stroke-width="1"/>
  <text x="227" y="294" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">10</text>
  <text x="282" y="294" font-size="11.5" fill="#2e5230" text-anchor="middle">·</text>
  <text x="227" y="332" font-size="11" fill="#123314" text-anchor="middle">A</text>
  <line x1="312" y1="288" x2="326" y2="288" stroke="#e65100" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <rect x="330" y="262" width="110" height="52" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <line x1="385" y1="262" x2="385" y2="314" stroke="#e65100" stroke-width="1"/>
  <text x="357" y="294" font-size="15" font-weight="bold" fill="#7f3f00" text-anchor="middle">5</text>
  <text x="412" y="294" font-size="11.5" fill="#7f3f00" text-anchor="middle">·</text>
  <text x="357" y="332" font-size="11" fill="#7f3f00" text-anchor="middle">新节点 N</text>
  <line x1="442" y1="288" x2="476" y2="288" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="480" y="262" width="110" height="52" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <line x1="535" y1="262" x2="535" y2="314" stroke="#2e7d32" stroke-width="1"/>
  <text x="507" y="294" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">20</text>
  <line x1="592" y1="288" x2="626" y2="288" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="636" y="294" font-size="12" fill="#616161" font-family="ui-monospace,Menlo,Consolas,monospace">NULL</text>

  <text x="780" y="280" font-size="12" fill="#263238" font-family="ui-monospace,Menlo,Consolas,monospace">① N-&gt;next = A-&gt;next</text>
  <text x="780" y="306" font-size="12" fill="#263238" font-family="ui-monospace,Menlo,Consolas,monospace">② A-&gt;next = N</text>
  <text x="780" y="330" font-size="11.5" fill="#616161">先把 A 的后继交给 N，再让 A 指向 N</text>

  <rect x="40" y="370" width="140" height="104" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="110" y="406" font-size="15" font-weight="bold" fill="#7f0000" text-anchor="middle">③ 删除</text>
  <text x="110" y="430" font-size="11.5" fill="#7f0000" text-anchor="middle">摘掉 B</text>
  <text x="110" y="450" font-size="11.5" fill="#7f0000" text-anchor="middle">别忘 free</text>

  <rect x="200" y="392" width="110" height="52" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <line x1="255" y1="392" x2="255" y2="444" stroke="#2e7d32" stroke-width="1"/>
  <text x="227" y="424" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">10</text>
  <text x="282" y="424" font-size="11.5" fill="#2e5230" text-anchor="middle">·</text>
  <text x="227" y="462" font-size="11" fill="#123314" text-anchor="middle">A</text>

  <rect x="330" y="392" width="110" height="52" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <line x1="385" y1="392" x2="385" y2="444" stroke="#c62828" stroke-width="1"/>
  <text x="357" y="424" font-size="15" font-weight="bold" fill="#7f0000" text-anchor="middle">20</text>
  <line x1="442" y1="418" x2="476" y2="418" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="480" y="392" width="110" height="52" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <line x1="535" y1="392" x2="535" y2="444" stroke="#2e7d32" stroke-width="1"/>
  <text x="507" y="424" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">30</text>
  <line x1="592" y1="418" x2="626" y2="418" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="636" y="424" font-size="12" fill="#616161" font-family="ui-monospace,Menlo,Consolas,monospace">NULL</text>
  <text x="507" y="462" font-size="11" fill="#123314" text-anchor="middle">C</text>
  <text x="357" y="462" font-size="11" fill="#7f0000" text-anchor="middle">B（待删）</text>

  <path d="M 260 386 Q 390 350 512 386" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="386" y="356" font-size="11.5" fill="#c62828" text-anchor="middle">② 改指 C</text>

  <text x="780" y="402" font-size="12" fill="#263238" font-family="ui-monospace,Menlo,Consolas,monospace">① del = A-&gt;next</text>
  <text x="780" y="426" font-size="12" fill="#263238" font-family="ui-monospace,Menlo,Consolas,monospace">② A-&gt;next = del-&gt;next</text>
  <text x="780" y="450" font-size="12" fill="#c62828" font-family="ui-monospace,Menlo,Consolas,monospace">③ free(del)</text>
  <text x="780" y="470" font-size="11.5" fill="#616161">漏 ③ 就是内存泄漏</text>

  <rect x="40" y="486" width="1120" height="52" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="62" y="518" font-size="13" font-weight="bold" fill="#5d4037">共同规律：先让新节点接住后继，再让前驱改指——顺序颠倒就会断链或丢节点</text>

  <rect x="40" y="562" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="72" y="574" font-size="12" fill="#37474f">已有节点</text>
  <rect x="200" y="562" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <text x="232" y="574" font-size="12" fill="#37474f">新建节点</text>
  <rect x="360" y="562" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="392" y="574" font-size="12" fill="#37474f">待删除节点</text>
  <line x1="540" y1="569" x2="582" y2="569" stroke="#c62828" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="594" y="574" font-size="12" fill="#37474f">删后的新指向</text>
  <rect x="760" y="562" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="792" y="574" font-size="12" fill="#37474f">操作类型与改动位置</text>
</svg>
