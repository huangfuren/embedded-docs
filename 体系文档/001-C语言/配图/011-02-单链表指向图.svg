<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="1200" height="510" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="20" font-weight="bold" fill="#263238">011 · 单链表：箭头 = 指针域里存的地址</text>
  <text x="1160" y="46" font-size="12" fill="#616161" text-anchor="end">来源：011 §11.2 ds_list 本机实测 · C17 · 2026-11-19</text>

  <text x="40" y="86" font-size="12" fill="#37474f">节点 = 数据域 + 指针域；header 存首节点地址（NULL 即空表），节点之间不连续</text>

  <text x="40" y="118" font-size="17" font-weight="bold" fill="#1b5e20">链表长什么样</text>

  <rect x="40" y="136" width="90" height="52" rx="6" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <text x="85" y="168" font-size="13" font-weight="bold" fill="#37474f" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">header</text>
  <line x1="132" y1="162" x2="172" y2="162" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="180" y="136" width="110" height="52" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <line x1="235" y1="136" x2="235" y2="188" stroke="#2e7d32" stroke-width="1"/>
  <text x="207" y="168" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">10</text>
  <text x="262" y="168" font-size="11.5" fill="#2e5230" text-anchor="middle">·</text>
  <line x1="292" y1="162" x2="326" y2="162" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="330" y="136" width="110" height="52" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <line x1="385" y1="136" x2="385" y2="188" stroke="#2e7d32" stroke-width="1"/>
  <text x="357" y="168" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">20</text>
  <text x="412" y="168" font-size="11.5" fill="#2e5230" text-anchor="middle">·</text>
  <line x1="442" y1="162" x2="476" y2="162" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="480" y="136" width="110" height="52" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <line x1="535" y1="136" x2="535" y2="188" stroke="#2e7d32" stroke-width="1"/>
  <text x="507" y="168" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">30</text>
  <line x1="592" y1="162" x2="626" y2="162" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="636" y="168" font-size="12" fill="#616161" font-family="ui-monospace,Menlo,Consolas,monospace">NULL</text>

  <text x="180" y="208" font-size="11" fill="#616161">data 域</text>
  <text x="240" y="208" font-size="11" fill="#616161">next 域</text>
  <text x="180" y="226" font-size="11.5" fill="#37474f">访问第 3 个节点：从 header 顺 next 走三步 —— 链表没有「按下标直达」</text>

  <rect x="800" y="132" width="360" height="96" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="820" y="158" font-size="13" font-weight="bold" fill="#263238">链表的代价</text>
  <text x="820" y="182" font-size="11.5" fill="#37474f">每节点多一个指针域（64 位平台 8 字节）</text>
  <text x="820" y="204" font-size="11.5" fill="#37474f">换来的是：插入删除不必搬动其他节点</text>

  <text x="40" y="266" font-size="17" font-weight="bold" fill="#1b5e20">头插 index = 0：只改两个指针，不搬任何已有节点</text>

  <rect x="40" y="288" width="90" height="52" rx="6" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <text x="85" y="320" font-size="13" font-weight="bold" fill="#37474f" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">header</text>
  <line x1="132" y1="314" x2="172" y2="314" stroke="#e65100" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <rect x="180" y="288" width="110" height="52" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <line x1="235" y1="288" x2="235" y2="340" stroke="#e65100" stroke-width="1"/>
  <text x="207" y="320" font-size="15" font-weight="bold" fill="#7f3f00" text-anchor="middle">5</text>
  <text x="262" y="320" font-size="11.5" fill="#7f3f00" text-anchor="middle">·</text>
  <text x="207" y="358" font-size="11" fill="#7f3f00" text-anchor="middle">新节点 N</text>
  <line x1="292" y1="314" x2="326" y2="314" stroke="#e65100" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <rect x="330" y="288" width="110" height="52" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <line x1="385" y1="288" x2="385" y2="340" stroke="#2e7d32" stroke-width="1"/>
  <text x="357" y="320" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">10</text>
  <text x="412" y="320" font-size="11.5" fill="#2e5230" text-anchor="middle">·</text>
  <line x1="442" y1="314" x2="476" y2="314" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="480" y="288" width="110" height="52" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <line x1="535" y1="288" x2="535" y2="340" stroke="#2e7d32" stroke-width="1"/>
  <text x="507" y="320" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">20</text>
  <line x1="592" y1="314" x2="626" y2="314" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="636" y="320" font-size="12" fill="#616161" font-family="ui-monospace,Menlo,Consolas,monospace">NULL</text>

  <text x="764" y="306" font-size="11.5" fill="#37474f">旧头 A、B 一格没动</text>
  <text x="764" y="328" font-size="11.5" fill="#37474f">新节点插在最前面</text>

  <rect x="40" y="380" width="540" height="30" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="56" y="400" font-size="12" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">① N-&gt;next = list-&gt;header</text>
  <text x="330" y="400" font-size="11.5" fill="#1b3d1e">先让新节点接住旧头</text>

  <rect x="600" y="380" width="560" height="30" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="616" y="400" font-size="12" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">② list-&gt;header = N</text>
  <text x="800" y="400" font-size="11.5" fill="#1b3d1e">再让头指向新节点（顺序反了就丢链）</text>

  <rect x="40" y="426" width="1120" height="52" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="62" y="458" font-size="13" font-weight="bold" fill="#5d4037">链表的所有操作都归结为一句话：先接住后继，再改前驱——顺序颠倒就是断链</text>

  <rect x="40" y="490" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="72" y="502" font-size="12" fill="#37474f">已有节点</text>
  <rect x="200" y="490" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <text x="232" y="502" font-size="12" fill="#37474f">本次新建节点</text>
  <rect x="380" y="490" width="22" height="14" rx="3" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <text x="412" y="502" font-size="12" fill="#37474f">header（存首节点地址）</text>
  <rect x="620" y="490" width="22" height="14" rx="3" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="652" y="502" font-size="12" fill="#37474f">操作步骤（顺序不可颠倒）</text>
</svg>
