<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="705.88" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>内存四区与释放责任</title>
  <desc>005-指针与内存模型：四区的成员归属、自动/手动两种释放责任分组（680 内部坐标系 x 1.764706）</desc>
  <rect x="0" y="0" width="680" height="400" fill="#FFFFFF"/>
  <defs>
    <marker id="a5Blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA6D0"/>
    </marker>
    <marker id="a5Amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9A458"/>
    </marker>
  </defs>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">005 · 内存四区：变量住哪、谁管释放</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">来源：005 §5.4 memzones.c 本机实测 · 2026-11-19</text>

  <!-- 左：四区（按释放责任分两组） -->
  <text x="18" y="52" font-size="8.5" fill="#1D5A45">自动区 —— 编译器管，写代码不用操心回收</text>
  <rect x="18" y="58" width="400" height="48" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="30" y="76" font-size="9.5" fill="#1F4468">代码段</text>
  <text x="30" y="92" font-size="8" fill="#4A4945">机器码 · 字符串字面量 "hi"（只读）</text>
  <rect x="18" y="112" width="400" height="48" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="30" y="130" font-size="9.5" fill="#1F4468">数据段（全局静态区）</text>
  <text x="30" y="146" font-size="8" fill="#4A4945">全局 g · static s / sl —— 有默认零值，随程序生死</text>
  <rect x="18" y="166" width="400" height="48" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="30" y="184" font-size="9.5" fill="#1F4468">栈</text>
  <text x="30" y="200" font-size="8" fill="#4A4945">局部 l · 函数帧 —— 先进后出，出栈即回收，无默认值</text>

  <text x="18" y="234" font-size="8.5" fill="#7A4A12">手动区 —— 程序员管，忘了收就泄漏</text>
  <rect x="18" y="240" width="400" height="48" rx="3" fill="#FBEEDA" stroke="#D9A458"/>
  <text x="30" y="258" font-size="9.5" fill="#7A4A12">堆</text>
  <text x="30" y="274" font-size="8" fill="#4A4945">malloc/calloc 开辟的 *h —— 凌乱无序，free 才归还</text>

  <!-- malloc/free 生命周期小条（堆的唯一双动作） -->
  <rect x="46" y="296" width="88" height="24" rx="3" fill="#FFFFFF" stroke="#D9A458"/>
  <text x="90" y="312" font-size="8" fill="#7A4A12" text-anchor="middle">malloc 申请</text>
  <line x1="138" y1="308" x2="176" y2="308" stroke="#D9A458" marker-end="url(#a5Amber)"/>
  <rect x="180" y="296" width="88" height="24" rx="3" fill="#FBEEDA" stroke="#D9A458"/>
  <text x="224" y="312" font-size="8" fill="#7A4A12" text-anchor="middle">使用 *h</text>
  <line x1="272" y1="308" x2="310" y2="308" stroke="#D9A458" marker-end="url(#a5Amber)"/>
  <rect x="314" y="296" width="88" height="24" rx="3" fill="#FFFFFF" stroke="#D9A458"/>
  <text x="358" y="312" font-size="8" fill="#7A4A12" text-anchor="middle">free + 置 NULL</text>

  <!-- 右：实测面板 -->
  <rect x="456" y="44" width="206" height="276" rx="3" fill="#F4F2EC" stroke="#CFCCC2"/>
  <text x="464" y="62" font-size="8.5" fill="#4A4945">memzones.c 实测（地址每次变，看段）</text>
  <text x="464" y="88" font-size="8" fill="#4A4945">数据段：</text>
  <text x="464" y="104" font-size="8" fill="#4A4945">g  = ...3f349000</text>
  <text x="464" y="120" font-size="8" fill="#4A4945">s  = ...3f349004</text>
  <text x="464" y="136" font-size="8" fill="#4A4945">sl = ...3f349008</text>
  <text x="464" y="166" font-size="8" fill="#4A4945">栈：</text>
  <text x="464" y="182" font-size="8" fill="#4A4945">l  = ...809cbff6c4</text>
  <text x="464" y="212" font-size="8" fill="#4A4945">堆：</text>
  <text x="464" y="228" font-size="8" fill="#4A4945">*h = ...bb912420</text>
  <line x1="464" y1="252" x2="654" y2="252" stroke="#EDEAE2"/>
  <text x="464" y="274" font-size="8" fill="#8C8980">三段地址互不相邻，</text>
  <text x="464" y="290" font-size="8" fill="#8C8980">这就是"四个区"的实证</text>

  <rect x="18" y="332" width="644" height="36" rx="3" fill="#FBEEDA" stroke="#D9A458"/>
  <text x="32" y="355" font-size="9.5" font-weight="600" fill="#7A4A12">谁管释放决定写法：自动区不用操心，堆必须 malloc/free 严格配对，free 后立刻置 NULL</text>
  <text x="32" y="388" font-size="8" fill="#8C8980">口径 C17 · 地址为本机实录，每次运行会变 · 纪律详见 005 §5.5 内存错误全家福 — 2026-11-19</text>
</svg>
