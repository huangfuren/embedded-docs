<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="582.35" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>指针的一生：五个步骤与各自的失败模式</title>
  <desc>005-指针与内存模型：指针从声明、取址、判空、解引用到释放的五步生命周期，每一步漏掉的后果分别落在野指针、悬空、段错误、越界与泄漏上（680 内部坐标系 x 1.764706）</desc>
  <rect x="0" y="0" width="680" height="330" fill="#FFFFFF"/>
  <defs>
    <marker id="a5Blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA6D0"/>
    </marker>
    <marker id="a5Red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D2948C"/>
    </marker>
  </defs>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">005 · 指针的一生：五个步骤与各自的失败模式</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">来源：005 §5.2~5.5 本机实测 · 2026-11-19</text>
  <text x="32" y="48" font-size="8" fill="#8C8980">指针只有出生、使用、死亡三个时刻；五步之间每漏一步，失败就落在不同的位置上。</text>

  <!-- 主链五步 -->
  <rect x="18" y="64" width="111" height="54" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="73.5" y="84" font-size="8.5" font-weight="600" fill="#1F4468" text-anchor="middle">① 声明</text>
  <text x="73.5" y="100" font-size="8" fill="#4A4945" text-anchor="middle">int *p;</text>
  <text x="73.5" y="112" font-size="7.5" fill="#8C8980" text-anchor="middle">宽 8 字节</text>

  <line x1="131" y1="91" x2="149" y2="91" stroke="#7FA6D0" marker-end="url(#a5Blue)"/>

  <rect x="151" y="64" width="111" height="54" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="206.5" y="84" font-size="8.5" font-weight="600" fill="#1F4468" text-anchor="middle">② 赋有效地址</text>
  <text x="206.5" y="100" font-size="8" fill="#4A4945" text-anchor="middle">p = &amp;x;</text>
  <text x="206.5" y="112" font-size="7.5" fill="#8C8980" text-anchor="middle">指向真实内存</text>

  <line x1="264" y1="91" x2="282" y2="91" stroke="#7FA6D0" marker-end="url(#a5Blue)"/>

  <rect x="284" y="64" width="111" height="54" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="339.5" y="84" font-size="8.5" font-weight="600" fill="#1F4468" text-anchor="middle">③ 使用前判空</text>
  <text x="339.5" y="100" font-size="8" fill="#4A4945" text-anchor="middle">if (p == NULL)</text>
  <text x="339.5" y="112" font-size="7.5" fill="#8C8980" text-anchor="middle">唯一可靠的检查</text>

  <line x1="397" y1="91" x2="415" y2="91" stroke="#7FA6D0" marker-end="url(#a5Blue)"/>

  <rect x="417" y="64" width="111" height="54" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="472.5" y="84" font-size="8.5" font-weight="600" fill="#1F4468" text-anchor="middle">④ 解引用 / 运算</text>
  <text x="472.5" y="100" font-size="8" fill="#4A4945" text-anchor="middle">*p；p + 1</text>
  <text x="472.5" y="112" font-size="7.5" fill="#8C8980" text-anchor="middle">步长由类型决定</text>

  <line x1="530" y1="91" x2="548" y2="91" stroke="#7FA6D0" marker-end="url(#a5Blue)"/>

  <rect x="550" y="64" width="111" height="54" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="605.5" y="84" font-size="8.5" font-weight="600" fill="#1F4468" text-anchor="middle">⑤ 释放并置空</text>
  <text x="605.5" y="100" font-size="7.5" fill="#4A4945" text-anchor="middle">free(p); p = NULL;</text>
  <text x="605.5" y="112" font-size="7.5" fill="#8C8980" text-anchor="middle">不留悬空指针</text>

  <!-- 每步的失败模式：红色下行箭头 + 后果 -->
  <line x1="73.5" y1="118" x2="73.5" y2="134" stroke="#D2948C" marker-end="url(#a5Red)"/>
  <line x1="206.5" y1="118" x2="206.5" y2="134" stroke="#D2948C" marker-end="url(#a5Red)"/>
  <line x1="339.5" y1="118" x2="339.5" y2="134" stroke="#D2948C" marker-end="url(#a5Red)"/>
  <line x1="472.5" y1="118" x2="472.5" y2="134" stroke="#D2948C" marker-end="url(#a5Red)"/>
  <line x1="605.5" y1="118" x2="605.5" y2="134" stroke="#D2948C" marker-end="url(#a5Red)"/>

  <text x="73.5" y="148" font-size="7.5" fill="#7A322B" text-anchor="middle">声明不赋值 → 野指针</text>
  <text x="206.5" y="148" font-size="7.5" fill="#7A322B" text-anchor="middle">指旧块 → 悬空</text>
  <text x="339.5" y="148" font-size="7.5" fill="#7A322B" text-anchor="middle">漏③ → 段错误</text>
  <text x="472.5" y="148" font-size="7.5" fill="#7A322B" text-anchor="middle">越界 → 常不报错</text>
  <text x="605.5" y="148" font-size="7.5" fill="#7A322B" text-anchor="middle">漏⑤ → 泄漏 / UAF</text>

  <!-- 三种状态：同一变量的三种处境 -->
  <text x="18" y="176" font-size="8.5" fill="#8C8980">同一个指针变量只有三种处境，判据与后果各不相同</text>
  <rect x="18" y="184" width="204" height="48" rx="3" fill="#FFFFFF" stroke="#7FA6D0"/>
  <text x="30" y="200" font-size="8.5" font-weight="600" fill="#1F4468">有效指针</text>
  <text x="30" y="214" font-size="7.5" fill="#4A4945">可解引用、可做指针运算</text>
  <text x="30" y="226" font-size="7.5" fill="#4A4945">地址落在本进程可访问的区</text>

  <rect x="238" y="184" width="204" height="48" rx="3" fill="#FFFFFF" stroke="#7FA6D0"/>
  <text x="250" y="200" font-size="8.5" font-weight="600" fill="#1F4468">NULL</text>
  <text x="250" y="214" font-size="7.5" fill="#4A4945">可比较、可判空；解引用必崩</text>
  <text x="250" y="226" font-size="7.5" fill="#4A4945">崩得可定位，所以宁 NULL 不野</text>

  <rect x="458" y="184" width="204" height="48" rx="3" fill="#FAE6E4" stroke="#D2948C"/>
  <text x="470" y="200" font-size="8.5" font-weight="600" fill="#7A322B">野指针</text>
  <text x="470" y="214" font-size="7.5" fill="#7A322B">值不确定，判空也无意义</text>
  <text x="470" y="226" font-size="7.5" fill="#7A322B">崩溃位置随机，最难排查</text>

  <!-- 结论 -->
  <rect x="18" y="248" width="644" height="40" rx="3" fill="#FBEEDA" stroke="#D9A458"/>
  <text x="32" y="266" font-size="9.5" font-weight="600" fill="#7A4A12">指针纪律就三句：声明即赋值、解引用前判空、free 之后立刻置 NULL</text>
  <text x="32" y="282" font-size="8" fill="#7A4A12">三句分别封住①③⑤三个出口，②④两步的边界问题只能靠人对地址有效性的判断</text>

  <text x="32" y="312" font-size="8" fill="#8C8980">口径 C17（64 位平台）· 完整可运行程序见 001-C语言/code/005/ · 2026-11-19</text>
</svg>
