<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="529.41" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>指针步长由指向的类型决定</title>
  <desc>005-指针与内存模型：char*/short*/int*/double* 加 1 各前进 1/2/4/8 字节，同一 +1 走的距离不同（680 内部坐标系 x 1.764706）</desc>
  <rect x="0" y="0" width="680" height="300" fill="#FFFFFF"/>
  <defs>
    <marker id="a5Blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA6D0"/>
    </marker>
  </defs>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">005 · 指针 +1 走多远：由指向的类型决定</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">来源：005 §5.1 addr.c 步长实测 · 2026-11-19</text>

  <text x="18" y="52" font-size="8.5" fill="#4A4945">指针的加法不是"加一个字节"，而是"移到下一个同类型元素"——同样写 +1，四种指针走的距离完全不同。</text>

  <!-- 刻度：每格 = 1 字节 -->
  <line x1="150" y1="193" x2="630" y2="193" stroke="#EDEAE2"/>
  <g stroke="#CFCCC2">
    <line x1="174" y1="70" x2="174" y2="76"/><line x1="222" y1="70" x2="222" y2="76"/>
    <line x1="270" y1="70" x2="270" y2="76"/><line x1="318" y1="70" x2="318" y2="76"/>
    <line x1="366" y1="70" x2="366" y2="76"/><line x1="414" y1="70" x2="414" y2="76"/>
    <line x1="462" y1="70" x2="462" y2="76"/><line x1="510" y1="70" x2="510" y2="76"/>
    <line x1="558" y1="70" x2="558" y2="76"/><line x1="606" y1="70" x2="606" y2="76"/>
    <line x1="174" y1="190" x2="174" y2="196"/><line x1="222" y1="190" x2="222" y2="196"/>
    <line x1="270" y1="190" x2="270" y2="196"/><line x1="318" y1="190" x2="318" y2="196"/>
    <line x1="366" y1="190" x2="366" y2="196"/><line x1="414" y1="190" x2="414" y2="196"/>
    <line x1="462" y1="190" x2="462" y2="196"/><line x1="510" y1="190" x2="510" y2="196"/>
    <line x1="558" y1="190" x2="558" y2="196"/><line x1="606" y1="190" x2="606" y2="196"/>
  </g>
  <g font-size="7" fill="#8C8980" text-anchor="middle">
    <text x="174" y="208">0</text><text x="222" y="208">1</text><text x="270" y="208">2</text>
    <text x="318" y="208">3</text><text x="366" y="208">4</text><text x="414" y="208">5</text>
    <text x="462" y="208">6</text><text x="510" y="208">7</text><text x="558" y="208">8</text>
    <text x="606" y="208">9</text>
  </g>
  <text x="18" y="208" font-size="7" fill="#8C8980">字节</text>

  <!-- 四行：类型 → 步长 -->
  <text x="18" y="88" font-size="9" fill="#1F4468">char *p</text>
  <line x1="174" y1="84" x2="222" y2="84" stroke="#7FA6D0" marker-end="url(#a5Blue)"/>
  <text x="232" y="88" font-size="8" fill="#4A4945">+1 = 前进 1 字节</text>

  <text x="18" y="120" font-size="9" fill="#1F4468">short *p</text>
  <line x1="174" y1="116" x2="270" y2="116" stroke="#7FA6D0" marker-end="url(#a5Blue)"/>
  <text x="280" y="120" font-size="8" fill="#4A4945">+1 = 前进 2 字节</text>

  <text x="18" y="152" font-size="9" fill="#1F4468">int *p</text>
  <line x1="174" y1="148" x2="366" y2="148" stroke="#7FA6D0" marker-end="url(#a5Blue)"/>
  <text x="376" y="152" font-size="8" fill="#4A4945">+1 = 前进 4 字节</text>

  <text x="18" y="184" font-size="9" fill="#1F4468">double *p</text>
  <line x1="174" y1="180" x2="558" y2="180" stroke="#7FA6D0" marker-end="url(#a5Blue)"/>
  <text x="568" y="184" font-size="8" fill="#4A4945">+1 = 8 字节</text>

  <rect x="18" y="222" width="644" height="36" rx="3" fill="#FBEEDA" stroke="#D9A458"/>
  <text x="32" y="245" font-size="9.5" font-weight="600" fill="#7A4A12">指针的加法带类型：同一个 +1，int* 走 4 字节、char* 走 1 字节——所以 int* 与 char* 不能互换</text>
  <text x="32" y="276" font-size="8" fill="#8C8980">口径 C17 · 64 位平台：short 2 / int 4 / double 8 字节 · 本机实录见 005 §5.1 与 006 §6.1 · 2026-11-19</text>
</svg>
