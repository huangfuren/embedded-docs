<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 458"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="1200" height="458" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="20" font-weight="bold" fill="#263238">008 · 流的方向与文件操作三步</text>
  <text x="1160" y="46" font-size="12" fill="#616161" text-anchor="end">来源：008 §8.1/§8.4 本机实测 · C17 · 2026-11-19</text>

  <rect x="40" y="70" width="480" height="286" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="98" font-size="15" font-weight="bold" fill="#1b5e20">标准流：方向以程序自己为参照物</text>

  <rect x="240" y="150" width="90" height="56" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="285" y="174" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">程序</text>
  <text x="285" y="194" font-size="11" fill="#2e5230" text-anchor="middle">方向原点</text>

  <rect x="60" y="150" width="110" height="56" rx="6" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <text x="115" y="182" font-size="12.5" fill="#37474f" text-anchor="middle">键盘</text>
  <line x1="174" y1="178" x2="232" y2="178" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="203" y="170" font-size="11" fill="#1565c0" text-anchor="middle">stdin</text>

  <rect x="400" y="150" width="100" height="56" rx="6" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <text x="450" y="182" font-size="12.5" fill="#37474f" text-anchor="middle">屏幕</text>
  <line x1="334" y1="178" x2="392" y2="178" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="363" y="170" font-size="11" fill="#37474f" text-anchor="middle">stdout</text>

  <rect x="400" y="250" width="100" height="56" rx="6" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <text x="450" y="282" font-size="12.5" fill="#37474f" text-anchor="middle">屏幕（错误）</text>
  <path d="M 334 196 L 360 196 L 360 278 L 392 278" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="368" y="240" font-size="11" fill="#c62828">stderr</text>

  <text x="60" y="336" font-size="11.5" fill="#616161">输入 = 流向程序，输出 = 流出程序——判断方向只看「程序在中间」</text>

  <rect x="560" y="70" width="600" height="286" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="580" y="98" font-size="15" font-weight="bold" fill="#0d47a1">文件操作三步：fopen 与 fclose 严格配对</text>

  <rect x="580" y="120" width="170" height="80" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="598" y="144" font-size="15" font-weight="bold" fill="#388e3c">①</text>
  <text x="598" y="168" font-size="13" font-weight="bold" fill="#123314">创建流</text>
  <text x="598" y="188" font-size="11" fill="#1b3d1e" font-family="ui-monospace,Menlo,Consolas,monospace">fopen(路径, mode)</text>

  <line x1="754" y1="160" x2="780" y2="160" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="788" y="120" width="170" height="80" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="806" y="144" font-size="15" font-weight="bold" fill="#388e3c">②</text>
  <text x="806" y="168" font-size="13" font-weight="bold" fill="#123314">读写</text>
  <text x="806" y="188" font-size="11" fill="#1b3d1e" font-family="ui-monospace,Menlo,Consolas,monospace">fgetc / fputs / fprintf</text>

  <line x1="962" y1="160" x2="984" y2="160" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="990" y="120" width="150" height="80" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="1008" y="144" font-size="15" font-weight="bold" fill="#388e3c">③</text>
  <text x="1008" y="168" font-size="13" font-weight="bold" fill="#123314">关闭流</text>
  <text x="1008" y="188" font-size="11" fill="#1b3d1e" font-family="ui-monospace,Menlo,Consolas,monospace">fclose(fp)</text>

  <text x="580" y="228" font-size="11.5" fill="#37474f">mode 定方向：&quot;r&quot; 只读、&quot;w&quot; 清空重写、&quot;a&quot; 追加</text>
  <text x="580" y="250" font-size="11.5" fill="#c62828">&quot;r&quot; 打不开会返回 NULL —— 用完 fopen 必须先判空</text>
  <text x="580" y="272" font-size="11.5" fill="#37474f">fclose 不只是关文件：还负责把缓冲区数据真正刷到磁盘</text>
  <text x="580" y="300" font-size="11.5" fill="#616161">漏 fclose 的后果：数据留在缓冲区丢失 + 文件句柄泄漏</text>
  <text x="580" y="330" font-size="11.5" fill="#616161">mode 全表 12 种见 008 §8.4</text>

  <rect x="40" y="372" width="1120" height="34" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="62" y="394" font-size="13" font-weight="bold" fill="#5d4037">口诀：开 → 用 → 关，三步走完才算一次完整的文件操作；中间任何一步失败都要保证已开的不泄漏</text>

  <rect x="40" y="422" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="72" y="434" font-size="12" fill="#37474f">程序自身 / 文件操作步骤</text>
  <rect x="280" y="422" width="22" height="14" rx="3" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <text x="312" y="434" font-size="12" fill="#37474f">外部设备（键盘 / 屏幕）</text>
  <line x1="520" y1="429" x2="562" y2="429" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="574" y="434" font-size="12" fill="#37474f">流入程序</text>
  <line x1="680" y1="429" x2="722" y2="429" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="734" y="434" font-size="12" fill="#37474f">流出程序</text>
  <line x1="850" y1="429" x2="892" y2="429" stroke="#c62828" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="904" y="434" font-size="12" fill="#37474f">错误通道 stderr</text>
</svg>
