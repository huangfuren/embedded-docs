<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="582.35" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>字符串哨兵与越界读</title>
  <desc>005-数组与字符串：%s 沿哨兵停、无哨兵越界读到邻居（c=jacktom 本机实录）（680 内部坐标系 x 1.764706）</desc>
  <rect x="0" y="0" width="680" height="330" fill="#FFFFFF"/>
  <defs>
    <marker id="a5Blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA6D0"/>
    </marker>
    <marker id="a5Red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D2948C"/>
    </marker>
  </defs>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">005 · \0 哨兵：%s 的"停止符"</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">来源：005 §5.3 str_demo 本机实录 · 2026-11-15</text>

  <!-- 有哨兵 -->
  <rect x="18" y="44" width="644" height="104" rx="3" fill="#F4F2EC" stroke="#CFCCC2"/>
  <text x="26" y="60" font-size="9" fill="#4A4945">有哨兵：char e[] = "lily" —— %s 读到 \0 就停</text>
  <rect x="26" y="70" width="52" height="32" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="52" y="90" font-size="9" fill="#1F4468" text-anchor="middle">l</text>
  <rect x="84" y="70" width="52" height="32" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="110" y="90" font-size="9" fill="#1F4468" text-anchor="middle">i</text>
  <rect x="142" y="70" width="52" height="32" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="168" y="90" font-size="9" fill="#1F4468" text-anchor="middle">l</text>
  <rect x="200" y="70" width="52" height="32" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="226" y="90" font-size="9" fill="#1F4468" text-anchor="middle">y</text>
  <rect x="258" y="70" width="52" height="32" rx="3" fill="#ECE7F7" stroke="#9C8ACB"/>
  <text x="284" y="90" font-size="9" fill="#46337A" text-anchor="middle">\0</text>
  <line x1="52" y1="116" x2="278" y2="116" stroke="#7FA6D0" marker-end="url(#a5Blue)"/>
  <text x="165" y="128" font-size="7.5" fill="#4A4945" text-anchor="middle">%s 从头逐字符读，撞上哨兵就收工</text>
  <text x="430" y="92" font-size="8.5" fill="#1D5A45">输出: lily</text>
  <text x="430" y="110" font-size="8" fill="#1D5A45">sizeof e = 5（含哨兵）</text>
  <text x="430" y="128" font-size="8" fill="#4A4945">strlen(e) = 4（有效字符）</text>

  <!-- 无哨兵 -->
  <rect x="18" y="156" width="644" height="118" rx="3" fill="#F4F2EC" stroke="#CFCCC2"/>
  <text x="26" y="172" font-size="9" fill="#4A4945">无哨兵：char c[] = {'j','a','c','k'} —— %s 越过 c，连到邻居 b 的 \0 才停（本机实录）</text>
  <rect x="26" y="182" width="52" height="32" rx="3" fill="#FAE6E4" stroke="#D2948C"/>
  <text x="52" y="202" font-size="9" fill="#7A322B" text-anchor="middle">j</text>
  <rect x="84" y="182" width="52" height="32" rx="3" fill="#FAE6E4" stroke="#D2948C"/>
  <text x="110" y="202" font-size="9" fill="#7A322B" text-anchor="middle">a</text>
  <rect x="142" y="182" width="52" height="32" rx="3" fill="#FAE6E4" stroke="#D2948C"/>
  <text x="168" y="202" font-size="9" fill="#7A322B" text-anchor="middle">c</text>
  <rect x="200" y="182" width="52" height="32" rx="3" fill="#FAE6E4" stroke="#D2948C"/>
  <text x="226" y="202" font-size="9" fill="#7A322B" text-anchor="middle">k</text>
  <rect x="258" y="182" width="52" height="32" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="284" y="202" font-size="9" fill="#1F4468" text-anchor="middle">t</text>
  <rect x="316" y="182" width="52" height="32" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="342" y="202" font-size="9" fill="#1F4468" text-anchor="middle">o</text>
  <rect x="374" y="182" width="52" height="32" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="400" y="202" font-size="9" fill="#1F4468" text-anchor="middle">m</text>
  <rect x="432" y="182" width="52" height="32" rx="3" fill="#ECE7F7" stroke="#9C8ACB"/>
  <text x="458" y="202" font-size="9" fill="#46337A" text-anchor="middle">\0</text>
  <line x1="52" y1="228" x2="452" y2="228" stroke="#D2948C" marker-end="url(#a5Red)"/>
  <text x="252" y="240" font-size="7.5" fill="#7A322B" text-anchor="middle">%s 停不下来——c 后面没有哨兵，一路读进邻居 b 的地盘，撞见 b 的 \0 才收工</text>
  <text x="26" y="262" font-size="8.5" fill="#7A322B">输出: jacktom（c 的 4 个字符 + 邻居 b 的 "tom"，全凭内存运气）</text>

  <rect x="18" y="282" width="644" height="36" rx="3" fill="#FBEEDA" stroke="#D9A458"/>
  <text x="32" y="305" font-size="9.5" font-weight="600" fill="#7A4A12">哨兵是字符串的停止符：手写数组必补 '\0'；最推荐字面量写法 char s[] = "lily"（自动带哨兵）</text>
  <text x="32" y="326" font-size="8" fill="#8C8980">口径 C17 · 完整示例 str_demo.c 见 005 §5.3 — 2026-11-15</text>
</svg>
