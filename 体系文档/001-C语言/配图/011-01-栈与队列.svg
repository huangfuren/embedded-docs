<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="652.94" viewBox="0 0 680 370" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>栈与队列：LIFO 与 FIFO</title>
  <desc>011-栈与队列：栈的栈顶进出、队列的队尾进队首出与假溢出（ds_stack/ds_queue 本机实录）（680 内部坐标系 x 1.764706）</desc>
  <rect x="0" y="0" width="680" height="370" fill="#FFFFFF"/>
  <defs>
    <marker id="a11Blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA6D0"/>
    </marker>
    <marker id="a11Amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9A458"/>
    </marker>
    <marker id="a11Red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D2948C"/>
    </marker>
  </defs>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">011 · 栈（LIFO）与队列（FIFO）：进出规则对照</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">来源：011 §11.1/§11.2 ds_stack/ds_queue 本机实录 · 2026-11-15</text>

  <!-- 左：栈 -->
  <rect x="18" y="44" width="300" height="196" rx="3" fill="#F4F2EC" stroke="#CFCCC2"/>
  <text x="26" y="60" font-size="9" fill="#4A4945">栈 —— 只在栈顶一端进出（LIFO）</text>
  <rect x="120" y="76" width="90" height="28" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="165" y="94" font-size="8.5" fill="#1F4468" text-anchor="middle">40（栈顶）</text>
  <rect x="120" y="108" width="90" height="28" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="165" y="126" font-size="8.5" fill="#1F4468" text-anchor="middle">30</text>
  <rect x="120" y="140" width="90" height="28" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="165" y="158" font-size="8.5" fill="#1F4468" text-anchor="middle">20</text>
  <rect x="120" y="172" width="90" height="28" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="165" y="190" font-size="8.5" fill="#1F4468" text-anchor="middle">10（栈底）</text>
  <line x1="286" y1="90" x2="220" y2="90" stroke="#7FA6D0" marker-end="url(#a11Blue)"/>
  <text x="253" y="84" font-size="7.5" fill="#1F4468" text-anchor="middle">push</text>
  <line x1="220" y1="90" x2="286" y2="90" stroke="#D9A458" marker-end="url(#a11Amber)"/>
  <text x="253" y="102" font-size="7.5" fill="#7A4A12" text-anchor="middle">pop → 40</text>
  <text x="26" y="226" font-size="8" fill="#1D5A45">本机实录：压 10/20/30/40，两次 pop 弹出 40、30</text>

  <!-- 右：队列 -->
  <rect x="336" y="44" width="326" height="196" rx="3" fill="#F4F2EC" stroke="#CFCCC2"/>
  <text x="344" y="60" font-size="9" fill="#4A4945">队列 —— 队尾进、队首出（FIFO）</text>
  <rect x="352" y="88" width="56" height="28" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="380" y="106" font-size="8.5" fill="#1F4468" text-anchor="middle">400</text>
  <rect x="412" y="88" width="56" height="28" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="440" y="106" font-size="8.5" fill="#1F4468" text-anchor="middle">500</text>
  <rect x="472" y="88" width="56" height="28" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="500" y="106" font-size="8.5" fill="#1F4468" text-anchor="middle">600</text>
  <line x1="600" y1="102" x2="532" y2="102" stroke="#7FA6D0" marker-end="url(#a11Blue)"/>
  <text x="566" y="96" font-size="7.5" fill="#1F4468" text-anchor="middle">en_queue</text>
  <text x="380" y="80" font-size="7.5" fill="#4A4945" text-anchor="middle">front（出）</text>
  <text x="524" y="80" font-size="7.5" fill="#4A4945" text-anchor="middle">rear（进）</text>
  <line x1="380" y1="124" x2="330" y2="124" stroke="#D9A458" marker-end="url(#a11Amber)"/>
  <text x="355" y="138" font-size="7.5" fill="#7A4A12" text-anchor="middle">del_queue</text>
  <text x="352" y="166" font-size="8" fill="#4A4945">出队顺序 = 入队顺序（先进先出）</text>
  <text x="352" y="184" font-size="8" fill="#1D5A45">本机实录：出 3 进 3 后 400 500 600 1000 2000 3000</text>
  <text x="352" y="202" font-size="8" fill="#8C8980">满队列拒绝：第 7 个 en_queue(700) 没进去</text>

  <!-- 假溢出 -->
  <rect x="18" y="248" width="644" height="70" rx="3" fill="#F4F2EC" stroke="#CFCCC2"/>
  <text x="26" y="264" font-size="9" fill="#4A4945">假溢出：front 后移后前段格子"废了"——取模绕回（循环队列）治好它</text>
  <rect x="26" y="272" width="52" height="26" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-dasharray="3,2"/>
  <text x="52" y="289" font-size="8" fill="#8C8980" text-anchor="middle">废</text>
  <rect x="82" y="272" width="52" height="26" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-dasharray="3,2"/>
  <text x="108" y="289" font-size="8" fill="#8C8980" text-anchor="middle">废</text>
  <rect x="138" y="272" width="52" height="26" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="164" y="289" font-size="8" fill="#1F4468" text-anchor="middle">400</text>
  <rect x="194" y="272" width="52" height="26" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="220" y="289" font-size="8" fill="#1F4468" text-anchor="middle">500</text>
  <rect x="250" y="272" width="52" height="26" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="276" y="289" font-size="8" fill="#1F4468" text-anchor="middle">600</text>
  <rect x="306" y="272" width="52" height="26" rx="3" fill="#ECE7F7" stroke="#9C8ACB"/>
  <text x="332" y="289" font-size="8" fill="#46337A" text-anchor="middle">1000</text>
  <rect x="362" y="272" width="52" height="26" rx="3" fill="#ECE7F7" stroke="#9C8ACB"/>
  <text x="388" y="289" font-size="8" fill="#46337A" text-anchor="middle">2000</text>
  <rect x="418" y="272" width="52" height="26" rx="3" fill="#ECE7F7" stroke="#9C8ACB"/>
  <text x="444" y="289" font-size="8" fill="#46337A" text-anchor="middle">3000</text>
  <polyline points="404,285 404,258 356,258 356,268" fill="none" stroke="#7FA6D0" marker-end="url(#a11Blue)"/>
  <text x="392" y="252" font-size="7.5" fill="#1F4468" text-anchor="middle">rear 绕回</text>
  <text x="486" y="285" font-size="8" fill="#1D5A45">出 3 进 3：新数据写进绕回后的空格（实测）</text>

  <rect x="18" y="326" width="644" height="36" rx="3" fill="#FBEEDA" stroke="#D9A458"/>
  <text x="32" y="349" font-size="9.5" font-weight="600" fill="#7A4A12">栈后进先出（函数调用/括号匹配/回退）；队列先进先出（缓冲/排队/RTOS 消息）——嵌入式两个无处不在的模型</text>
</svg>
