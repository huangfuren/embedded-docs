<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="652.94" viewBox="0 0 680 370" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>内存四区与释放责任</title>
  <desc>003-指针与内存模型：代码段/数据段/栈/堆四区，各区的成员与释放责任，右侧配 memzones.c 实测地址（680 内部坐标系 x 1.764706）</desc>
  <rect x="0" y="0" width="680" height="370" fill="#FFFFFF"/>
  <defs>
    <marker id="a3Blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA6D0"/>
    </marker>
  </defs>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">003 · 内存四区：变量住哪、谁管释放</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">来源：003 §3.4 memzones.c 本机实测 · 2026-11-15</text>

  <rect x="18" y="44" width="430" height="56" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="30" y="64" font-size="9.5" fill="#1F4468">代码段</text>
  <text x="30" y="82" font-size="8" fill="#4A4945">函数的机器码 · 字符串字面量 "hi"</text>
  <text x="436" y="76" font-size="8" fill="#1D5A45" text-anchor="end">只读 · 自动</text>
  <rect x="18" y="108" width="430" height="56" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="30" y="128" font-size="9.5" fill="#1F4468">数据段（全局静态区）</text>
  <text x="30" y="146" font-size="8" fill="#4A4945">全局 g · static s / sl —— 有默认零值，随程序生死</text>
  <text x="436" y="140" font-size="8" fill="#1D5A45" text-anchor="end">自动</text>
  <rect x="18" y="172" width="430" height="56" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
  <text x="30" y="192" font-size="9.5" fill="#1F4468">栈</text>
  <text x="30" y="210" font-size="8" fill="#4A4945">局部 l · 函数帧 —— 先进后出，出栈即回收，无默认值</text>
  <text x="436" y="204" font-size="8" fill="#1D5A45" text-anchor="end">自动</text>
  <rect x="18" y="236" width="430" height="56" rx="3" fill="#FBEEDA" stroke="#D9A458"/>
  <text x="30" y="256" font-size="9.5" fill="#7A4A12">堆</text>
  <text x="30" y="274" font-size="8" fill="#4A4945">malloc/calloc 开辟的 *h —— 凌乱无序，忘了 free 就泄漏</text>
  <text x="436" y="268" font-size="8" fill="#7A322B" text-anchor="end">手动 free</text>

  <rect x="456" y="44" width="206" height="248" rx="3" fill="#F4F2EC" stroke="#CFCCC2"/>
  <text x="464" y="62" font-size="8.5" fill="#4A4945">memzones.c 实测（地址每次变，看段）</text>
  <text x="464" y="86" font-size="8" fill="#4A4945">数据段：</text>
  <text x="464" y="102" font-size="8" fill="#4A4945">g  = ...3f349000</text>
  <text x="464" y="118" font-size="8" fill="#4A4945">s  = ...3f349004</text>
  <text x="464" y="134" font-size="8" fill="#4A4945">sl = ...3f349008</text>
  <text x="464" y="162" font-size="8" fill="#4A4945">栈：</text>
  <text x="464" y="178" font-size="8" fill="#4A4945">l  = ...809cbff6c4</text>
  <text x="464" y="206" font-size="8" fill="#4A4945">堆：</text>
  <text x="464" y="222" font-size="8" fill="#4A4945">*h = ...bb912420</text>
  <text x="464" y="252" font-size="8" fill="#8C8980">三段地址互不相邻，</text>
  <text x="464" y="268" font-size="8" fill="#8C8980">这就是"四个区"的实证</text>

  <rect x="18" y="304" width="644" height="36" rx="3" fill="#FBEEDA" stroke="#D9A458"/>
  <text x="32" y="327" font-size="9.5" font-weight="600" fill="#7A4A12">谁管释放决定写法：数据段/栈自动，堆必须 malloc/free 严格配对，free 后立刻置 NULL</text>
  <text x="32" y="358" font-size="8" fill="#8C8980">口径 C17 · 地址为本机实录，每次运行会变 · 纪律详见 003 §3.5 内存错误全家福 — 2026-11-15</text>
</svg>
