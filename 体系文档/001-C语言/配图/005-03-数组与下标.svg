<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="1200" height="490" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="20" font-weight="bold" fill="#1b5e20">005 · 下标就是地址运算：arr[2] 与 *(arr + 2) 是同一件事</text>
  <text x="1160" y="46" font-size="12" fill="#616161" text-anchor="end">来源：005 §5.3 · 地址为示意（真实地址每次运行都变，看差值）· 2026-11-19</text>

  <text x="40" y="86" font-size="12" fill="#37474f">数组名不是指针，但会「退化」成首元素地址——下标的全部含义，就是从首地址走 i 个元素</text>

  <text x="54" y="196" font-size="17" font-weight="bold" fill="#0d2f5c" font-family="ui-monospace,Menlo,Consolas,monospace">arr</text>
  <line x1="90" y1="190" x2="112" y2="190" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="200" y="142" font-size="11.5" fill="#616161" text-anchor="middle">[0]</text>
  <text x="375" y="142" font-size="11.5" fill="#616161" text-anchor="middle">[1]</text>
  <text x="550" y="142" font-size="11.5" fill="#616161" text-anchor="middle">[2]</text>
  <text x="725" y="142" font-size="11.5" fill="#616161" text-anchor="middle">[3]</text>

  <rect x="120" y="150" width="160" height="76" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="295" y="150" width="160" height="76" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="470" y="150" width="160" height="76" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <rect x="645" y="150" width="160" height="76" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="200" y="196" font-size="20" font-weight="bold" fill="#123314" text-anchor="middle">10</text>
  <text x="375" y="196" font-size="20" font-weight="bold" fill="#123314" text-anchor="middle">20</text>
  <text x="550" y="196" font-size="20" font-weight="bold" fill="#7f3f00" text-anchor="middle">30</text>
  <text x="725" y="196" font-size="20" font-weight="bold" fill="#123314" text-anchor="middle">40</text>

  <text x="200" y="250" font-size="11.5" fill="#616161" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">0x1000</text>
  <text x="375" y="250" font-size="11.5" fill="#616161" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">0x1004</text>
  <text x="550" y="250" font-size="11.5" fill="#7f3f00" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">0x1008</text>
  <text x="725" y="250" font-size="11.5" fill="#616161" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">0x100C</text>

  <rect x="840" y="150" width="320" height="100" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="860" y="176" font-size="13" font-weight="bold" fill="#263238">相邻元素差 4 字节</text>
  <text x="860" y="200" font-size="11.5" fill="#37474f">= sizeof(int)，不是 1</text>
  <text x="860" y="224" font-size="11.5" fill="#37474f">arr + 2 走 2 个元素 = 8 字节</text>

  <text x="40" y="304" font-size="17" font-weight="bold" fill="#1b5e20">三种写法，同一个格子（上图标橙的那格）</text>

  <rect x="40" y="322" width="280" height="56" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="180" y="348" font-size="15" font-weight="bold" fill="#0d2f5c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">arr[2]</text>
  <text x="180" y="368" font-size="11.5" fill="#0d2f5c" text-anchor="middle">下标写法</text>

  <line x1="328" y1="350" x2="388" y2="350" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="400" y="322" width="280" height="56" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="540" y="348" font-size="15" font-weight="bold" fill="#7f3f00" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">*(arr + 2)</text>
  <text x="540" y="368" font-size="11.5" fill="#7f3f00" text-anchor="middle">指针写法，编译器同一处理</text>

  <line x1="688" y1="350" x2="748" y2="350" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="760" y="322" width="400" height="56" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="960" y="348" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">0x1008 那个格子，值 30</text>
  <text x="960" y="368" font-size="11.5" fill="#1b3d1e" text-anchor="middle">数组名 + 偏移 → 再解引用，与下标等价</text>

  <rect x="40" y="396" width="1120" height="52" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="62" y="428" font-size="13" font-weight="bold" fill="#5d4037">下标不是语法糖，它就是地址运算：arr[i] → *(arr + i) → *(首地址 + i × sizeof)</text>

  <rect x="40" y="464" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="72" y="476" font-size="12" fill="#37474f">普通元素</text>
  <rect x="200" y="464" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <text x="232" y="476" font-size="12" fill="#37474f">本例取值的目标格</text>
  <rect x="400" y="464" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="432" y="476" font-size="12" fill="#37474f">下标写法</text>
  <rect x="540" y="464" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="572" y="476" font-size="12" fill="#37474f">指针写法</text>
</svg>
