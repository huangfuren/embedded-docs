<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>
  <defs>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#388e3c"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="20" font-weight="bold" fill="#263238">014 · 哈希表 = 桶数组 + 桶内链表（冲突挂链）</text>
  <text x="1160" y="46" font-size="12" fill="#616161" text-anchor="end">来源：014 §14.1 ds_hash 本机实录 · C17 · 2026-11-19</text>

  <!-- ① 结构 -->
  <rect x="40" y="66" width="1120" height="330" rx="12" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="94" font-size="15" font-weight="bold" fill="#1b5e20">① 桶数组（BUCKETS = 5）+ 桶内链表：hash(key) = key % 5 决定挂到哪个桶</text>

  <rect x="60" y="118" width="120" height="48" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="120" y="149" font-size="14" font-weight="bold" fill="#123314" text-anchor="middle">桶 0</text>
  <rect x="60" y="172" width="120" height="48" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="120" y="203" font-size="14" font-weight="bold" fill="#123314" text-anchor="middle">桶 1</text>
  <rect x="60" y="226" width="120" height="48" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="120" y="257" font-size="14" font-weight="bold" fill="#123314" text-anchor="middle">桶 2</text>
  <rect x="60" y="280" width="120" height="48" rx="6" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="120" y="311" font-size="14" font-weight="bold" fill="#616161" text-anchor="middle">桶 3</text>
  <rect x="60" y="334" width="120" height="48" rx="6" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="120" y="365" font-size="14" font-weight="bold" fill="#616161" text-anchor="middle">桶 4</text>

  <!-- 桶 0 链 -->
  <rect x="260" y="118" width="140" height="48" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="330" y="138" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">key = 15</text>
  <text x="330" y="156" font-size="12" fill="#0d2f5c" text-anchor="middle">val = 500</text>
  <rect x="428" y="118" width="140" height="48" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="498" y="138" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">key = 10</text>
  <text x="498" y="156" font-size="12" fill="#0d2f5c" text-anchor="middle">val = 999</text>
  <rect x="596" y="118" width="64" height="48" rx="6" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="628" y="149" font-size="12" fill="#616161" text-anchor="middle">NULL</text>

  <line x1="184" y1="142" x2="256" y2="142" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="404" y1="142" x2="424" y2="142" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="572" y1="142" x2="592" y2="142" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- 桶 1 链 -->
  <rect x="260" y="172" width="140" height="48" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="330" y="192" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">key = 21</text>
  <text x="330" y="210" font-size="12" fill="#0d2f5c" text-anchor="middle">val = 200</text>
  <rect x="428" y="172" width="64" height="48" rx="6" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="460" y="203" font-size="12" fill="#616161" text-anchor="middle">NULL</text>

  <line x1="184" y1="196" x2="256" y2="196" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="404" y1="196" x2="424" y2="196" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- 桶 2 链 -->
  <rect x="260" y="226" width="140" height="48" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="330" y="246" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">key = 32</text>
  <text x="330" y="264" font-size="12" fill="#0d2f5c" text-anchor="middle">val = 300</text>
  <rect x="428" y="226" width="64" height="48" rx="6" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="460" y="257" font-size="12" fill="#616161" text-anchor="middle">NULL</text>

  <line x1="184" y1="250" x2="256" y2="250" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="404" y1="250" x2="424" y2="250" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- 右侧说明卡（与左侧链同排，保证左右内边距对称） -->
  <rect x="700" y="118" width="440" height="48" rx="6" fill="#fafafa" stroke="#cfd8dc" stroke-width="1"/>
  <text x="720" y="138" font-size="11.5" fill="#0d2f5c">15 % 5 = 0、10 % 5 = 0：同桶冲突，头插成链</text>
  <text x="720" y="156" font-size="11.5" fill="#37474f">10 插两次只覆盖 val（999），不新增节点</text>
  <rect x="700" y="172" width="440" height="48" rx="6" fill="#fafafa" stroke="#cfd8dc" stroke-width="1"/>
  <text x="720" y="192" font-size="11.5" fill="#0d2f5c">21 % 5 = 1 → 桶 1，链上只有 1 个节点</text>
  <text x="720" y="210" font-size="11.5" fill="#37474f">查到它只需 1 次比对，不用继续走链</text>
  <rect x="700" y="226" width="440" height="48" rx="6" fill="#fafafa" stroke="#cfd8dc" stroke-width="1"/>
  <text x="720" y="246" font-size="11.5" fill="#0d2f5c">32 % 5 = 2 → 桶 2，链上只有 1 个节点</text>
  <text x="720" y="264" font-size="11.5" fill="#37474f">桶 3 / 桶 4 空：没有 key 模 5 落过去</text>

  <!-- ② 查找路径 -->
  <rect x="40" y="412" width="1120" height="104" rx="12" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="440" font-size="15" font-weight="bold" fill="#1b5e20">② 查 get(21)：先算桶号，再沿链逐节点比对</text>

  <rect x="60" y="452" width="280" height="44" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="200" y="479" font-size="12.5" fill="#0d2f5c" text-anchor="middle">hash(21) = 21 % 5 = 1</text>
  <line x1="344" y1="474" x2="368" y2="474" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="372" y="452" width="340" height="44" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="542" y="479" font-size="12.5" fill="#123314" text-anchor="middle">直接跳到桶 1：指针数组定位 O(1)</text>
  <line x1="716" y1="474" x2="740" y2="474" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="744" y="452" width="396" height="44" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="942" y="479" font-size="12.5" fill="#1b5e20" text-anchor="middle">链上只有 1 个节点 → 命中，返回 val = 200</text>

  <!-- 结论 -->
  <rect x="40" y="532" width="1120" height="48" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="62" y="555" font-size="13" font-weight="bold" fill="#5d4037">三特点：元素唯一（去重靠插入时先查）· 存取无序（位置由哈希值决定）· 无索引（只能按键找，不能按下标取）</text>
  <text x="62" y="573" font-size="12" fill="#5d4037">桶数少或哈希函数差 → 链变长，查找退化 O(n)；装填因子过高就要扩容重排（rehash）</text>

  <!-- 图例 -->
  <rect x="40" y="596" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="72" y="608" font-size="12" fill="#37474f">非空桶（存链表头指针）</text>
  <rect x="280" y="596" width="22" height="14" rx="3" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="312" y="608" font-size="12" fill="#37474f">空桶 / 链尾 NULL</text>
  <rect x="490" y="596" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="522" y="608" font-size="12" fill="#37474f">链上节点（key + val）</text>
  <line x1="720" y1="603" x2="754" y2="603" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="766" y="608" font-size="12" fill="#37474f">next 指针</text>
</svg>
