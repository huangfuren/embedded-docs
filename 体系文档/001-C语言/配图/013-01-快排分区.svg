<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="1200" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#388e3c"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="20" font-weight="bold" fill="#263238">013 · 快排一轮分区：基准归位，左小右大</text>
  <text x="1160" y="46" font-size="12" fill="#616161" text-anchor="end">来源：013 §13.4 ds_sort 本机实录 · C17 · 2026-11-19</text>

  <!-- ① 分区前 -->
  <rect x="40" y="70" width="1120" height="186" rx="12" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="98" font-size="15" font-weight="bold" fill="#1b5e20">① 分区前：先取一个基准，low 与 high 从两头向中间扫</text>
  <text x="60" y="120" font-size="11.5" fill="#37474f">基准 key = arr[0] = 9（讲义基础版取首元素）；low 从左找大于 key 的，high 从右找小于 key 的，各自找到就交换</text>

  <text x="296" y="150" font-size="11.5" fill="#2e7d32" text-anchor="middle">low 从左边推进</text>
  <text x="1008" y="150" font-size="11.5" fill="#e65100" text-anchor="middle">high 从右边推进</text>

  <rect x="148" y="166" width="88" height="56" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <text x="192" y="200" font-size="15" font-weight="bold" fill="#7f3f00" text-anchor="middle">9</text>
  <rect x="250" y="166" width="88" height="56" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="294" y="200" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">-16</text>
  <rect x="352" y="166" width="88" height="56" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="396" y="200" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">40</text>
  <rect x="454" y="166" width="88" height="56" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="498" y="200" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">23</text>
  <rect x="556" y="166" width="88" height="56" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="600" y="200" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">-30</text>
  <rect x="658" y="166" width="88" height="56" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="702" y="200" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">-49</text>
  <rect x="760" y="166" width="88" height="56" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="804" y="200" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">25</text>
  <rect x="862" y="166" width="88" height="56" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="906" y="200" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">21</text>
  <rect x="964" y="166" width="88" height="56" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="1008" y="200" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">30</text>

  <text x="192" y="242" font-size="11" fill="#616161" text-anchor="middle">[0] 基准</text>
  <text x="294" y="242" font-size="11" fill="#616161" text-anchor="middle">[1]</text>
  <text x="396" y="242" font-size="11" fill="#616161" text-anchor="middle">[2]</text>
  <text x="498" y="242" font-size="11" fill="#616161" text-anchor="middle">[3]</text>
  <text x="600" y="242" font-size="11" fill="#616161" text-anchor="middle">[4]</text>
  <text x="702" y="242" font-size="11" fill="#616161" text-anchor="middle">[5]</text>
  <text x="804" y="242" font-size="11" fill="#616161" text-anchor="middle">[6]</text>
  <text x="906" y="242" font-size="11" fill="#616161" text-anchor="middle">[7]</text>
  <text x="1008" y="242" font-size="11" fill="#616161" text-anchor="middle">[8]</text>

  <!-- ② 分区后 -->
  <rect x="40" y="276" width="1120" height="204" rx="12" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="304" font-size="15" font-weight="bold" fill="#1b5e20">② 一轮分区后：基准落到最终位置，左半全小于等于它，右半全大于等于它</text>

  <text x="294" y="334" font-size="11.5" fill="#1b5e20" text-anchor="middle">左半（≤ 9）</text>
  <text x="498" y="334" font-size="11.5" fill="#7f3f00" text-anchor="middle">基准归位</text>
  <text x="804" y="334" font-size="11.5" fill="#2e7d32" text-anchor="middle">右半（≥ 9）</text>

  <rect x="148" y="348" width="88" height="56" rx="6" fill="#a5d6a7" stroke="#1b5e20" stroke-width="1.5"/>
  <text x="192" y="382" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">-16</text>
  <rect x="250" y="348" width="88" height="56" rx="6" fill="#a5d6a7" stroke="#1b5e20" stroke-width="1.5"/>
  <text x="294" y="382" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">-30</text>
  <rect x="352" y="348" width="88" height="56" rx="6" fill="#a5d6a7" stroke="#1b5e20" stroke-width="1.5"/>
  <text x="396" y="382" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">-49</text>
  <rect x="454" y="348" width="88" height="56" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <text x="498" y="382" font-size="15" font-weight="bold" fill="#7f3f00" text-anchor="middle">9</text>
  <rect x="556" y="348" width="88" height="56" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="600" y="382" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">40</text>
  <rect x="658" y="348" width="88" height="56" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="702" y="382" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">23</text>
  <rect x="760" y="348" width="88" height="56" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="804" y="382" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">25</text>
  <rect x="862" y="348" width="88" height="56" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="906" y="382" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">21</text>
  <rect x="964" y="348" width="88" height="56" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="1008" y="382" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">30</text>

  <line x1="294" y1="410" x2="294" y2="426" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="804" y1="410" x2="804" y2="426" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="148" y="430" width="292" height="34" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="294" y="452" font-size="12" fill="#1b5e20" text-anchor="middle">递归排序左半（3 个元素）</text>
  <text x="498" y="446" font-size="11" fill="#7f3f00" text-anchor="middle">不再参与</text>
  <text x="498" y="462" font-size="11" fill="#7f3f00" text-anchor="middle">后续递归</text>
  <rect x="556" y="430" width="496" height="34" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="804" y="452" font-size="12" fill="#1b5e20" text-anchor="middle">递归排序右半（5 个元素）</text>

  <!-- 结论 -->
  <rect x="40" y="500" width="1120" height="48" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="62" y="523" font-size="13" font-weight="bold" fill="#5d4037">一轮分区只保证「基准归位 + 两侧分堆」，不保证两侧有序——顺序靠对两半继续递归</text>
  <text x="62" y="541" font-size="12" fill="#5d4037">扫描 O(n)，均衡递归 log₂n 层 → 平均 O(n·log₂n)；基准取首元素在近有序数据上退化为 O(n²)</text>

  <!-- 图例 -->
  <rect x="40" y="572" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <text x="72" y="584" font-size="12" fill="#37474f">基准（pivot）</text>
  <rect x="210" y="572" width="22" height="14" rx="3" fill="#a5d6a7" stroke="#1b5e20" stroke-width="1.5"/>
  <text x="242" y="584" font-size="12" fill="#37474f">已分到左半</text>
  <rect x="380" y="572" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="412" y="584" font-size="12" fill="#37474f">待分区元素 / 右半</text>
  <line x1="600" y1="579" x2="634" y2="579" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="646" y="584" font-size="12" fill="#37474f">递归下一层</text>
</svg>
