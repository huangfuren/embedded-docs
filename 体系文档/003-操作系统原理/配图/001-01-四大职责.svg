<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>操作系统的四大职责：仲裁四类资源</title>
  <rect x="0" y="0" width="1200" height="490" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <text x="60" y="46" font-size="20" font-weight="bold" fill="#0d2f5c">操作系统的四大职责：本质都是「仲裁」</text>
  <text x="60" y="70" font-size="11" fill="#616161">来源：003 板块 001 §1.2 · 口径：机制通用，Linux 与 FreeRTOS 双线 · 2026-11-14</text>

  <!-- 应用层 -->
  <rect x="60" y="96" width="1080" height="54" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="80" y="120" font-size="12.5" font-weight="bold" fill="#0d2f5c">应用层</text>
  <text x="80" y="140" font-size="11.5" fill="#0d2f5c">浏览器 · 微信 · 你的 hello.exe · 后台服务 —— 都在抢同一套硬件，谁也不服谁</text>
  <text x="1120" y="128" font-size="11" fill="#0d2f5c" text-anchor="end">请求服务 ↓</text>

  <!-- 内核 -->
  <rect x="60" y="168" width="1080" height="140" rx="8" fill="#f1f8e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="80" y="192" font-size="13" font-weight="bold" fill="#123314">内核（常驻内存 · 特权运行）—— 只做一件事：仲裁</text>

  <rect x="80" y="204" width="242" height="86" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="96" y="226" font-size="12.5" font-weight="bold" fill="#123314">进程管理</text>
  <text x="96" y="248" font-size="11" fill="#1b3d1e">谁什么时候上 CPU</text>
  <text x="96" y="268" font-size="11" fill="#1b3d1e">决定下一个运行者并切换</text>
  <text x="96" y="284" font-size="10" fill="#2e5230">深入：本板块 002</text>

  <rect x="346" y="204" width="242" height="86" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="362" y="226" font-size="12.5" font-weight="bold" fill="#123314">内存管理</text>
  <text x="362" y="248" font-size="11" fill="#1b3d1e">每块内存归谁</text>
  <text x="362" y="268" font-size="11" fill="#1b3d1e">记账 + 划界，防互踩</text>
  <text x="362" y="284" font-size="10" fill="#2e5230">深入：002 §2.1 + 体系结构 003</text>

  <rect x="612" y="204" width="242" height="86" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="628" y="226" font-size="12.5" font-weight="bold" fill="#123314">文件系统</text>
  <text x="628" y="248" font-size="11" fill="#1b3d1e">存储上的数据</text>
  <text x="628" y="268" font-size="11" fill="#1b3d1e">把「块设备」抽象成文件与目录</text>
  <text x="628" y="284" font-size="10" fill="#2e5230">深入：后续扩册</text>

  <rect x="878" y="204" width="242" height="86" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="894" y="226" font-size="12.5" font-weight="bold" fill="#123314">设备管理</text>
  <text x="894" y="248" font-size="11" fill="#1b3d1e">千差万别的硬件</text>
  <text x="894" y="268" font-size="11" fill="#1b3d1e">驱动统一成接口</text>
  <text x="894" y="284" font-size="10" fill="#2e5230">深入：规划 008 嵌入式 Linux</text>

  <line x1="600" y1="150" x2="600" y2="166" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="308" x2="600" y2="324" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="612" y="322" font-size="11" fill="#2e7d32">仲裁后分配 ↓</text>

  <!-- 硬件 -->
  <rect x="80" y="330" width="242" height="60" rx="6" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="96" y="352" font-size="12" font-weight="bold" fill="#37474f">CPU · 时间</text>
  <text x="96" y="374" font-size="11" fill="#37474f">一颗 CPU，几十个进程排队</text>

  <rect x="346" y="330" width="242" height="60" rx="6" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="362" y="352" font-size="12" font-weight="bold" fill="#37474f">内存 · 空间</text>
  <text x="362" y="374" font-size="11" fill="#37474f">16GB 里划分给每个进程</text>

  <rect x="612" y="330" width="242" height="60" rx="6" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="628" y="352" font-size="12" font-weight="bold" fill="#37474f">磁盘 / Flash · 持久</text>
  <text x="628" y="374" font-size="11" fill="#37474f">1TB 里按文件组织</text>

  <rect x="878" y="330" width="242" height="60" rx="6" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="894" y="352" font-size="12" font-weight="bold" fill="#37474f">外设 · 接口</text>
  <text x="894" y="374" font-size="11" fill="#37474f">串口 / 网卡 / USB 各自不同</text>

  <!-- 结论 -->
  <rect x="60" y="408" width="1080" height="42" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="80" y="435" font-size="13" fill="#7f3f00">OS 的权威来自它独占的特权（§1.4）—— 应用想碰硬件只能「请求」，不能自己动手</text>

  <!-- 图例 -->
  <rect x="60" y="466" width="22" height="12" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="90" y="476" font-size="11" fill="#37474f">应用（请求方）</text>
  <rect x="230" y="466" width="22" height="12" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="260" y="476" font-size="11" fill="#37474f">内核四大职责（仲裁方）</text>
  <rect x="470" y="466" width="22" height="12" rx="3" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="500" y="476" font-size="11" fill="#37474f">被争抢的资源</text>
</svg>
