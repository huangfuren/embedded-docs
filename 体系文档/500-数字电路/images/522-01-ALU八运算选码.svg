<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>ALU：8 种运算同时算好，3 位选码只决定放谁出去</title>
  <rect x="0" y="0" width="1200" height="740" fill="#ffffff"/>

  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/>
    </marker>
  </defs>

  <text x="60" y="48" font-size="20" font-weight="bold" fill="#0d2f5c">ALU：8 条路并行算好，选码只决定放谁出去</text>
  <text x="60" y="72" font-size="11" fill="#616161">来源：522 §522.1~522.2· 硬件里没有 if-else，有的是"八条通路 + 一个选择器"；opcode 一变，出去的线就换一条</text>

  <!-- 输入 -->
  <rect x="70" y="190" width="90" height="40" rx="20" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="115" y="215" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">A</text>
  <rect x="70" y="250" width="90" height="40" rx="20" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="115" y="275" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">B</text>
  <line x1="160" y1="210" x2="180" y2="210" stroke="#1565c0" stroke-width="2"/>
  <line x1="160" y1="270" x2="180" y2="270" stroke="#1565c0" stroke-width="2"/>

  <!-- A/B 总线 -->
  <line x1="180" y1="130" x2="180" y2="500" stroke="#1565c0" stroke-width="2"/>

  <!-- 8 个运算器 -->
  <rect x="200" y="120" width="250" height="40" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="216" y="146" font-size="12.5" font-weight="bold" fill="#123314">000　输出 A　直通</text>
  <line x1="180" y1="140" x2="200" y2="140" stroke="#1565c0" stroke-width="2"/>
  <line x1="450" y1="140" x2="490" y2="140" stroke="#1565c0" stroke-width="2"/>

  <rect x="200" y="170" width="250" height="40" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="216" y="196" font-size="12.5" font-weight="bold" fill="#123314">001　输出 B　直通</text>
  <line x1="180" y1="190" x2="200" y2="190" stroke="#1565c0" stroke-width="2"/>
  <line x1="450" y1="190" x2="490" y2="190" stroke="#1565c0" stroke-width="2"/>

  <rect x="200" y="220" width="250" height="40" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="216" y="246" font-size="12.5" font-weight="bold" fill="#123314">010　A + B　加</text>
  <line x1="180" y1="240" x2="200" y2="240" stroke="#1565c0" stroke-width="2"/>
  <line x1="450" y1="240" x2="490" y2="240" stroke="#1565c0" stroke-width="2"/>

  <rect x="200" y="270" width="250" height="40" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="216" y="296" font-size="12.5" font-weight="bold" fill="#123314">011　A - B　减</text>
  <line x1="180" y1="290" x2="200" y2="290" stroke="#1565c0" stroke-width="2"/>
  <line x1="450" y1="290" x2="490" y2="290" stroke="#1565c0" stroke-width="2"/>

  <rect x="200" y="320" width="250" height="40" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="216" y="346" font-size="12.5" font-weight="bold" fill="#123314">100　A &amp; B　与</text>
  <line x1="180" y1="340" x2="200" y2="340" stroke="#1565c0" stroke-width="2"/>
  <line x1="450" y1="340" x2="490" y2="340" stroke="#1565c0" stroke-width="2"/>

  <rect x="200" y="370" width="250" height="40" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="216" y="396" font-size="12.5" font-weight="bold" fill="#123314">101　A | B　或</text>
  <line x1="180" y1="390" x2="200" y2="390" stroke="#1565c0" stroke-width="2"/>
  <line x1="450" y1="390" x2="490" y2="390" stroke="#1565c0" stroke-width="2"/>

  <rect x="200" y="420" width="250" height="40" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="216" y="446" font-size="12.5" font-weight="bold" fill="#123314">110　A &lt;&lt; B　左移</text>
  <line x1="180" y1="440" x2="200" y2="440" stroke="#1565c0" stroke-width="2"/>
  <line x1="450" y1="440" x2="490" y2="440" stroke="#1565c0" stroke-width="2"/>

  <rect x="200" y="470" width="250" height="40" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="216" y="496" font-size="12.5" font-weight="bold" fill="#123314">111　A &gt;&gt; B　右移</text>
  <line x1="180" y1="490" x2="200" y2="490" stroke="#1565c0" stroke-width="2"/>
  <line x1="450" y1="490" x2="490" y2="490" stroke="#1565c0" stroke-width="2"/>

  <!-- 选择器 -->
  <rect x="490" y="110" width="90" height="410" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <text x="535" y="300" font-size="14" font-weight="bold" fill="#7f3f00" text-anchor="middle">8 选 1</text>
  <text x="535" y="326" font-size="11" fill="#7f3f00" text-anchor="middle">opcode</text>
  <text x="535" y="344" font-size="11" fill="#7f3f00" text-anchor="middle">决定</text>

  <!-- opcode 输入 -->
  <rect x="470" y="560" width="130" height="36" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="535" y="584" font-size="12" font-weight="bold" fill="#7f3f00" text-anchor="middle">opcode 3 位</text>
  <line x1="535" y1="558" x2="535" y2="524" stroke="#e65100" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- 输出 -->
  <line x1="580" y1="315" x2="616" y2="315" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="620" y="288" width="150" height="54" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="695" y="321" font-size="15" font-weight="bold" fill="#0d2f5c" text-anchor="middle">结果</text>

  <!-- 说明卡 -->
  <rect x="800" y="110" width="340" height="120" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="820" y="138" font-size="13" font-weight="bold" fill="#123314">8 条路同时算</text>
  <text x="820" y="164" font-size="11.5" fill="#1b3d1e">加法器、减法器、与门、移位器…</text>
  <text x="820" y="186" font-size="11.5" fill="#1b3d1e">全部接在 A、B 上，同时算完</text>
  <text x="820" y="208" font-size="11" fill="#2e5230">不是"按需计算"，是全部算好再挑</text>

  <rect x="800" y="250" width="340" height="120" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="820" y="278" font-size="13" font-weight="bold" fill="#7f3f00">选码只做一件事：放行</text>
  <text x="820" y="304" font-size="11.5" fill="#7f3f00">opcode 一变，出去的线就换一条</text>
  <text x="820" y="326" font-size="11.5" fill="#7f3f00">内部没有 if，只有 8 选 1 的选择器</text>
  <text x="820" y="348" font-size="11" fill="#7f3f00">这也是它能一个周期出结果的原因</text>

  <rect x="800" y="390" width="340" height="120" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="820" y="418" font-size="13" font-weight="bold" fill="#311b92">直通也算一种运算</text>
  <text x="820" y="444" font-size="11.5" fill="#311b92">000 输出 A：ALU 不加工，只把 A 送出去</text>
  <text x="820" y="466" font-size="11.5" fill="#311b92">它的用处是配合写使能把 A 存下来</text>
  <text x="820" y="488" font-size="11" fill="#311b92">谁把结果接走，比结果本身更关键（523 §523.3）</text>

  <!-- 结论 -->
  <rect x="60" y="620" width="1080" height="70" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="84" y="650" font-size="14" font-weight="bold" fill="#7f3f00">ALU 不是"会算 8 种运算"，是"8 个运算器加一个选择器"</text>
  <text x="84" y="674" font-size="12" fill="#5d4037">算 10001 种运算也是同一个套路：多铺几条路，选择码多几位——代价是面积与功耗</text>

  <!-- 图例 -->
  <rect x="60" y="706" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="92" y="717" font-size="11" fill="#37474f">运算器</text>
  <rect x="276" y="706" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="308" y="717" font-size="11" fill="#37474f">输入与输出</text>
  <rect x="492" y="706" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1.5"/>
  <text x="524" y="717" font-size="11" fill="#37474f">选择器（枢纽）</text>
  <rect x="708" y="706" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="740" y="717" font-size="11" fill="#37474f">选码 opcode</text>
  <rect x="924" y="706" width="22" height="14" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="956" y="717" font-size="11" fill="#37474f">延伸说明</text>
</svg>
