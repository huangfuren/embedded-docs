<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>模拟与数字：0/1 的电压区间</title>
  <rect x="0" y="0" width="1200" height="560" fill="#ffffff"/>

  <text x="60" y="46" font-size="20" font-weight="bold" fill="#0d2f5c">数字信号不是「有电没电」，是「落在哪一段区间」</text>
  <text x="60" y="70" font-size="11" fill="#616161">来源：511 §511.1~511.2· 口径：取 3.3V 逻辑的 TTL 兼容阈值 VIH 2.0V / VIL 0.8V（纯 CMOS 惯例 0.7VDD ≈ 2.3V / 0.3VDD ≈ 1.0V），以 datasheet 为准</text>

  <!-- 电压轴刻度 -->
  <text x="140" y="132" font-size="11.5" fill="#37474f" text-anchor="end">3.3 V</text>
  <text x="140" y="232" font-size="11.5" fill="#7f0000" text-anchor="end">2.0 V</text>
  <text x="140" y="324" font-size="11.5" fill="#7f0000" text-anchor="end">0.8 V</text>
  <text x="140" y="396" font-size="11.5" fill="#37474f" text-anchor="end">0 V</text>

  <!-- 三个区间 -->
  <rect x="150" y="128" width="950" height="100" fill="#c8e6c9"/>
  <rect x="150" y="228" width="950" height="92" fill="#ffcdd2"/>
  <rect x="150" y="320" width="950" height="72" fill="#bbdefb"/>

  <line x1="150" y1="228" x2="1100" y2="228" stroke="#7f0000" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="150" y1="320" x2="1100" y2="320" stroke="#7f0000" stroke-width="1.5" stroke-dasharray="6 4"/>

  <text x="170" y="150" font-size="11.5" font-weight="bold" fill="#1b3d1e">高电平区间　&gt; 2.0 V 一律读作 1</text>
  <text x="170" y="262" font-size="11.5" font-weight="bold" fill="#7f0000">禁止区　0.8 V ~ 2.0 V，读出来是随机态</text>
  <text x="170" y="284" font-size="11" fill="#7f0000">悬空引脚就停在这里 —— 所以必须上拉/下拉（511 §511.4）</text>
  <text x="170" y="348" font-size="11.5" font-weight="bold" fill="#0d2f5c">低电平区间　&lt; 0.8 V 一律读作 0</text>

  <!-- 信号与噪声 -->
  <path d="M 170 172 L 200 164 L 230 178 L 260 166 L 290 180 L 320 168 L 350 176 L 380 162 L 410 180 L 440 170 L 470 178 L 500 166 L 530 180 L 560 170 L 590 176 L 620 200 L 640 260 L 660 320 L 675 350 L 690 366 L 720 358 L 750 372 L 780 360 L 810 370 L 840 358 L 870 372 L 900 360 L 930 370 L 960 358 L 990 370 L 1020 360 L 1050 368"
        fill="none" stroke="#e65100" stroke-width="2" stroke-linejoin="round"/>

  <text x="520" y="120" font-size="11" fill="#e65100">橙线是信号：噪声在带内来回摆，只要不越过虚线，读出来还是 1 —— 这段余量就是噪声容限</text>
  <text x="760" y="258" font-size="11" fill="#7f0000">翻转瞬间必然穿过禁止区 —— 只要穿得够快，就不会被误读</text>

  <!-- 三张结论卡 -->
  <rect x="60" y="424" width="340" height="80" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
  <text x="80" y="450" font-size="11.5" font-weight="bold" fill="#0d2f5c">① 数字 0 ≠「没电」</text>
  <text x="80" y="472" font-size="11" fill="#616161">0 是明确的低电平区间</text>
  <text x="80" y="492" font-size="11" fill="#616161">电路正常工作，只是电平低</text>

  <rect x="430" y="424" width="340" height="80" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
  <text x="450" y="450" font-size="11.5" font-weight="bold" fill="#7f0000">② 悬空 = 落在禁止区</text>
  <text x="450" y="472" font-size="11" fill="#616161">没人管就在中间漂</text>
  <text x="450" y="492" font-size="11" fill="#616161">读数随机，不是软件 bug</text>

  <rect x="800" y="424" width="340" height="80" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
  <text x="820" y="450" font-size="11.5" font-weight="bold" fill="#5d4700">③ 阈值因家族而异</text>
  <text x="820" y="472" font-size="11" fill="#616161">TTL 与 CMOS 阈值不同</text>
  <text x="820" y="492" font-size="11" fill="#616161">跨电平系统查双方 VIH/VIL</text>

  <!-- 图例 -->
  <rect x="60" y="530" width="22" height="12" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="90" y="540" font-size="11" fill="#37474f">逻辑 1 区</text>
  <rect x="180" y="530" width="22" height="12" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="210" y="540" font-size="11" fill="#37474f">禁止区</text>
  <rect x="290" y="530" width="22" height="12" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="320" y="540" font-size="11" fill="#37474f">逻辑 0 区</text>
</svg>
