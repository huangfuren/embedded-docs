<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>竞态条件：counter++ 的三步被交错，更新就蒸发了</title>
  <rect x="0" y="0" width="1200" height="520" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
    </marker>
  </defs>

  <text x="60" y="46" font-size="20" font-weight="bold" fill="#0d2f5c">竞态条件：counter++ 看着一步，硬件上是三步</text>
  <text x="60" y="70" font-size="11" fill="#616161">来源：300 板块 323 §323.1 race.c / race_fix.c 本机实录（各 100 万次 × 2 线程）· 2026-11-23</text>

  <!-- 三步分解 -->
  <text x="60" y="104" font-size="13" font-weight="bold" fill="#37474f">counter++ 的真实动作</text>

  <rect x="60" y="116" width="330" height="76" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="78" y="140" font-size="12" font-weight="bold" fill="#0d2f5c">① 读 Read</text>
  <text x="78" y="162" font-size="11" fill="#0d2f5c">把 counter 的值搬进寄存器</text>
  <text x="78" y="182" font-size="11" fill="#0d2f5c">此刻读到 100</text>

  <rect x="435" y="116" width="330" height="76" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="453" y="140" font-size="12" font-weight="bold" fill="#5d4700">② 加 Add</text>
  <text x="453" y="162" font-size="11" fill="#5d4700">寄存器里 100 + 1 = 101</text>
  <text x="453" y="182" font-size="11" fill="#5d4700">只在寄存器里，内存还没动</text>

  <rect x="810" y="116" width="330" height="76" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="828" y="140" font-size="12" font-weight="bold" fill="#123314">③ 写回 Write</text>
  <text x="828" y="162" font-size="11" fill="#1b3d1e">把 101 写回 counter</text>
  <text x="828" y="182" font-size="11" fill="#1b3d1e">到这一步别人才看得见</text>

  <line x1="390" y1="154" x2="431" y2="154" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="765" y1="154" x2="806" y2="154" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 时间轴 -->
  <text x="60" y="230" font-size="13" font-weight="bold" fill="#37474f">两个线程交错执行时，同一份读被用两次</text>

  <line x1="200" y1="252" x2="1140" y2="252" stroke="#cfd8dc" stroke-width="1.5"/>
  <text x="210" y="248" font-size="11" fill="#90a4ae">t1</text>
  <text x="450" y="248" font-size="11" fill="#90a4ae">t2</text>
  <text x="700" y="248" font-size="11" fill="#90a4ae">t3</text>
  <text x="950" y="248" font-size="11" fill="#90a4ae">t4</text>
  <text x="1146" y="256" font-size="11" fill="#90a4ae">时间</text>

  <!-- T1 泳道 -->
  <text x="60" y="292" font-size="12" font-weight="bold" fill="#0d2f5c">线程 1</text>
  <rect x="205" y="270" width="230" height="36" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="320" y="293" font-size="11" fill="#0d2f5c" text-anchor="middle">读 counter = 100</text>
  <rect x="705" y="270" width="230" height="36" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="820" y="293" font-size="11" fill="#123314" text-anchor="middle">写回 101</text>

  <!-- T2 泳道 -->
  <text x="60" y="352" font-size="12" font-weight="bold" fill="#7f0000">线程 2</text>
  <rect x="445" y="330" width="230" height="36" rx="4" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="560" y="353" font-size="11" fill="#7f0000" text-anchor="middle">读 counter = 100</text>
  <rect x="945" y="330" width="190" height="36" rx="4" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="1040" y="353" font-size="11" fill="#7f0000" text-anchor="middle">写回 101</text>

  <!-- 结果 -->
  <rect x="60" y="382" width="500" height="52" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="78" y="404" font-size="12" font-weight="bold" fill="#7f0000">加两次只长 1：两边都基于 100 算出 101</text>
  <text x="78" y="424" font-size="11" fill="#7f0000">本机三连跑：1154649 / 1079763 / 1074592（期望 2000000）</text>

  <rect x="580" y="382" width="560" height="52" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="598" y="404" font-size="12" font-weight="bold" fill="#123314">加锁后：精确 2000000</text>
  <text x="598" y="424" font-size="11" fill="#1b3d1e">锁把「读-加-写」三步包成不可分割的一整段，T2 必须等 T1 走完</text>

  <!-- 结论 -->
  <rect x="60" y="448" width="1080" height="38" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="80" y="473" font-size="12.5" fill="#7f3f00">「小概率通过」是竞态最危险的伪装 —— 数据量一大必现；所以锁只包最小必要段，别把整段逻辑锁死</text>

  <!-- 图例 -->
  <rect x="60" y="500" width="22" height="12" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="90" y="510" font-size="11" fill="#37474f">线程 1 的操作</text>
  <rect x="240" y="500" width="22" height="12" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="270" y="510" font-size="11" fill="#37474f">线程 2 的操作</text>
  <rect x="420" y="500" width="22" height="12" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="450" y="510" font-size="11" fill="#37474f">写回内存</text>
  <rect x="580" y="500" width="22" height="12" rx="3" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="610" y="510" font-size="11" fill="#37474f">加锁后的正确结果</text>
  <rect x="760" y="500" width="22" height="12" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="790" y="510" font-size="11" fill="#37474f">加法中间态（尚未写回）</text>
</svg>
