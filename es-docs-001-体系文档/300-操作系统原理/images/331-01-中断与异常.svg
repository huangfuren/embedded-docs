<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>中断与异常：两种打断，同一条处理流程</title>
  <rect x="0" y="0" width="1200" height="470" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
  </defs>

  <text x="60" y="46" font-size="20" font-weight="bold" fill="#0d2f5c">中断与异常：两种来源，一条处理流程</text>
  <text x="60" y="70" font-size="11" fill="#616161">来源：300 板块 331 §331.1 · 口径：Cortex-M 视角，Linux 与 FreeRTOS 双线 · 2026-11-23</text>

  <!-- 中断 vs 异常 -->
  <rect x="60" y="96" width="520" height="94" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>
  <text x="80" y="120" font-size="13" font-weight="bold" fill="#0d2f5c">中断 Interrupt —— 外设发起，异步</text>
  <text x="80" y="144" font-size="11.5" fill="#0d2f5c">串口来了一个字节、定时器到点了、按键按下了</text>
  <text x="80" y="166" font-size="11.5" fill="#0d2f5c">你不知道它什么时候来 —— 硬件驱动软件的引擎</text>
  <text x="80" y="184" font-size="11" fill="#1565c0">硬件主动打断，CPU 只能被动响应</text>

  <rect x="620" y="96" width="520" height="94" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="2"/>
  <text x="640" y="120" font-size="13" font-weight="bold" fill="#5d4700">异常 Exception —— 程序自己，同步</text>
  <text x="640" y="144" font-size="11.5" fill="#5d4700">除零、访问未映射的页（缺页）、主动执行 svc/syscall</text>
  <text x="640" y="166" font-size="11.5" fill="#5d4700">执行到那条指令就必然发生 —— 程序求助内核的入口</text>
  <text x="640" y="184" font-size="11" fill="#5d4700">两者常合称「异常与中断」</text>

  <!-- 处理流程 -->
  <text x="60" y="224" font-size="13" font-weight="bold" fill="#37474f">硬件处理流程：五步，且第一步与最后一步由硬件自动完成</text>

  <rect x="60" y="238" width="200" height="86" rx="6" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="76" y="262" font-size="12" font-weight="bold" fill="#37474f">① 事件到达</text>
  <text x="76" y="284" font-size="11" fill="#37474f">外设拉中断线，</text>
  <text x="76" y="304" font-size="11" fill="#37474f">或程序触发异常</text>

  <rect x="280" y="238" width="200" height="86" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="296" y="262" font-size="12" font-weight="bold" fill="#123314">② 保存现场</text>
  <text x="296" y="284" font-size="11" fill="#1b3d1e">关键寄存器自动压栈</text>
  <text x="296" y="304" font-size="11" fill="#1b3d1e">—— 硬件干的，不写代码</text>

  <rect x="500" y="238" width="200" height="86" rx="6" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="516" y="262" font-size="12" font-weight="bold" fill="#37474f">③ 查表跳转</text>
  <text x="516" y="284" font-size="11" fill="#37474f">按编号查中断向量表，</text>
  <text x="516" y="304" font-size="11" fill="#37474f">跳到 ISR 入口</text>

  <rect x="720" y="238" width="200" height="86" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="736" y="262" font-size="12" font-weight="bold" fill="#7f3f00">④ 执行 ISR</text>
  <text x="736" y="284" font-size="11" fill="#7f3f00">快进快出：取数据、</text>
  <text x="736" y="304" font-size="11" fill="#7f3f00">置标志，重活往下交</text>

  <rect x="940" y="238" width="200" height="86" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="956" y="262" font-size="12" font-weight="bold" fill="#123314">⑤ 恢复现场</text>
  <text x="956" y="284" font-size="11" fill="#1b3d1e">寄存器装回去，</text>
  <text x="956" y="304" font-size="11" fill="#1b3d1e">回到被打断的那条指令</text>

  <line x1="260" y1="281" x2="276" y2="281" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="281" x2="496" y2="281" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="281" x2="716" y2="281" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="920" y1="281" x2="936" y2="281" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ISR 纪律 -->
  <rect x="60" y="346" width="1080" height="72" rx="6" fill="#fafafa" stroke="#cfd8dc" stroke-width="1"/>
  <text x="80" y="368" font-size="12" font-weight="bold" fill="#37474f">ISR 四条纪律（嵌入式面试最高频、事故最高发）</text>
  <text x="80" y="390" font-size="11" fill="#37474f">快进快出 ｜ 不调用 printf / 延时 ｜ 共享数据要同步 ｜ 重活留给下半部（主循环或内核延迟机制）</text>
  <text x="80" y="410" font-size="11" fill="#616161">上半部只「取数据、置标志」，下半部慢慢做 —— 裸机的等价物就是「ISR 置标志 + 主循环查标志」</text>

  <!-- 图例 -->
  <rect x="60" y="440" width="22" height="12" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="90" y="450" font-size="11" fill="#37474f">中断（外设异步）</text>
  <rect x="240" y="440" width="22" height="12" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="270" y="450" font-size="11" fill="#37474f">异常（程序同步）</text>
  <rect x="420" y="440" width="22" height="12" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="450" y="450" font-size="11" fill="#37474f">硬件自动完成</text>
  <rect x="590" y="440" width="22" height="12" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="620" y="450" font-size="11" fill="#37474f">ISR（软件纪律区）</text>
  <rect x="790" y="440" width="22" height="12" rx="3" fill="#fafafa" stroke="#cfd8dc" stroke-width="1"/>
  <text x="820" y="450" font-size="11" fill="#37474f">纪律清单</text>
</svg>
