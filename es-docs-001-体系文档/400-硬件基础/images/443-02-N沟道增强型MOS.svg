  <rect width="1560" height="640" fill="#ffffff" />

  
  <text x="24" y="55" class="text-base title">绝缘栅型场效应管[MOS管] -&gt; N沟道增强型</text>

  
  <text x="32" y="132" class="text-base sec-red">MOS管的作用：</text>
  <text x="32" y="168" class="text-base sec-red">1. 开关</text>
  <text x="32" y="200" class="text-base sec-red">2. 控制电路 [放大电路]</text>

  
  <text x="20" y="264" class="text-base sec-blue">链接方式：</text>
  <text x="142" y="264" class="text-base sec-red">MOS管的链接技巧：反接漏极处的寄生二极管即可</text>

  <text x="20" y="302" class="text-base sec-blue">1. 漏极链接电源负极，源极链接电源正极，栅极不管 --&gt; MOS管</text>
  <text x="20" y="334" class="text-base sec-blue">可以导通 --&gt; 但是<tspan fill="#e61c1c">无意义</tspan></text>

  <text x="20" y="382" class="text-base sec-blue">2. 正确的链接方式：</text>
  <text x="20" y="414" class="text-base sec-blue">a. 栅极g链接小电源的正极，源极s链接小电源的负极 --&gt; 在N沟道</text>
  <text x="20" y="444" class="text-base sec-blue">mos管中形成 N 沟道 [增强型]</text>
  <text x="20" y="474" class="text-base sec-blue">电流方向：<tspan fill="#e61c1c">栅极g --&gt; 源极s</tspan></text>

  <text x="20" y="506" class="text-base sec-blue">b. 漏极d链接大电路的正极，源极s链接大电路的负极 --&gt; 电流就可以</text>
  <text x="20" y="536" class="text-base sec-blue">通过刚刚形成的N沟道,导通大电路</text>
  <text x="20" y="566" class="text-base sec-blue">电流方向：<tspan fill="#e61c1c">漏极d --&gt; 源极s</tspan></text>


  
  
  
  <text x="985" y="42" text-anchor="middle" class="text-base sec-red">漏极处的二极管非常重要</text>
  <text x="985" y="70" text-anchor="middle" class="text-base sec-blue">MOS管的寄生二极管</text>
  
