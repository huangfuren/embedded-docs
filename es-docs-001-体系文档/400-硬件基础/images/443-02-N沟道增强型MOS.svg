<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 640">
  <defs>
    <style>
      .text-base {
        font-family: "PingFang SC", "Microsoft YaHei", "SimHei", sans-serif;
        font-weight: bold;
      }
      .title { font-size: 26px; fill: #000000; }
      .sec-red { font-size: 17px; fill: #e61c1c; }
      .sec-blue { font-size: 16px; fill: #0095ff; }
      .sec-orange { font-size: 16px; fill: #ff7700; }
      .sec-purple { font-size: 15px; fill: #8b3a8b; }
      .label-blk { font-size: 16px; fill: #000000; }
      .label-wht { font-size: 16px; fill: #ffffff; }
      .sub-p { font-size: 26px; fill: #000000; }
      .sub-n { font-size: 15px; fill: #000000; }
