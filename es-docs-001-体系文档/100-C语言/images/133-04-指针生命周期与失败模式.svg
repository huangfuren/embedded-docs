<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="1200" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#388e3c"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="20" font-weight="bold" fill="#1b5e20">133 · 指针的一生：五个步骤与各自的失败模式</text>
  <text x="1160" y="46" font-size="12" fill="#616161" text-anchor="end">来源：133 §133.2~133.4 本机实测 · C17 · 2026-11-23</text>

  <text x="40" y="86" font-size="12" fill="#37474f">指针只有出生、使用、死亡三个时刻；五步之间每漏一步，失败就落在不同的位置上</text>

  <rect x="40" y="108" width="200" height="104" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="58" y="132" font-size="15" font-weight="bold" fill="#388e3c">①</text>
  <text x="58" y="156" font-size="15" font-weight="bold" fill="#123314">声明</text>
  <text x="58" y="180" font-size="12" fill="#1b3d1e" font-family="ui-monospace,Menlo,Consolas,monospace">int *p;</text>
  <text x="58" y="200" font-size="11" fill="#616161">起点：只占了 8 字节地址位</text>

  <line x1="242" y1="160" x2="256" y2="160" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="260" y="108" width="200" height="104" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="278" y="132" font-size="15" font-weight="bold" fill="#388e3c">②</text>
  <text x="278" y="156" font-size="15" font-weight="bold" fill="#123314">赋有效地址</text>
  <text x="278" y="180" font-size="12" fill="#1b3d1e" font-family="ui-monospace,Menlo,Consolas,monospace">p = &amp;x;</text>
  <text x="278" y="200" font-size="11" fill="#c62828">漏② → 野指针</text>

  <line x1="462" y1="160" x2="476" y2="160" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="480" y="108" width="200" height="104" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="498" y="132" font-size="15" font-weight="bold" fill="#388e3c">③</text>
  <text x="498" y="156" font-size="15" font-weight="bold" fill="#123314">使用前判空</text>
  <text x="498" y="180" font-size="12" fill="#1b3d1e" font-family="ui-monospace,Menlo,Consolas,monospace">p == NULL ?</text>
  <text x="498" y="200" font-size="11" fill="#c62828">漏③ → 段错误</text>

  <line x1="682" y1="160" x2="696" y2="160" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="700" y="108" width="200" height="104" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="718" y="132" font-size="15" font-weight="bold" fill="#388e3c">④</text>
  <text x="718" y="156" font-size="15" font-weight="bold" fill="#123314">解引用读写</text>
  <text x="718" y="180" font-size="12" fill="#1b3d1e" font-family="ui-monospace,Menlo,Consolas,monospace">*p;   p + 1</text>
  <text x="718" y="200" font-size="11" fill="#c62828">越界 → 踩别人格子</text>

  <line x1="902" y1="160" x2="916" y2="160" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="920" y="108" width="200" height="104" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="938" y="132" font-size="15" font-weight="bold" fill="#388e3c">⑤</text>
  <text x="938" y="156" font-size="15" font-weight="bold" fill="#123314">释放并置空</text>
  <text x="938" y="180" font-size="12" fill="#1b3d1e" font-family="ui-monospace,Menlo,Consolas,monospace">free(p); p = NULL;</text>
  <text x="938" y="200" font-size="11" fill="#c62828">漏⑤ → 泄漏、悬空</text>

  <text x="40" y="248" font-size="17" font-weight="bold" fill="#263238">指针的三种处境：只有第一种可以解引用</text>

  <rect x="40" y="262" width="360" height="72" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="60" y="290" font-size="15" font-weight="bold" fill="#123314">有效指针</text>
  <text x="60" y="314" font-size="11.5" fill="#1b3d1e">非空且指向有效内存，读、写、算都合法</text>

  <rect x="420" y="262" width="360" height="72" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="440" y="290" font-size="15" font-weight="bold" fill="#7f3f00">NULL</text>
  <text x="440" y="314" font-size="11.5" fill="#7f3f00">判空拦住就不崩，但也说明此处无数据可用</text>

  <rect x="800" y="262" width="360" height="72" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="820" y="290" font-size="15" font-weight="bold" fill="#7f0000">野指针 / 悬空指针</text>
  <text x="820" y="314" font-size="11.5" fill="#7f0000">未赋值，或 free 后没置空 —— 解引用就是雷</text>

  <rect x="40" y="352" width="1120" height="52" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="62" y="384" font-size="13" font-weight="bold" fill="#5d4037">五步里最容易被跳过的是 ③ 和 ⑤：一个让你崩，一个让你泄漏——两者都不报编译错误</text>

  <rect x="40" y="420" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="72" y="432" font-size="12" fill="#37474f">正常步骤 / 有效指针</text>
  <rect x="240" y="420" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="272" y="432" font-size="12" fill="#37474f">已判空的指针</text>
  <rect x="420" y="420" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="452" y="432" font-size="12" fill="#37474f">危险指针（漏一步的后果）</text>
  <line x1="640" y1="427" x2="682" y2="427" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="694" y="432" font-size="12" fill="#37474f">正常推进顺序</text>
</svg>
