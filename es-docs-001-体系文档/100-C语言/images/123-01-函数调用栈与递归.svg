<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="1200" height="490" fill="#ffffff"/>
  <defs>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#388e3c"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="20" font-weight="bold" fill="#263238">123 · 调用栈与递归：fact(3) 的压栈与回归</text>
  <text x="1160" y="46" font-size="12" fill="#616161" text-anchor="end">来源：123 §123.7 · 141 §141.1 栈 · C17 · 2026-11-23</text>

  <text x="100" y="86" font-size="15" font-weight="bold" fill="#1b5e20">压栈：每层调用占一帧，栈顶在上</text>
  <text x="520" y="86" font-size="15" font-weight="bold" fill="#0d47a1">回归：返回值沿调用链回传</text>

  <rect x="100" y="96" width="280" height="60" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="118" y="120" font-size="15" font-weight="bold" fill="#123314">fact(1)</text>
  <text x="118" y="142" font-size="11.5" fill="#1b3d1e">n=1，命中出口，直接 return 1</text>
  <text x="86" y="132" font-size="11" fill="#616161" text-anchor="end">栈顶</text>

  <rect x="100" y="168" width="280" height="60" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="118" y="192" font-size="15" font-weight="bold" fill="#123314">fact(2)</text>
  <text x="118" y="214" font-size="11.5" fill="#1b3d1e">n=2，等 fact(1) 的结果</text>

  <rect x="100" y="240" width="280" height="60" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="118" y="264" font-size="15" font-weight="bold" fill="#123314">fact(3)</text>
  <text x="118" y="286" font-size="11.5" fill="#1b3d1e">n=3，等 fact(2) 的结果</text>

  <rect x="100" y="312" width="280" height="60" rx="6" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <text x="118" y="336" font-size="15" font-weight="bold" fill="#37474f">main</text>
  <text x="118" y="358" font-size="11.5" fill="#546e7a">停在这一行等 fact(3) 返回</text>
  <text x="86" y="348" font-size="11" fill="#616161" text-anchor="end">栈底</text>

  <rect x="520" y="252" width="300" height="48" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="538" y="282" font-size="13" font-weight="bold" fill="#7f3f00">fact(1) 返回 1</text>
  <text x="700" y="282" font-size="11.5" fill="#5d4700">碰到出口，递进结束</text>

  <rect x="520" y="180" width="300" height="48" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="538" y="210" font-size="13" font-weight="bold" fill="#7f3f00">fact(2) = 2 × 1 = 2</text>
  <text x="712" y="210" font-size="11.5" fill="#5d4700">拿到结果才能算自己</text>

  <line x1="670" y1="252" x2="670" y2="232" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="520" y="108" width="300" height="48" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="538" y="138" font-size="13" font-weight="bold" fill="#7f3f00">fact(3) = 3 × 2 = 6</text>
  <text x="712" y="138" font-size="11.5" fill="#5d4700">逐层向上回传</text>

  <line x1="670" y1="180" x2="670" y2="160" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="860" y="108" width="280" height="192" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="880" y="136" font-size="13" font-weight="bold" fill="#263238">两条链要分开看</text>
  <text x="880" y="162" font-size="11.5" fill="#37474f">递进：main → fact(3) → fact(2) → fact(1)</text>
  <text x="880" y="186" font-size="11.5" fill="#37474f">回归：fact(1) → fact(2) → fact(3) → main</text>
  <text x="880" y="216" font-size="11.5" fill="#37474f">压栈和出栈严格后进先出</text>
  <text x="880" y="240" font-size="11.5" fill="#37474f">返回时逐帧销毁，栈恢复原状</text>
  <text x="880" y="270" font-size="11.5" fill="#616161">main 最终收到 6</text>

  <rect x="40" y="396" width="1120" height="56" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="62" y="420" font-size="13" font-weight="bold" fill="#5d4037">递归深度 = 栈帧层数：没有出口或层数太深就是栈溢出</text>
  <text x="62" y="442" font-size="12" fill="#5d4037">写递归先写出口，并且让实参每次变化都朝出口走——否则压栈永远停不下来</text>

  <rect x="40" y="464" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="72" y="476" font-size="12" fill="#37474f">被调函数的栈帧</text>
  <rect x="240" y="464" width="22" height="14" rx="3" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <text x="272" y="476" font-size="12" fill="#37474f">调用者 main 的栈帧</text>
  <rect x="460" y="464" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="492" y="476" font-size="12" fill="#37474f">回归时的返回值</text>
  <line x1="660" y1="471" x2="702" y2="471" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="714" y="476" font-size="12" fill="#37474f">回传方向（自下而上）</text>
</svg>
