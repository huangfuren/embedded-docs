  <path d="M 100 318 C 133.3 312.2 233.3 294.3 300 283 C 366.7 271.7 433.3 264.7 500 250 C 566.7 235.3 640.0 216.7 700 195 C 760.0 173.3 833.3 132.5 860 120" fill="none" stroke="#c62828" stroke-width="2"/>
  <path d="M 100 318 C 116.7 314.0 166.7 302.0 200 294 C 233.3 286.0 263.3 283.2 300 270 C 336.7 256.8 383.3 235.0 420 215 C 456.7 195.0 493.3 167.2 520 150 C 546.7 132.8 566.7 120.3 580 112 C 593.3 103.7 596.7 102.0 600 100" fill="none" stroke="#7f0000" stroke-width="2"/>

  <text x="880" y="322" font-size="11.5" fill="#546e7a">O(1) 常数</text>
  <text x="880" y="300" font-size="11.5" fill="#388e3c">O(log n)</text>
  <text x="880" y="266" font-size="11.5" fill="#1565c0">O(√n)</text>
  <text x="880" y="226" font-size="11.5" fill="#8d6e00">O(n)</text>
  <text x="880" y="169" font-size="11.5" fill="#5e35b1">O(n log n)</text>
  <text x="880" y="124" font-size="11.5" fill="#c62828">O(n²)</text>
  <text x="612" y="104" font-size="11.5" font-weight="bold" fill="#7f0000">O(n³)</text>

  <rect x="600" y="336" width="240" height="46" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="618" y="356" font-size="11" fill="#37474f">n 翻倍：O(n) 翻倍</text>
  <text x="618" y="374" font-size="11" fill="#37474f">O(n²) 变 4 倍，O(n³) 变 8 倍</text>

  <rect x="40" y="390" width="1120" height="34" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="62" y="412" font-size="13" font-weight="bold" fill="#5d4037">选算法先看阶：n 小的时候差不多，n 一大就只剩低阶的还跑得动</text>

  <line x1="40" y1="457" x2="82" y2="457" stroke="#90a4ae" stroke-width="2"/>
  <text x="94" y="462" font-size="12" fill="#37474f">O(1)</text>
