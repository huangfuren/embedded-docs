  <text x="834" y="462" font-size="12" fill="#37474f">O(n²)</text>
  <line x1="910" y1="457" x2="952" y2="457" stroke="#7f0000" stroke-width="2"/>
  <text x="964" y="462" font-size="12" fill="#37474f">O(n³)</text>
